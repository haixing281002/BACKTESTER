<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightyear</title>
<!-- served from lightyear/static/vendor so the page works offline and behind a corporate proxy -->
<script src="/static/vendor/plotly.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#dfe4ea;
  --navy:#1f4e79; --navy2:#163a5c; --amber:#d98324; --green:#2e7d4f; --red:#b3261e; --grey:#8a96a3;
  --pass:#e3f3e8; --fail:#fbe5e3; --na:#eceef1; --run:#fff4e0; --code:#f7f9fb; --soft:#eef3f8;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI", Arial, sans-serif}
header{background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{font-weight:700;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
.brand small{font-weight:400;opacity:.7;font-size:12px}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border-radius:20px;padding:3px 10px;font-size:12px}
.chip.ok::before{content:"● ";color:#7fd69a}.chip.bad::before{content:"● ";color:#ff9a8f}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 54px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
main{padding:20px 24px;overflow:auto;min-width:0}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--ink)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{background:var(--navy2)}
button.danger{color:var(--red);border-color:#e7b7b2}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.runlist{list-style:none;margin:12px 0 0;padding:0}
.runlist li{padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.runlist li:hover{background:var(--bg)}
.runlist li.sel{border-color:var(--navy);background:var(--soft)}
.runlist .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runlist .s{font-size:11px;color:var(--muted)}
.pill{display:inline-block;border-radius:12px;padding:1px 9px;font-size:11px;font-weight:600;background:var(--na);color:var(--muted)}
.pill.phase_a,.pill.phase_b,.pill.building,.pill.revising{background:var(--run);color:#8a5a00}
.pill.gate_a,.pill.gate_b{background:#e5eef8;color:var(--navy)}
.pill.decided{background:var(--pass);color:var(--green)}
.pill.failed,.pill.cancelled,.pill.interrupted,.pill.stopped{background:var(--fail);color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.card h3{margin:16px 0 8px;font-size:14px;color:var(--navy)}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{border:2px dashed #b9c6d4;border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;background:#fafcfe}
.drop.over{border-color:var(--navy);background:var(--soft)}
.drop b{color:var(--navy)}
/* stage tracker */
.track{display:flex;align-items:stretch;overflow-x:auto;padding:4px 0 6px}
.st{flex:1;min-width:96px;text-align:center;position:relative;padding:30px 4px 0;font-size:11.5px;line-height:1.3;color:var(--muted)}
.st::before{content:"";position:absolute;top:13px;left:0;right:0;height:3px;background:var(--line)}
.st:first-child::before{left:50%}.st:last-child::before{right:50%}
.st .dot{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:21px;height:21px;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:1}
.st.gate .dot{border-radius:4px;transform:translateX(-50%) rotate(45deg)}
.st.done .dot{background:var(--navy);border-color:var(--navy)} .st.done::before{background:var(--navy)}
.st.running .dot{border-color:var(--amber);background:#fff;animation:pulse 1.2s infinite}
.st.running{color:var(--ink);font-weight:600}
.st.gate{color:var(--navy);font-weight:700}
.st.halt .dot{border-color:var(--red)} .st.halt{color:var(--red)}
.st .id{display:block;font-family:var(--mono);font-size:10.5px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,131,36,.6)}70%{box-shadow:0 0 0 9px rgba(217,131,36,0)}100%{box-shadow:0 0 0 0 rgba(217,131,36,0)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;flex-wrap:wrap}
.tab{padding:8px 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted)}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tab.tech{margin-left:auto;font-size:12px}
.tab .badge{background:var(--amber);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;margin-left:5px}
/* progress */
.eta{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.eta .big{font-size:26px;font-weight:700;color:var(--navy)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar > div{height:100%;background:linear-gradient(90deg,var(--navy),#3d7ab3);border-radius:6px;transition:width .8s ease}
.bar.indet > div{width:35%!important;animation:slide 1.6s infinite ease-in-out}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.now{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:8px;padding:12px 14px}
.now .spin{width:18px;height:18px;border:3px solid #c9d7e6;border-top-color:var(--navy);border-radius:50%;animation:rot 1s linear infinite;flex:none;margin-top:2px}
@keyframes rot{to{transform:rotate(360deg)}}
.fact{min-height:150px;display:flex;flex-direction:column;justify-content:center;padding:6px 4px}
.fact .kind{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);font-weight:700}
.fact .txt{font-size:18px;line-height:1.55;margin-top:6px;transition:opacity .4s}
.fact .src{font-size:12px;color:var(--muted);margin-top:10px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer}
.dots span.on{background:var(--navy)}
/* log */
.log{background:#0f1720;color:#d8dee6;font:12px/1.55 var(--mono);border-radius:8px;padding:12px;height:560px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .e{padding:2px 0;border-bottom:1px solid #1b2633}
.log .k{display:inline-block;width:62px;color:#7b8794}
.log .text{color:#e8edf2} .log .tool{color:#8fb8e8} .log .tool_out{color:#8d99a6}
.log .stage{color:#ffc56b;font-weight:700} .log .gate{color:#7fd69a;font-weight:700}
.log .error,.log .tool_error{color:#ff8f86} .log .result{color:#c9a7ff} .log .server{color:#9fd3c7}
pre.yaml,pre.code{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);overflow:auto;max-height:620px;margin:0}
.yk{color:var(--navy);font-weight:600}.yc{color:#7b8794;font-style:italic}.ys{color:#2e7d4f}
.md{line-height:1.6}.md table{border-collapse:collapse;margin:8px 0;font-size:13px}.md th,.md td{border:1px solid var(--line);padding:4px 8px}
.md th{background:var(--soft)}.md code{background:var(--code);padding:1px 4px;border-radius:4px;font-size:12px}
.md pre{background:var(--code);padding:10px;border-radius:6px;overflow:auto}
.md h1{font-size:18px;color:var(--navy)}.md h2{font-size:16px;color:var(--navy)}.md h3{font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:19px;font-weight:700;color:var(--navy)}
.kpi .b{font-size:12px;color:var(--amber)}
.chart{height:340px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;font-weight:600}
table.t td{border-bottom:1px solid var(--line);padding:7px 9px;vertical-align:top}
td.PASS{background:var(--pass);color:var(--green);font-weight:700;text-align:center}
td.FAIL{background:var(--fail);color:var(--red);font-weight:700;text-align:center}
td.NA{background:var(--na);color:var(--muted);text-align:center}
.tag{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.ok,.tag.held,.tag.low{background:var(--pass);color:var(--green)}
.tag.warn,.tag.proxy,.tag.fetch,.tag.medium{background:var(--run);color:#8a5a00}
.tag.bad,.tag.missing,.tag.high{background:var(--fail);color:var(--red)}
.decide{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.decide button{min-width:110px;font-weight:600}
.decide button.on{outline:3px solid var(--amber)}
.d-APPROVE{color:var(--green)} .d-REJECT{color:var(--red)} .d-FIX{color:#8a5a00} .d-OBSERVE{color:var(--navy)}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.banner.err{background:var(--fail);color:var(--red)} .banner.info{background:#e5eef8;color:var(--navy)}
.banner.ok{background:var(--pass);color:var(--green)}
.path{font:12px var(--mono);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:5px 8px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.path span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path button{padding:2px 8px;font-size:11px}
.facts{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px}
.facts > div:nth-child(odd){color:var(--muted)}
.lead{font-size:18px;font-weight:600;color:var(--ink);line-height:1.45;margin:0 0 8px}
ol.steps{margin:6px 0 0;padding-left:22px} ol.steps li{margin:4px 0}
.chk{display:grid;grid-template-columns:26px 1fr;gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.chk.on{border-color:var(--green);background:#f6fbf7}
.chk input{width:18px;height:18px;margin-top:2px}
.chk .it{font-weight:600}
.chk .sub{grid-column:2;font-size:12.5px;color:var(--muted)}
.chk .sub b{color:var(--ink);font-weight:600}
.gap{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:0}
.gap .e{grid-column:2;font-size:12.5px;color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pn ul{list-style:none;padding:0;margin:0}
.pn li{padding:8px 10px 8px 34px;position:relative;border-bottom:1px solid var(--line)}
.pn li:last-child{border-bottom:0}
.pn .pos li::before{content:"▲";position:absolute;left:10px;color:var(--green)}
.pn .neg li::before{content:"▼";position:absolute;left:10px;color:var(--red)}
.pn h3{margin-top:0}
.src{font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;margin-left:6px}
details{margin-top:6px} summary{cursor:pointer;color:var(--navy);font-weight:600}
.hide{display:none!important}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.grid2,.kpis,.pn{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="#fff" stroke-width="2" opacity=".5"/><path d="M5 22 L16 9 L27 22" stroke="#d98324" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="9" r="2.6" fill="#fff"/></svg>
    Lightyear <small id="ver"></small>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <aside>
    <button class="primary" style="width:100%" onclick="showNew()">+ New paper</button>
    <ul class="runlist" id="runlist"></ul>
  </aside>
  <main id="main"></main>
</div>

<template id="tpl-new">
  <div class="card" style="max-width:760px">
    <h2>Run a paper through the pipeline</h2>
    <p class="muted small">Lightyear reads the paper and writes a strategy card up to Gate A. After you approve it, it runs the backtest on Indian data and prepares Gate B. You make the decision at Gate B.</p>
    <div class="drop" id="drop"><b>Drop a PDF here</b> or click to choose<br><span class="small" id="dropname">No file chosen</span>
      <input type="file" id="file" accept="application/pdf" class="hide"></div>
    <label>…or a paper already in docs/papers</label>
    <select id="existing"><option value="">(none)</option></select>
    <div class="grid2">
      <div><label>Your name (operator)</label><input id="operator" placeholder="Your name"></div>
      <div><label>Model for Claude Code</label>
        <select id="model"><option value="">Your Claude Code default</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option></select></div>
    </div>
    <label class="row" style="color:var(--ink);font-size:13px;margin-top:14px"><input type="checkbox" id="auto" style="width:auto"> Don't wait at Gate A (show the card, keep going; Gate B is still a stop)</label>
    <div class="row" style="margin-top:16px"><button class="primary" id="go" onclick="startRun()">Start run</button><span class="small muted" id="newmsg"></span></div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let H = null, CUR = null, ST = null, LOGNEXT = 0, TAB = null, USER_TAB = false, POLL = null, CHARTED = null, DEC = null;
let GA_SIG = null, RES_SIG = null, GB_SIG = null, F_SIG = null, P_SIG = null;
const RUNNING = ["phase_a","phase_b","building","revising"];
const STATUS_TEXT = {phase_a:"Reading the paper", gate_a:"At Gate A", revising:"Revising the card", phase_b:"Running the backtest",
  building:"Building charts + workbook", gate_b:"At Gate B", decided:"Decided", failed:"Failed", stopped:"Stopped",
  cancelled:"Cancelled", interrupted:"Interrupted"};

// General knowledge shown while a run works and before the paper's own facts arrive.
const TRIVIA = [
 ["term","Sharpe ratio: the return above cash divided by how much the returns swing. William Sharpe introduced it in 1966 as the 'reward-to-variability' ratio."],
 ["term","Drawdown: how far a portfolio has fallen from its highest point so far. A 20% drawdown needs a 25% gain just to get back to even."],
 ["history","Momentum was documented by Jegadeesh and Titman in 1993: US stocks that had risen most over the past 3 to 12 months kept outperforming the biggest fallers for months afterwards."],
 ["history","The National Stock Exchange of India was set up in 1992 and began equity trading in 1994, bringing fully electronic, screen-based trading to Indian markets."],
 ["history","The NIFTY 50 index starts from a base value of 1,000 on 3 November 1995."],
 ["data","Lightyear's prices come from the NSE bhavcopy: the exchange's end-of-day file with the open, high, low, close and volume of every traded security."],
 ["history","India finished moving its stock market to T+1 settlement in January 2023, among the first major markets to do so: trades settle the next working day."],
 ["term","Survivorship bias: testing only on companies that still exist today makes any strategy look better, because the failures have quietly dropped out of the data."],
 ["term","Look-ahead bias: using information in a backtest before it was actually available. Lightyear's backtests shift every signal by at least a day to avoid it."],
 ["history","Harry Markowitz's 1952 paper 'Portfolio Selection' founded modern portfolio theory; he shared the 1990 Nobel prize in economics with William Sharpe and Merton Miller."],
 ["history","Fama and French's 1993 three-factor model explains stock returns with three drivers: the market, company size and value (cheap versus expensive stocks)."],
 ["term","Overfitting: try enough variations and one will look brilliant by luck. The 'deflated Sharpe ratio' (Bailey and López de Prado, 2014) corrects for how many were tried."],
 ["term","Bootstrap: re-sampling the actual returns thousands of times to see how much a result could vary by chance. Bradley Efron introduced the method in 1979."],
 ["trivia","Rule of 72: divide 72 by a yearly growth rate to estimate the years needed to double. At 12% a year, money doubles in about six years."],
 ["term","Free float: the shares actually available to trade, leaving out promoter and other locked-in holdings. NIFTY indices have been free-float weighted since 2009."],
 ["history","Momentum can crash: after the 2009 market bottom, past losers rebounded so sharply that classic momentum strategies lost heavily (Daniel and Moskowitz, 'Momentum Crashes', 2016)."],
 ["term","CAGR (compound annual growth rate): the steady yearly rate that would turn the starting value into the ending value over the same period."],
 ["term","Volatility: how much returns swing, usually quoted per year. Daily volatility is scaled up by the square root of 252, the approximate number of trading days in a year."],
 ["term","Point-in-time data: what was actually known on each past date. Using today's restated figures in a backtest quietly leaks the future into the past."],
 ["history","'Betting Against Beta' (Frazzini and Pedersen, 2014) found that low-risk stocks have tended to earn more per unit of risk than high-risk stocks, across many markets."],
 ["term","Turnover: how much of the portfolio is traded each year. High turnover means high costs, which can quietly eat a strategy's edge."],
 ["trivia","Lightyear has two checkpoints. At Gate A you approve what will be tested. At Gate B you decide what to do with the result: no model ever makes that call."],
];

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok){ let m; try{m=(await r.json()).detail}catch(e){m=r.statusText} throw new Error(m) } return r.json() }
function md(s){ if(window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(s||"")); return "<pre class='code'>"+esc(s)+"</pre>" }
function pct(x,d=1){ return (x==null||isNaN(x)) ? "–" : (x*100).toFixed(d)+"%" }
function num(x,d=2){ return (x==null||isNaN(x)) ? "–" : Number(x).toFixed(d) }
function mins(m){ if(m==null) return "–"; if(m < 1) return "under a minute"; const r = Math.round(m); return r >= 60 ? `${Math.floor(r/60)} h ${r%60} min` : `${r} min` }
function ago(iso){ if(!iso) return ""; const s = (Date.now() - new Date(iso).getTime())/1000; return s < 60 ? "just now" : s < 3600 ? `${Math.round(s/60)} min ago` : "" }
function yamlHL(s){ return esc(s).split("\n").map(l => {
  if(/^\s*#/.test(l)) return `<span class="yc">${l}</span>`;
  const m = l.match(/^(\s*-?\s*)([A-Za-z0-9_\-\.]+)(:)(.*)$/);
  return m ? `${m[1]}<span class="yk">${m[2]}</span>${m[3]}<span class="ys">${m[4]}</span>` : l }).join("\n") }
function copy(t, btn){ navigator.clipboard?.writeText(t).then(()=>{ if(btn){const o=btn.textContent; btn.textContent="copied"; setTimeout(()=>btn.textContent=o,1200)} }) }
function stageName(id){ const all = [...(H?.stages?.A||[]), ...(H?.stages?.B||[])]; const s = all.find(x=>x[0]===id); return s ? s[1] : id }

async function boot(){
  H = await api("/api/health");
  $("#ver").textContent = "v"+H.version;
  $("#chips").innerHTML = `<span class="chip ${H.claude?'ok':'bad'}">Claude Code ${H.claude?'found':'missing'}</span>
    <span class="chip ${H.libreoffice?'ok':'bad'}">LibreOffice ${H.libreoffice?'ready':'missing'}</span>
    <span class="chip">local only · 127.0.0.1</span>`;
  await refreshRuns();
  const qtab = new URLSearchParams(location.search).get("tab"); if(qtab){ TAB = qtab; USER_TAB = true }
  const want = location.hash.slice(1) || LS.get("ly_run","");
  if(want) openRun(want).catch(showNew); else showNew();
}

async function refreshRuns(){
  const runs = await api("/api/runs");
  $("#runlist").innerHTML = runs.length ? runs.map(r => `<li class="${r.id===CUR?'sel':''}" onclick="openRun('${r.id}')">
     <div class="t">${esc(r.paper_title || r.slug)}</div>
     <div class="s"><span class="pill ${r.status}">${esc(STATUS_TEXT[r.status]||r.status)}</span> ${esc((r.created||"").replace("T"," ").slice(0,16))}</div></li>`).join("")
    : `<li class="muted small" style="cursor:default">No runs yet.</li>`;
}

async function showNew(){
  CUR = null; clearInterval(POLL); clearInterval(FACT_T); location.hash = "";
  $("#main").innerHTML = ""; $("#main").appendChild($("#tpl-new").content.cloneNode(true));
  $("#operator").value = LS.get("ly_operator","");
  (await api("/api/papers")).forEach(p => $("#existing").insertAdjacentHTML("beforeend", `<option>${esc(p)}</option>`));
  const drop = $("#drop"), file = $("#file");
  drop.onclick = () => file.click();
  file.onchange = () => { $("#dropname").textContent = file.files[0]?.name || "No file chosen" };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over") };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if(e.dataTransfer.files[0]){ file.files = e.dataTransfer.files; file.onchange() } };
  if(H?.active_run) $("#newmsg").textContent = "A run is still working; Lightyear runs one paper at a time.";
  refreshRuns();
}

async function startRun(){
  const fd = new FormData(), f = $("#file").files[0], ex = $("#existing").value, op = $("#operator").value.trim();
  if(!op){ $("#newmsg").textContent = "Enter your name."; return }
  if(!f && !ex){ $("#newmsg").textContent = "Choose a paper. There is no default paper."; return }

  if(f) fd.append("pdf", f); else fd.append("existing", ex);
  fd.append("operator", op); fd.append("model", $("#model").value); fd.append("auto_continue", $("#auto").checked);
  $("#go").disabled = true; $("#newmsg").textContent = "Starting…";
  try{ const r = await api("/api/runs", {method:"POST", body:fd}); H.active_run = r.id; USER_TAB = false; TAB = "progress"; await openRun(r.id) }
  catch(e){ $("#newmsg").textContent = e.message; $("#go").disabled = false }
}

async function openRun(id){

function defaultTab(st){
  if(st.status==="gate_a" || st.status==="revising" && st.phase_a) return st.status==="gate_a" ? "gatea" : "progress";
  if(st.status==="gate_b" || st.status==="decided") return "results";
  return "progress";
}
function tabsFor(st){
  const t = [["progress","Progress"]];
  if(st.phase_a) t.push(["gatea","Gate A"+(st.status==="gate_a"?' <span class="badge">your call</span>':"")]);
  if(st.results){ t.push(["results","Results"]); t.push(["gateb","Gate B"+(st.status==="gate_b"?' <span class="badge">decide</span>':"")]) }
  t.push(["files","Files"]); t.push(["log","Technical log"]);
  if(!TAB || !t.find(x=>x[0]===TAB)) TAB = defaultTab(st);
  $("#tabs").innerHTML = t.map(([k,l]) => `<button class="tab ${k===TAB?'on':''} ${k==='log'?'tech':''}" onclick="setTab('${k}',true)">${l}</button>`).join("");
  document.querySelectorAll("#panes > div").forEach(d => d.classList.toggle("hide", d.dataset.p !== TAB));
}
function setTab(k, byUser){ TAB = k; if(byUser) USER_TAB = true; tabsFor(ST); if(k==="results") drawCharts(true) }

async function tick(){
  if(!CUR) return;
  const id = CUR;
  let st; try{ st = await api(`/api/runs/${id}`) }catch(e){ return }
  if(id !== CUR) return;
  const prev = ST?.status; ST = st;
  $("#rtitle").textContent = st.paper_title || st.slug;
  const running = RUNNING.includes(st.status);
  $("#ractions").innerHTML = `<span class="pill ${st.status}">${esc(STATUS_TEXT[st.status]||st.status)}</span>
    ${running?`<button class="danger" onclick="act('cancel')">Cancel</button>`:""}
    ${["failed","interrupted","cancelled"].includes(st.status)?`<button class="primary" onclick="act('resume')">Resume</button>`:""}`;
  let b = "";
  if(st.error && !running) b = `<div class="banner err">${esc(st.error)}</div>`;
  else if(st.status==="gate_a") b = `<div class="banner info"><b>Gate A is ready for you.</b> Read what will be tested, tick each item you agree with, then approve. Or ask for changes.</div>`;
  else if(st.status==="gate_b") b = `<div class="banner info"><b>The backtest is done.</b> Look at the results, then record your decision on the Gate B tab.</div>`;
  else if(st.status==="decided") b = `<div class="banner ok">Decision recorded: <b>${esc(st.decision.decision)}</b> by ${esc(st.decision.decided_by)} at ${esc(st.decision.at.replace("T"," "))}.</div>`;
  $("#rbanner").innerHTML = b;
  renderTrack(st);
  if(prev && prev !== st.status){ if(!USER_TAB || ["gate_a","gate_b"].includes(st.status)) TAB = defaultTab(st); USER_TAB = false; refreshRuns(); H = await api("/api/health") }
  tabsFor(st);
  renderProgress(st);
  if(st.phase_a) renderGateA(st);
  if(st.results){ renderResults(st); renderGateB(st) }
  renderFiles(st);
  await pullLog();
}

function renderTrack(st){
  const all = [...H.stages.A, ...H.stages.B];
  $("#track").innerHTML = all.map(([id,label]) => {
    const s = st.stages[id] || "pending", gate = (id==="GA"||id==="GB");
    let cls = s;
    if(id==="GA" && st.status==="gate_a") cls = "running";
    if(id==="GB" && st.status==="gate_b") cls = "running";
    if(id==="GB" && st.status==="decided") cls = "done";
    if(cls==="running" && !gate && !RUNNING.includes(st.status)) cls = "halt";
    return `<div class="st ${cls} ${gate?'gate':''}"><span class="dot"></span><span class="id">${id==="03m"?"03·map":id}</span>${esc(label)}</div>` }).join("");
}

/* ---------------- progress: ETA, what's happening, while-you-wait facts */
let FACT_I = 0, FACT_T = null, FACTS = [];
function factList(st){
  const pf = st.paper_facts, out = [];
  if(pf && Array.isArray(pf.facts)) pf.facts.forEach(f => out.push({kind:f.kind||"fact", text:f.text, src:`From the paper${pf.title?": "+pf.title:""}`}));
  TRIVIA.forEach(([k,t]) => out.push({kind:k, text:t, src:"Did you know"}));
  return out;
}
function showFact(i){
  if(!FACTS.length || !$("#facttxt")) return;
  FACT_I = (i + FACTS.length) % FACTS.length; const f = FACTS[FACT_I];
  const box = $("#facttxt"); box.style.opacity = 0;
  setTimeout(() => { $("#factkind").textContent = ({finding:"Key finding",data:"The data",method:"How it works",history:"History",term:"Jargon buster",trivia:"Trivia"})[f.kind] || f.kind;
    box.textContent = f.text; $("#factsrc").textContent = f.src; box.style.opacity = 1;
    document.querySelectorAll("#factdots span").forEach((d,k)=>d.classList.toggle("on", k===FACT_I)) }, 250);
}
function renderProgress(st){
  const e = st.eta, running = RUNNING.includes(st.status);
  const nPaper = st.paper_facts?.facts?.length || 0;
  const sig = st.status + "|" + nPaper;
  if(P_SIG !== sig){
    P_SIG = sig;
    FACTS = factList(st);
    if(nPaper && FACT_I >= nPaper) FACT_I = 0;
    let gateMsg = "";
    if(st.status==="gate_a") gateMsg = `<div class="banner info row" style="justify-content:space-between"><span><b>Gate A is waiting for you.</b> The card is ready to review.</span><button class="primary" onclick="setTab('gatea',true)">Open Gate A</button></div>`;
    if(st.status==="gate_b") gateMsg = `<div class="banner info row" style="justify-content:space-between"><span><b>Results are in.</b></span><span class="row"><button class="primary" onclick="setTab('results',true)">See results</button><button onclick="setTab('gateb',true)">Gate B</button></span></div>`;
    if(st.status==="decided") gateMsg = `<div class="banner ok row" style="justify-content:space-between"><span>This run is complete.</span><button onclick="setTab('results',true)">See results</button></div>`;
    $('[data-p="progress"]').innerHTML = `${gateMsg}
      <div class="card ${running?'':'hide'}" id="etacard">
        <div class="eta"><span class="big" id="etabig"></span><span class="muted" id="etasub"></span></div>
        <div class="bar" id="etabar"><div style="width:0%"></div></div>
        <div class="small muted" id="etanote"></div>
        <h3>What is happening now</h3>
        <div class="now"><div class="spin"></div><div><div id="nowtxt"></div><div class="small muted" id="nowago"></div></div></div>
      </div>
      <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${running?"While you wait":"About this paper"}</h2>
        <div class="row"><button onclick="showFact(FACT_I-1)">‹</button><button onclick="showFact(FACT_I+1)">›</button></div></div>
        <div class="fact"><div class="kind" id="factkind"></div><div class="txt" id="facttxt"></div><div class="src" id="factsrc"></div></div>
        <div class="dots" id="factdots">${FACTS.map((_,k)=>`<span onclick="showFact(${k})"></span>`).join("")}</div>
        ${nPaper?"":`<p class="small muted" style="margin:10px 0 0;text-align:center">Facts from your paper appear here once it has been read (usually a few minutes in).</p>`}
      </div>`;
    showFact(FACT_I);
    clearInterval(FACT_T); FACT_T = setInterval(() => showFact(FACT_I+1), 12000);
  }
  if(!running || !$("#etacard")) return;
  const cur = st.current_stage, stage = cur ? `Stage ${cur==="03m"?"03 (map)":cur} · ${stageName(cur)}` : "Starting up";
  if(e){
    const total = Math.max(e.phase_total||1, 0.1), done = Math.min(0.97, Math.max(0.02, 1 - e.minutes_left/total));
    $("#etabig").textContent = e.minutes_left < 1 ? `Almost at ${e.until}` : `About ${mins(e.minutes_left)} to ${e.until}`;
    $("#etasub").textContent = stage + (e.stage_elapsed!=null && cur ? ` · ${mins(e.stage_elapsed)} in` + (e.stage_estimate?` (usually ~${mins(e.stage_estimate)})`:"") : "");
    $("#etabar").classList.toggle("indet", st.status==="building");
    $("#etabar > div").style.width = (done*100).toFixed(1)+"%";
    $("#etanote").textContent = e.learned_from ? `Estimate based on ${e.learned_from} timed stages from earlier runs. Long backtests can run over.` : "First rough estimate; it gets better as Lightyear times more runs.";
  }
  $("#nowtxt").textContent = st.activity || "Getting started…";
  $("#nowago").textContent = st.activity_at ? "updated " + ago(st.activity_at) : "";
}

async function pullLog(){
  const r = await api(`/api/runs/${CUR}/log?after=${LOGNEXT}`);

  box.insertAdjacentHTML("beforeend", r.items.map(e => `<div class="e ${e.kind}"><span class="k">${esc(e.t.slice(11))}</span>${esc(e.kind==="tool_out"? "  ↳ "+e.msg : e.msg)}</div>`).join(""));
  if($("#follow")?.checked) box.scrollTop = box.scrollHeight;
}

/* ---------------- Gate A */
const SEV = {high:0, medium:1, low:2};
function statusTag(s){ const k = /held/.test(s)?"held":/fetch/.test(s)?"fetch":/proxy/.test(s)?"proxy":/missing/.test(s)?"missing":"proxy"; return `<span class="tag ${k}">${esc(s||"?")}</span>` }

async function drawCharts(force){
  if(!ST?.results || (CHARTED===CUR && !force)) return;

  const li = (t, src) => `<li>${esc(t)}<span class="src">${src}</span></li>`;
  $("#pos").innerHTML = ob.positives.map(t=>li(t,"measured")).join("") + (r.strengths||[]).map(t=>li(t,"from the tests")).join("") || `<li class="muted">None found.</li>`;
  $("#neg").innerHTML = ob.negatives.map(t=>li(t,"measured")).join("") + (r.weaknesses||[]).map(t=>li(t,"from the tests")).join("") || `<li class="muted">None found.</li>`;
  const m = c.metrics, K = [["CAGR","cagr",pct],["Volatility","vol",pct],["Sharpe vs 6%","sharpe",num],["Max drawdown","max_dd",pct],["Final value of 100","final",v=>num(v,1)]];
  $("#kpis").innerHTML = K.map(([l,k,f]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${f(m.strategy[k])}</div><div class="b">${esc(c.names.benchmark)}: ${f(m.benchmark[k])}</div></div>`).join("");
  if(!window.Plotly){ document.querySelectorAll(".chart").forEach(el => el.innerHTML = `<p class="muted small">Chart library did not load.</p>`); return }
  const col = {strategy:"#1f4e79", benchmark:"#d98324", sleeve:"#6a994e"};
  const main = ["strategy","benchmark"].filter(k => c.growth[k]);
  const lay = (yfmt, ytitle) => ({margin:{l:56,r:16,t:8,b:36}, font:{family:"Segoe UI, Arial", size:12}, hovermode:"x unified",
      legend:{orientation:"h", y:-0.18}, yaxis:{tickformat:yfmt, title:ytitle, gridcolor:"#eef1f4", zerolinecolor:"#c9d1da"},
      xaxis:{gridcolor:"#f3f5f7"}, paper_bgcolor:"#fff", plot_bgcolor:"#fff"});
  const cfg = {displaylogo:false, responsive:true, modeBarButtonsToRemove:["lasso2d","select2d"]};
  const line = (k, series, extra={}) => ({x:c.dates, y:series[k], name:c.names[k], type:"scatter", mode:"lines", line:{color:col[k], width:k==="strategy"?2.2:1.6}, ...extra});
  Plotly.newPlot("c_growth", main.map(k=>line(k,c.growth)), {...lay(",.0f","Value")}, cfg);
  Plotly.newPlot("c_dd", main.map(k=>line(k,c.drawdown,{fill:k==="strategy"?"tozeroy":"none", fillcolor:"rgba(31,78,121,.12)"})), {...lay(".0%","Drawdown")}, cfg);
  Plotly.newPlot("c_vol", main.map(k=>line(k,c.rolling_vol)), {...lay(".0%","Volatility")}, cfg);
  Plotly.newPlot("c_cal", main.map(k=>({x:c.calendar.years, y:c.calendar[k], name:c.names[k], type:"bar", marker:{color:col[k]},
      text:c.calendar[k].map(v=>pct(v)), textposition:"outside", cliponaxis:false, hovertemplate:"%{x}: %{y:.1%}<extra>"+c.names[k]+"</extra>"})),
      {...lay(".0%","Return"), margin:{l:56,r:16,t:26,b:40}, barmode:"group", hovermode:"closest"}, cfg);
  const z = c.monthly.z, mx = Math.max(0.01, ...z.flat().filter(v=>v!=null).map(Math.abs));
  Plotly.newPlot("c_heat", [{z, x:c.monthly.months, y:c.monthly.years, type:"heatmap", zmin:-mx, zmax:mx, colorscale:[[0,"#b3261e"],[0.5,"#ffffff"],[1,"#2e7d4f"]],
      text:z.map(r=>r.map(v=>v==null?"":(v*100).toFixed(1)+"%")), texttemplate:"%{text}", hovertemplate:"%{y} %{x}: %{z:.2%}<extra></extra>", colorbar:{tickformat:".0%"}}],
      {...lay("",""), hovermode:"closest", yaxis:{type:"category", autorange:"reversed"}}, cfg);
  if(c.growth.sleeve){ $("#sleevecard").classList.remove("hide"); $("#sleevetitle").textContent = c.names.sleeve+" (sleeve) vs NIFTY 500";
    Plotly.newPlot("c_sleeve", ["sleeve","benchmark"].map(k=>line(k,c.growth)), {...lay(",.0f","Value")}, cfg) }
}

/* ---------------- Gate B */
function renderGateB(st){
  const sig = st.status + st.id; if(GB_SIG === sig) return; GB_SIG = sig;
  const r = st.results, crit = r.gate_b.criteria || [], at = st.status==="gate_b";
  const res = c => c.passed ? "PASS" : (c.blocking===false ? "NA" : "FAIL");
  $('[data-p="gateb"]').innerHTML = `
    <div class="card"><h2>Gate B: investment decision</h2>
      <div class="facts"><div>Evidence supports</div><div><b>${esc(r.evidence_supports)}</b></div>
        <div>Decisive criterion</div><div>${esc(r.decisive_criterion||"–")}</div>
        <div>Decision</div><div><b>${st.decision?esc(st.decision.decision):"PENDING"}</b></div></div>
      <h3>Criteria (computed by gate_b())</h3>
      <table class="t"><tr><th>Criterion</th><th style="width:110px">Result</th><th>Value</th><th>Threshold</th></tr>
        ${crit.map(c=>{const x=res(c);return `<tr><td>${esc(c.name)}</td><td class="${x}">${x==="NA"?"not computed":x}</td><td>${esc(c.value)}</td><td>${esc(c.threshold)}</td></tr>`}).join("")}</table></div>
    ${at?`<div class="card"><h2>Record the decision</h2>
      <p class="small muted">This is the one stop in the chain. No model votes. The record is written to the run folder and to outputs/lightyear/decisions.jsonl.</p>
      <div class="decide">${["APPROVE","OBSERVE","FIX","REJECT"].map(d=>`<button class="d-${d} ${DEC===d?'on':''}" onclick="pickDec('${d}')">${d}</button>`).join("")}</div>
      <div class="grid2"><div><label>Decided by (named human)</label><input id="gb_by" value="${esc(LS.get('ly_operator',''))}"></div><div></div></div>
      <label>Rationale</label><textarea id="gb_why"></textarea>
      <div class="row" style="margin-top:12px"><button class="primary" onclick="decideB()">Record decision</button><span class="small muted" id="gb_msg"></span></div></div>`
    : st.decision?`<div class="card"><h2>Decision on record</h2><div class="facts"><div>Decision</div><div class="d-${esc(st.decision.decision)}"><b>${esc(st.decision.decision)}</b></div><div>By</div><div>${esc(st.decision.decided_by)}</div><div>When</div><div>${esc(st.decision.at.replace("T"," "))}</div><div>Rationale</div><div>${esc(st.decision.rationale)}</div></div></div>`:""}
    <div class="card"><h2>Gate B brief</h2><div class="md">${st.gate_b_md?md(st.gate_b_md):"(no brief file)"}</div></div>`;
}
function pickDec(d){ DEC = d; document.querySelectorAll(".decide button").forEach(b=>b.classList.toggle("on", b.textContent===d)) }
async function decideB(){
  const by = $("#gb_by").value.trim(), why = $("#gb_why").value.trim();
  if(!DEC){ $("#gb_msg").textContent="Pick a decision."; return } if(!by||!why){ $("#gb_msg").textContent="Name and rationale required."; return }
  if(!confirm(`Record ${DEC} by ${by}? This goes on the record.`)) return;
  try{ await api(`/api/runs/${CUR}/decide`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({decision:DEC, by, rationale:why})}); GB_SIG=null; tick() }
  catch(e){ $("#gb_msg").textContent = e.message }
}

/* ---------------- Files */
function renderFiles(st){
  const sig = (st.files_abs||[]).join("|"); if(F_SIG === sig) return; F_SIG = sig;
  const row = p => `<div class="path"><span title="${esc(p)}">${esc(p)}</span><button onclick="copy(this.previousElementSibling.title,this)">copy</button></div>`;
  $('[data-p="files"]').innerHTML = `<div class="card"><h2>Files</h2>
    <p class="small muted">Local paths. Copy one and open it from Explorer or VS Code.</p>
    <h3>This run's folder</h3>${row(st.run_dir_abs)}
    <h3>Readable run log (updated live)</h3>${row(st.run_log_abs)}
    <h3>Everything this run wrote or read</h3>${(st.files_abs||[]).map(row).join("")}</div>`;
}

async function act(what){
  if(what==="cancel" && !confirm("Cancel the running phase? Claude Code is stopped; files written so far stay.")) return;
  try{ await api(`/api/runs/${CUR}/${what}`, {method:"POST"}); H = await api("/api/health"); USER_TAB=false; TAB="progress"; tick(); refreshRuns() }catch(e){ alert(e.message) }
}
window.addEventListener("resize", () => { if(window.Plotly) document.querySelectorAll(".chart .js-plotly-plot").forEach(p => Plotly.Plots.resize(p)) });
boot();
</script>
