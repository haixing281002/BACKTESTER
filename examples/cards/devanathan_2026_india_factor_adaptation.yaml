card_version: "1.0"

paper:
  id: devanathan_2026_india_factor_adaptation
  title: "India adaptation: dynamic factor-sleeve allocation within NIFTY500"
  authors: [Nikhil Devanathan, Alexandros E. Tzikas, Stephen P. Boyd]
  date: "2026-09-09"
  source_file: docs/devanathan_2026_simple_dynamic_sbg.pdf
  source_sha256: "2629076cfeb93ee1"

intent:
  mode: adaptation
  parent_card: devanathan_2026_sbg_replication
  rationale: >
    The paper itself is not investable for a long-only Indian equity fund: wrong
    market, wrong asset classes, and it holds cash as a core mechanism. But the
    MECHANISM -- allocate dynamically across a small set of long-only sleeves using
    a trailing risk estimate, a hard risk cap and an l1 leash to a strategic mix --
    is asset-agnostic. Our NIFTY500 factor sleeves are exactly such a set. This card
    tests the mechanism, not the paper.
  transferred_mechanism: >
    Monthly long-only allocation across a small sleeve set, maximising an EWMA-momentum
    return forecast net of half-spread cost, subject to a hard ex-ante volatility cap
    and an l1 constraint to a strategic mix (paper eq. 3), with a volatility-control
    overlay (paper eq. 1) as the simpler comparator.
  broken_assumptions:
    - >
      DIVERSIFICATION: the paper's lift depends on SPY/AGG/GLD being weakly or
      negatively correlated. Our six sleeves are single-country equity and correlate
      0.74-0.94 pairwise. A risk-constrained optimiser over near-collinear assets has
      far less to work with; expect most of the paper's benefit NOT to transfer.
    - >
      CASH: the paper de-risks into cash, and cash is where its drawdown control comes
      from. A long-only fully-invested equity mandate cannot do this. The mandate-
      compliant variant is therefore a materially different strategy.
    - >
      RISK-FREE ASSET: no Indian cash-rate series is in the snapshot. Any cash-holding
      variant runs on a declared constant proxy and must be read under the rate sweep.
    - >
      POINT-IN-TIME: NSE factor indices are backfilled to a 2005 base with methodology
      fixed much later. The sleeve definitions were chosen knowing this history.
    - >
      RETURN BASIS: these are price-return indices. Dividends are missing from every
      series, so absolute returns understate and any cash-vs-equity comparison is
      biased against equity.
    - >
      INVESTABILITY: an index is not a portfolio. Real sleeve replication carries
      tracking error, rebalance impact and sleeve-level turnover that the index does
      not charge.

universe:
  description: >
    Five NSE single-factor sleeves drawn from the NIFTY500 universe, plus a declared
    cash proxy. NIFTY HIGH BETA 50 is excluded: its history starts 2012-11 and would
    truncate the sample by seven years.
  asset_class: equity
  geography: IN
  assets:
    - NIFTY500 MOMENTUM 50
    - NIFTY500 QUALITY 50
    - NIFTY500 VALUE 50
    - NIFTY500 LOW VOLATILITY 50
    - NIFTY ALPHA 50
  benchmark: NIFTY 500
  cash_asset: CASH_PROXY

universe_translation:
  source_universe: "US multi-asset (equity / bond / gold)"
  source_breadth: 3
  source_selection_rule: >
    None. The paper fixes three ETFs (SPY, AGG, GLD) up front and allocates
    across them; there is no cross-sectional selection step to transfer.
  target_universe: "NSE factor sleeves"
  grade: loose
  resolution: sleeve_proxy
  rationale: >
    A long-only Indian equity fund holds no bonds and no gold, so the paper's
    assets do not transfer at all. Its MECHANISM does: allocate across a small
    set of long-only return streams under a hard risk cap and an l1 leash to a
    strategic mix. The fund's five NSE factor sleeves are exactly such a set.
    We test the mechanism, never the paper's numbers.
  transfer_risks:
    - >
      The paper's lift comes from SPY/AGG/GLD being weakly or negatively
      correlated. Five single-country equity sleeves correlate 0.74-0.94
      pairwise, so a risk-constrained optimiser has far less to work with.
    - >
      The paper de-risks into cash and that is where its drawdown control comes
      from. A fully-invested mandate cannot do it, so the mandate variant is a
      materially different strategy and is run separately.
  mechanism_needs:
    needs_cross_section: false
    min_names: 3
    cap_segment: all
    sector: null
    min_history_years: 15.0
    must_be_in_mandate: true
    notes: >
      The paper allocates across three fixed assets under a risk cap; it never
      ranks securities against each other. So the universe needs a handful of
      long-only return streams, not breadth. The fund's five factor sleeves are
      such a set and are the only Indian universe testable today. must_be_in_mandate
      is true because this run is meant to govern an allocation decision, not
      merely establish that the mechanism exists.
  alternatives_considered:
    - NIFTY 500 constituents
    - NIFTY 100 constituents
  why_not_alternatives: >
    A stock-level cross-section would be a different experiment. The paper's
    mechanism operates on a small set of pre-built streams under a covariance
    estimate; running it on 500 names would test an optimiser we did not read
    about, and the 11-day covariance the paper uses is near-singular well before
    500 assets.
  required_instruments:
    - NIFTY500 MOMENTUM 50
    - NIFTY500 QUALITY 50
    - NIFTY500 VALUE 50
    - NIFTY500 LOW VOLATILITY 50
    - NIFTY ALPHA 50
  evidence_page: 3

strategy:
  signal_name: dynamic_factor_sleeve_allocation
  signal_definition: >
    At each monthly rebalance, choose weights w maximising alpha'w + rf(1 - 1'w)
    minus half-spread turnover cost, subject to: w >= 0; 1'w <= 1; the l1
    distance between w and the strategic mix scaled by 1'w is at most the l1
    budget; and ex-ante volatility sqrt(w' Sigma w) is at most the target. alpha
    is an EWMA of past daily returns (halflife 252d) scaled to a 21-day horizon;
    Sigma is an 11-day rolling covariance, annualised. Paper eq. (3).
  inputs_required:
    - daily close of each sleeve
    - a cash rate for the un-invested residual
  cross_sectional: false
  formation_rule: >
    No selection step. All five sleeves are always candidates; the optimiser sets
    every weight, and the l1 leash bounds how far the mix may stray from 20/20/20/20/20.
  weighting_rule: >
    Convex optimisation output, long-only, gross at most 1. The residual sits in
    cash in the faithful variant, and is renormalised away in the mandate variant.
  holding_period: one month
  rebalance_frequency: monthly
  is_long_short: false
  long_only_adaptation: ""
  constraints:
    - "long-only: w >= 0"
    - "unlevered: 1'w <= 1"
    - "ex-ante vol cap: sqrt(w' Sigma w) <= 18%"
    - "l1 leash to the strategic mix, budget 1.0"
  engine_template: markowitz_l1
  template_gap: ""
  confidence: high
  evidence_pages: [3, 4, 11]

signal:
  name: dynamic_factor_sleeve_allocation
  template: markowitz_l1
  lookback_days: 11
  lag_days: 1
  description: >
    Paper eq. (3) applied to factor sleeves. lag_days is 1, not 0: NSE index closes
    are published after the close, so a signal computed on date t cannot be traded at
    t's close. The paper assumes same-close execution; we do not.
  params:
    strategic_weights:
      NIFTY500 MOMENTUM 50: 0.2
      NIFTY500 QUALITY 50: 0.2
      NIFTY500 VALUE 50: 0.2
      NIFTY500 LOW VOLATILITY 50: 0.2
      NIFTY ALPHA 50: 0.2
    target_vol: 0.18
    l1_budget: 1.0
    spread_bps: 30.0
    alpha_halflife: 252
    alpha_scale: 21

portfolio:
  rebalance: monthly
  long_only: true
  max_gross: 1.0
  allow_cash: true
  mandate_allow_cash: false      # the fund is long-only and fully invested
  target_vol: 0.18
  start: "2005-04-01"
  end: "2026-05-29"

costs:
  # 30bp round trip, not the paper's 5bp. Indian sleeve rotation at mid-cap depth
  # costs far more than SPY. Assuming otherwise is the single most common way an
  # Indian equity backtest lies.
  spread_bps: 30.0
  cost_model: half_spread

data_requirements:
  - {name: "NIFTY500 MOMENTUM 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "momentum sleeve"}
  - {name: "NIFTY500 QUALITY 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "quality sleeve"}
  - {name: "NIFTY500 VALUE 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "value sleeve"}
  - {name: "NIFTY500 LOW VOLATILITY 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "low-vol sleeve"}
  - {name: "NIFTY ALPHA 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "alpha sleeve"}
  - {name: "NIFTY 500", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "fund benchmark"}
  - {name: "NIFTY500 MULTIFACTOR MQVLV 50", kind: price, frequency: daily, mandatory: true, purpose: "off-the-shelf multifactor competitor -- the real alternative to building this"}
  - {name: india_cash_rate, kind: risk_free_rate, frequency: daily, mandatory: true, purpose: "cash accrual and Sharpe numeraire"}

ambiguities:
  - field: universe.mapping
    issue: >
      Mapping SPY/AGG/GLD onto five equity factor sleeves is a judgement, not a
      translation. The source assets span asset classes; the targets do not.
    resolution: >
      Proceed as an explicit ADAPTATION, never scored against the paper's numbers.
      The empirical cost of the lost diversification is measured and reported, not
      assumed away.
    confidence: high
    material: true

  - field: portfolio.target_vol
    issue: >
      The paper's 7% target is meaningless here: the cheapest sleeve runs at 16% vol,
      so a 7% cap would force the book permanently ~60% into cash.
    resolution: >
      Set the target to 18%, just above NIFTY 500's realised 20.2%, so the cap binds
      in stress rather than continuously. Swept 12%-26% as a named sensitivity.
    confidence: medium
    material: true

  - field: costs.spread_bps
    issue: >
      The paper assumes 5bp. Rotating between Indian factor sleeves -- which are
      mid-cap heavy -- costs materially more once impact and STT are included.
    resolution: >
      Use 30bp round trip as the base case and report the breakeven cost at which
      the edge disappears. Capacity, not Sharpe, is the binding constraint here.
    confidence: medium
    material: true

  - field: universe.cash_asset
    issue: No Indian risk-free series in the snapshot.
    resolution: >
      Declared constant 6% proxy, recorded in the snapshot as a proxy, and swept
      4%-8%. Results that flip inside that band are reported as rate-dependent.
    confidence: low
    material: true

  - field: data.pit_status
    issue: >
      Backfilled index history. NSE defined these sleeves years after 2005 and the
      construction rules were chosen with knowledge of the intervening returns.
    resolution: >
      Accept for mechanism testing only. Caps the ladder at ROBUST: no live claim may
      rest on backfilled sleeve history. A live decision needs a post-launch-only run.
    confidence: high
    material: true

  - field: portfolio.allow_cash
    issue: The fund's mandate is long-only and fully invested; the mechanism uses cash.
    resolution: >
      Run BOTH: the faithful cash-holding variant (mechanism test) and a fully-invested
      variant (mandate test). The mandate variant governs the promotion decision.
    confidence: high
    material: true

replication_targets: []

benchmark_templates:
  - {name: "Equal-weight sleeves", template: fixed_weight, params: {weights: equal}, rebalance: annual}
  - {name: "Vol-target overlay",   template: vol_target,   params: {weights: equal, target_vol: 0.18}}
  - {name: "Inverse vol",          template: inverse_vol,  params: {}}
  - {name: "Equal risk contribution", template: equal_risk_contribution, params: {}}
  - {name: "Min variance",         template: min_variance, params: {}}

data_plan:
  # Designed from the paper, then compared with what the fund holds -- not the
  # other way round. The mechanism allocates across a few long-only return
  # streams under a risk cap; it never ranks securities. So the right dataset is
  # a handful of clean stream histories, NOT a stock cross-section, and adding
  # breadth would test an optimiser this paper never described.
  ideal:
    - field: "Total-return daily series for each of the five NSE factor sleeves"
      granularity: daily
      history_from: "2005-04-01"
      why: >
        The allocator needs a return stream per sleeve to estimate covariance and
        an EWMA drift. Total return, not price return, because the cash leg is
        compared against equity and a missing dividend biases that comparison in
        one direction.
      why_granularity: >
        Daily and no finer. The covariance window is 11 days, so monthly data
        cannot form the estimate at all, and the rebalance is monthly so
        intraday adds nothing but cost -- there is no execution decision inside
        the day to model.
      why_history: >
        2005-04 is the earliest date all five sleeves exist. Starting later
        truncates the 2008 drawdown, which is the only severe stress in the
        Indian sample and the regime where a hard volatility cap either earns
        its keep or does not.
      adjustments: "dividends reinvested; no survivorship question -- an index does not delist"
      minimum_viable: true
    - field: "Indian overnight or 91-day T-bill rate, daily"
      granularity: daily
      history_from: "2005-04-01"
      why: >
        Two distinct roles: the accrual on the un-invested residual, and the
        numeraire every Sharpe here is measured against. A constant serves
        neither honestly.
      why_granularity: >
        Daily, to match the accrual. Monthly would be acceptable and
        forward-filled; a constant is not, because the mechanism de-risks into
        cash and the value of doing so depends on where rates were at the time.
      why_history: "same window as the sleeves, or the Sharpe is spliced"
      adjustments: "annualised decimal; state the day-count convention"
      minimum_viable: true
    - field: "Daily traded value for each sleeve's tracking ETF, or its constituents"
      granularity: daily
      history_from: "2010-01-01"
      why: >
        The strategy's whole cost is turnover, and capacity is the binding
        constraint on this desk rather than Sharpe. Without ADV, turnover_capacity
        runs on a hand-supplied argument and the capacity conclusion is an input.
      why_granularity: "daily, because turnover is charged per rebalance"
      why_history: >
        2010 onward is enough: sleeve ETFs did not exist earlier, and a capacity
        number computed on a market that has since tripled in depth would be
        wrong in the conservative direction rather than the dangerous one.
      adjustments: "traded VALUE in INR, not share count"
      minimum_viable: false
    - field: "Each sleeve index's true launch date and methodology-change history"
      granularity: monthly
      history_from: "2005-04-01"
      why: >
        The held history is backfilled to a 2005 base with rules fixed years
        later. Knowing the real launch date is what allows a post-launch-only
        re-run, which is the only version of this that could support a live claim.
      why_granularity: "a handful of dates, not a series"
      why_history: "the full window, so the backfilled portion is identifiable"
      adjustments: "one row per index: name, launch_date, any methodology revision"
      minimum_viable: false
  rejected_alternatives:
    - option: "NIFTY 500 constituent-level prices and a 500-asset optimiser"
      why_not: >
        Tests a different paper. The 11-day covariance this mechanism uses is
        near-singular well before 500 assets, so the optimiser would be doing
        error maximisation rather than the paper's constrained allocation. If we
        want a stock-level test, that is its own card.
    - option: "Monthly sleeve closes"
      why_not: >
        The covariance window is 11 days and the EWMA has a 252-day halflife.
        Monthly data cannot form either. Cheaper and useless.
    - option: "Minute or tick data on the sleeve ETFs"
      why_not: >
        There is no intraday decision in this strategy: it sets weights once a
        month on a close. Intraday would inform EXECUTION, which is a different
        question from whether the signal exists, and would cost orders of
        magnitude more for it.
    - option: "The price-return sleeve series we already hold, unchanged"
      why_not: >
        It is what we will actually run on, and it is not the right dataset.
        Dividends are missing from every series, so absolute returns understate
        and the cash-versus-equity comparison that this mechanism turns on is
        biased against equity throughout. Listed here so the gap is recorded
        rather than forgotten.
  granularity_verdict: >
    DAILY, and nothing finer. The signal is formed on daily closes over an 11-day
    window and traded monthly. Weekly loses the covariance estimate; intraday
    answers an execution question this card does not ask.
  optimality_argument: >
    Five clean total-return streams plus a real short rate is the smallest
    dataset that can answer this paper's actual question -- does a hard ex-ante
    risk cap plus an l1 leash beat a static mix of the same streams, after
    Indian costs. It is optimal rather than merely sufficient because every
    addition we considered either tests a different mechanism (stock-level
    breadth), cannot form the estimator (monthly), or prices an execution
    decision this strategy does not make (intraday). The two fields marked
    minimum_viable are the ones without which the answer is not interpretable;
    ADV and launch dates change what we may CLAIM from the answer, not what the
    answer is.
  what_would_change_the_answer: >
    Total-return series would raise every absolute return and narrow the gap
    between the cash-holding and fully-invested variants, which is the comparison
    the promotion decision turns on. A real rate series would let the cash leg
    de-risk into an actual rate-cut cycle instead of a straight line, which is
    where the paper claims its drawdown control comes from. Either could move
    the verdict; ADV and launch dates cannot.

selection:
  rule: >
    No selection step. All five sleeves are candidates at every rebalance and the
    optimiser sets every weight, with the l1 leash bounding how far the mix may
    stray from 20/20/20/20/20. NIFTY HIGH BETA 50 is excluded by construction:
    its history starts 2012-11 and including it would truncate the sample by
    seven years.
  explicit_securities:
    - NIFTY500 MOMENTUM 50
    - NIFTY500 QUALITY 50
    - NIFTY500 VALUE 50
    - NIFTY500 LOW VOLATILITY 50
    - NIFTY ALPHA 50
  verified_against: firm_registry
  as_of: "2026-05-29"
  why_these: >
    They are the five NSE single-factor indices drawn from NIFTY500 for which the
    fund holds a full common history. Naming them is safe here because they are
    indices the registry confirms, not stocks recalled from memory -- the list is
    checkable against ros/data/firm_registry.py rather than asserted.

backtest_plan:
  sample_start: "2005-04-01"
  sample_end: "2026-05-29"
  why_this_window: >
    Starts at the earliest date all five sleeves exist, so no sleeve is spliced
    in mid-sample. Ends at NIFTY 500's last close, nine trading days before the
    sleeves, because the benchmark comparison must be on a common window and
    truncating the benchmark instead would flatter the strategy on those days.
    The window includes 2008, which is the only severe stress in the Indian
    sample and the regime a hard volatility cap exists for.
  warmup_days: 16
  why_warmup: >
    lookback (11) + 5. The covariance and the EWMA cannot be formed before the
    window fills, and trading on a partial estimate silently makes burn-in part
    of the track record. Every benchmark uses the same warmup so no run gets a
    head start -- an earlier version did not, and aligning the start dates
    reversed the ranking.
  rebalance_rule: >
    Last TRADING day of each calendar month present in the data, never a calendar
    date that may not trade. Signals are shifted by 1 + lag_days before use.
  weights_rule: >
    Convex optimiser output: maximise EWMA drift net of half-spread turnover
    cost, subject to long-only, gross <= 1, an l1 leash of 1.0 to the strategic
    mix, and ex-ante vol <= 18%. The residual holds cash in the faithful variant
    and is renormalised away in the mandate variant.
  explicit_weights:
    NIFTY500 MOMENTUM 50: 0.2
    NIFTY500 QUALITY 50: 0.2
    NIFTY500 VALUE 50: 0.2
    NIFTY500 LOW VOLATILITY 50: 0.2
    NIFTY ALPHA 50: 0.2
  benchmarks:
    - name: "NIFTY 500"
      why_this: >
        The fund's mandate benchmark and the do-nothing alternative. Beating it
        is necessary and nowhere near sufficient: any long-only equity basket
        with a factor tilt has beaten it over this window.
    - name: "NIFTY500 MULTIFACTOR MQVLV 50"
      why_this: >
        The real alternative to building this. An off-the-shelf multifactor index
        with ZERO turnover and no optimiser to maintain. If the strategy does not
        beat it after 30bp, the honest recommendation is to buy the index.
    - name: "Equal-weight sleeves, annually rebalanced"
      why_this: >
        Isolates what the machinery buys. Same five streams, no covariance
        estimate, no optimiser, almost no turnover. The difference between this
        and the strategy IS the mechanism's contribution.
    - name: "Vol-target overlay on the equal-weight mix"
      why_this: >
        Separates the two halves of the paper: the risk cap (eq. 1) from the
        optimised allocation (eq. 3). If the overlay captures most of the
        benefit, the optimiser is not earning its complexity.
  must_beat:
    - "NIFTY 500, on the paired bootstrap, at 5%"
    - "NIFTY500 MULTIFACTOR MQVLV 50, after 30bp round-trip costs"
    - "Equal-weight sleeves, or the optimiser buys nothing"
  success_looks_like: >
    Beats equal-weight AND MQVLV on geometric Sharpe with a paired stationary
    bootstrap p <= 0.05 against both; deflated Sharpe P(skill) >= 0.95 at the
    honest trial count; alpha survives the five-sleeve factor regression with
    |HAC t| >= 2; incremental IR against the existing book positive at a
    realistic sleeve size; turnover within tolerance; and the ranking stable
    across the 12-26% target-vol and 4-8% cash-rate sweeps.
  failure_looks_like: >
    Any of: statistically tied with equal-weight, so the machinery buys nothing;
    loses to MQVLV, so the answer is to buy the index; alpha vanishes against the
    sleeves it is built from, so the excess return is unaccounted factor beta;
    Sharpe that does not decay monotonically with implementation lag, which means
    the signal carries no timing information; or a verdict that flips inside
    either sweep, which makes the result an artefact of an unvalidated knob.
  known_failure_modes:
    - >
      Near-collinear sleeves: 0.74-0.94 pairwise correlation leaves a
      risk-constrained optimiser very little to do, and what it does do is
      dominated by covariance estimation error on an 11-day window.
    - >
      The cap never binding, or binding always. At 26% target vol the strategy
      collapses to the strategic mix; at 12% it sits permanently in cash. Either
      makes the mechanism irrelevant and the sweep is what detects it.
    - >
      Turnover eating the edge. The optimiser will happily churn for a few basis
      points of forecast drift, which is free in the paper's 5bp world and is not
      here.
    - >
      A cash-holding variant flattered by price-return indices: the equity leg
      is understated by the missing dividend while the cash leg is not.

data_requests:
  - item: "An Indian overnight or T-bill rate series, daily, 2005 onward"
    why: >
      The cash leg is the paper's drawdown-control mechanism, and every Sharpe
      here is measured against a numeraire. Right now that numeraire is a flat
      6% constant.
    unlocks: >
      A defensible Sharpe, and a cash-holding variant whose de-risking is timed
      by the actual rate cycle rather than by a straight line.
    without_it: >
      Declared constant 6% proxy, swept 4-8%. Wrong in level and wrong in SHAPE
      -- a constant cannot de-risk you into a rate-cut cycle -- so every
      cash-holding result is reported as rate-dependent and the ladder stays
      capped.
    priority: high
    format_hint: "two columns: date, annualised_rate (decimal, e.g. 0.0655)"
  - item: "Total-return versions of the five factor sleeves"
    why: >
      The held series are price-return, so dividends are missing from every one.
    unlocks: >
      An honest absolute return, and a cash-vs-equity comparison that is not
      structurally biased against equity by roughly the dividend yield a year.
    without_it: >
      Absolute returns understate throughout, and the faithful cash-holding
      variant is flattered relative to the fully-invested one. Reported, not
      corrected.
    priority: high
    format_hint: "same shape as the existing workbook, TRI instead of PRI"
  - item: "Post-launch-only sleeve history, with each index's real launch date"
    why: >
      NSE backfilled these to a 2005 base with methodology fixed years later,
      so the sleeve rules were chosen knowing the returns they now report.
    unlocks: >
      Lifting the ladder above ROBUST. No live claim may rest on backfilled
      history, so without this the ceiling is structural rather than empirical.
    without_it: >
      Mechanism testing only, ladder capped at ROBUST, and the card says so.
    priority: nice_to_have
    format_hint: "one row per index: name, launch_date"
  - item: "Daily traded value for the sleeve constituents, or for a tracking ETF"
    why: >
      Sleeve rotation is only free on paper. An index is not a portfolio.
    unlocks: >
      A capacity number instead of an assumption, and a defensible AUM ceiling.
    without_it: >
      turnover_capacity runs on hand-supplied ADV and AUM arguments, so the
      capacity conclusion is an input, not a finding.
    priority: high
    format_hint: "date, index_or_etf, traded_value_inr_cr"

open_questions:
  - question: >
      Is 18% the right ex-ante volatility cap for this book, or should it be set
      from the fund's own risk budget rather than from NIFTY 500's realised vol?
    why_it_matters: >
      The cap is what the mechanism DOES. At 12% it binds continuously and the
      book sits in cash; at 26% it never binds and the strategy collapses to the
      strategic mix. Sharpe moved 0.45 to 0.37 across that range in the sweep,
      so a chunk of any edge rides on this number.
    what_i_assumed: >
      18%, just above NIFTY 500's realised 20.2%, so the cap binds in stress
      rather than continuously. Swept 12-26% and reported.
    ask_of: pm
    blocks_run: false
  - question: >
      Which variant governs the promotion decision -- the faithful cash-holding
      run, or the fully-invested mandate run?
    why_it_matters: >
      They are different strategies, not two views of one. The cash variant is
      where the paper's drawdown control lives and the fund cannot run it.
      Scoring the wrong one promotes something unimplementable.
    what_i_assumed: >
      The mandate variant governs; the faithful variant is reported alongside as
      the mechanism test.
    ask_of: pm
    blocks_run: false
  - question: >
      Is n_configs_tried = 1 honest here, given the paper's own appendix sweeps
      and the target-vol range we explored?
    why_it_matters: >
      The deflated Sharpe rests entirely on this number and nothing in the
      pipeline verifies it. Understating it is the easiest way to manufacture a
      P(skill) that does not exist.
    what_i_assumed: >
      1, counting only this card's own configuration. That is almost certainly
      too low once the paper's sweeps are folded in -- an earlier critique put
      it nearer 48.
    ask_of: researcher
    blocks_run: false

n_configs_tried: 1

notes: >
  The promotion question is NOT "is the Sharpe good". It is whether this beats, after
  30bp costs, the two things the fund can already do for free: hold NIFTY 500, or buy
  the NIFTY500 MULTIFACTOR MQVLV 50 index. Both are run as benchmarks.

# The question the fund is actually paying to have answered. Everything above
# says what the paper is and how it would be tested; this says whether any of it
# could become something we could hold. It is an opinion, it decides nothing,
# and a human at Gate A can overturn it in one line.
convertibility:
  verdict: convertible
  confidence: medium
  what_must_be_true:
    - >
      The five sleeves must be diverse enough for a risk-constrained optimiser to
      have anything to do. The paper's lift comes from allocating across weakly
      correlated assets; our sleeves correlate 0.74-0.94 pairwise, all
      single-country equity. If the correlation structure leaves no room, the
      optimiser returns the strategic mix and the machinery buys nothing.
    - >
      The EWMA return forecast must carry information AT THE SLEEVE LEVEL. The
      paper forecasts asset classes whose return drivers differ in kind; five
      factor tilts on one equity market may share a single driver, in which case
      the forecast ranks noise.
    - >
      The edge must survive 30bp round trip on monthly rotation. The l1 leash
      bounds turnover by construction, so this is the link most likely to hold --
      but it has never been charged at Indian sleeve-replication cost.
    - >
      It must beat the two things the fund can already do for nothing: hold
      NIFTY 500, or buy NIFTY500 MULTIFACTOR MQVLV 50. Beating cash is not the
      bar and never was.
    - >
      Sleeve exposure must be obtainable at fund size. An index is not a
      portfolio: real replication carries tracking error and rebalance impact
      that the index series does not charge.
  weakest_link: >
    The first one, and it is not close. The paper's entire result rests on
    allocating across assets that diversify each other, and we are proposing to
    run it across five correlated slices of one equity market. This is the link
    that would make a null result unsurprising rather than informative, and it
    is knowable BEFORE the run: compute the sleeve correlation matrix and the
    optimiser's feasible dispersion under the l1 leash.
  decisive_evidence: >
    Three things, in descending order of what they would settle. (1) The
    realised sleeve correlation matrix over the sample, which decides whether
    link one is alive at all -- we hold the data and it costs nothing. (2) An
    Indian overnight or T-bill series: the paper's drawdown control lives in its
    cash leg, and without a real rate we cannot tell a genuine de-risking
    benefit from an artefact of a flat 6% proxy. (3) Sleeve-level traded value,
    which turns the capacity conclusion from an input into a finding.
  if_it_fails: >
    A null here is worth more than the run costs. It would establish that
    dynamic allocation machinery buys nothing over a fixed equal-weight mix
    within a correlated single-country sleeve set -- which retires a whole
    family of "dynamic factor rotation" proposals, not just this paper. That is
    a reusable answer, and the library keeps it.
  capacity_note: >
    Unknown, and currently an assumption rather than a finding. The mechanism is
    low-turnover by construction, which is favourable, but every number here is
    computed on index series that charge no impact. Until sleeve ADV arrives,
    any AUM ceiling quoted from this run is an argument, not a measurement.
