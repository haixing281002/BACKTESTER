# of February 2016, so its first month of returns is March 2015. Months after the last phase are shown as
# "Unclassified" until the operator names the phase. The first phase is clipped to a run's own start.
# Used by ros/metrics/qi.py (the Market phases table and chart). Never by a backtest or by Gate B.
