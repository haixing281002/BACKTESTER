# Data supplied at Gate A.
#
# THE THREE SOURCES ARE NOT DECLARED HERE. They are code: ros/data/sources.py names the Ace Equity price file,
# the NIFTY 500 holdings workbook and the NSE index workbook, and ros/data/firm_registry.py registers what they
# hold. Nothing else is read by a run, and nothing is ever downloaded. See docs/DATA_SOURCES.md.
#
# This file is for the rare extra series a paper needs that the three files do not carry (a macro series, a
# risk-free rate, a factor return). Drop the file in data/raw/, declare it below, re-run; Step 03 then resolves
# against the enlarged registry.
#
# WHY THE AWKWARD FIELDS ARE MANDATORY
#
# A file's existence tells you nothing about whether its history was knowable as-was on past dates. So
# `pit_status`, `licence` and `caveats` are required, and they travel with every result computed from the series.
# `pit_status: point_in_time` is the field that decides whether a live claim may rest on this work. Typing it
# without checking is the single easiest way to mislead everyone downstream, including yourself.
#
# Get the stanza for a series you are missing:
#     python -c "from ros.data.intake import manifest_stanza; print(manifest_stanza('<name>'))"
#
# A supplied series may not share a name with one the fund already holds -- that is an error, not an override.

series: []
