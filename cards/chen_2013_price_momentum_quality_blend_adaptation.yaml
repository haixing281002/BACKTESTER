n_configs_tried: 1

notes: >
  The promotion question is NOT "is the Sharpe good". It is whether blending
  two already-held factor sleeves beats, after 30bp costs, the three things
  the fund can already do for free: hold NIFTY 500, buy the NIFTY500
  MULTIFACTOR MQVLV 50 index, or hold either sleeve alone. All are run as
  benchmarks. Given the 0.88 measured sleeve correlation, a result showing
  blending adds little would say more about the LIMITED independence between
  two broad NSE factor indices than about whether Chen et al.'s dominance
  claim is wrong.

convertibility:
  verdict: convertible_with_data
  confidence: medium
  headline: "Runs today on held sleeves, but 0.88 correlation is far below the paper's own 0.15-0.32"
  what_must_be_true:
    - >
      NIFTY500 MOMENTUM 50 and NIFTY500 QUALITY 50 must carry enough
      INDEPENDENT information for blending to matter. Measured directly:
      0.88 pairwise correlation, versus the paper's own stock-level 0.15-0.32
      among SURGE, SUE and prior returns. If there is little room here,
      blending will do little regardless of whether the paper's underlying
      claim is true.
    - >
      A quality (level) sleeve must carry some of the same information a
      surprise (drift) measure would, for a positive blending result to say
      anything about the paper's underreaction-to-surprise mechanism at all.
    - >
      The blend must survive 30bp round-trip costs on monthly rebalancing
      between two already-liquid, already-diversified sleeves -- the
      cheapest possible version of this test to implement.
    - >
      It must beat the three things the fund can already do for nothing:
      hold NIFTY 500, buy NIFTY500 MULTIFACTOR MQVLV 50, or hold either
      sleeve alone.
  weakest_link: >
    The first one. The paper's whole dominance result rests on three
    signals that barely correlate with each other; two NSE factor sleeves
    correlating at 0.88 may simply not have enough independent variation
    for blending to demonstrate anything, which would make a null result
    about the PROXY's power rather than about the paper's claim.
  decisive_evidence: >
    In order of what they would settle: (1) NIFTY 500 constituent-level PIT
    prices, to move from a 2-sleeve blend to an actual stock-level sort. (2)
    Firm-level Indian fundamentals with announcement dates, to build a true
    SURGE/SUE-style surprise measure instead of a level-based quality proxy.
    (3) An Indian short-rate series, which sharpens the Sharpe numeraire but
    is unlikely to flip this card's verdict on its own since the book is
    fully invested throughout.
  if_it_fails: >
    A null here is still informative: it would show that this fund's TWO
    most independent-seeming held factor sleeves are, in fact, too correlated
    (0.88) to demonstrate a real diversification-of-information benefit --
    a reusable finding for any future "combine our factor sleeves" proposal,
    not just this paper.
  capacity_note: >
    Favourable by construction: both legs are already-liquid, broad NSE
    factor indices with low incremental turnover from a 50/50 rebalance, but
    every number here is computed on index series that charge no market
    impact, so an AUM ceiling from this run is an argument, not a measurement.

india_notes:
  - category: validity
    item: >
      NIFTY500 QUALITY 50's scoring methodology (profitability, leverage and
      earnings-variability weights) has been revised since the sleeve's
      backfilled base date, and reconstitution is semi-annual rather than
      event-driven.
    why: >
      A methodology splice inside the backfilled history can look like a
      genuine change in the sleeve's behaviour when it is a rule change, and
      the semi-annual reconstitution means the sleeve reacts to fundamentals
      far more slowly than the paper's own monthly-refreshed SUE/SURGE would.
    triggered_by: >
      QUALITY 50 stands in for the paper's earnings/revenue-surprise legs,
      which are refreshed at every formation month in the source paper
    addresses: ["Daily closing levels for a price-momentum sleeve and a fundamentals/quality sleeve, common history"]
  - category: execution
    item: >
      The tradable wrapper for this blend is two ETFs/index funds (or a
      swap), not the indices themselves; factor-sleeve ETF liquidity and
      tracking error in India vary sleeve to sleeve.
    why: >
      The backtest trades index LEVELS; a real book trades INSTRUMENTS with
      tracking error and rebalance impact the index series does not charge.
    triggered_by: "the strategy holds two distinct sleeves, each with its own tracking vehicle"
    addresses: ["Daily closing levels for a price-momentum sleeve and a fundamentals/quality sleeve, common history"]
  - category: data
    item: >
      No Indian earnings-announcement-date database of the kind Compustat
      provides (exact public disclosure timestamp, not just fiscal period
      end) is broadly available off-the-shelf the way it is in the US.
    why: >
      Even with revenue/EPS data in hand, the paper's construction depends
      specifically on restricting SURGE/SUE to information known "within
      three months before formation" (p.8) -- without a reliable
      announcement-date field, any Indian SURGE/SUE built later would risk
      look-ahead bias baked in from the start.
    triggered_by: >
      the paper's signal construction is date-sensitive by design (eq. 1,
      eq. 2, and the 3-month announcement window)
    addresses: ["Firm-level quarterly revenue and EPS with earnings-announcement dates, for NIFTY 500 constituents"]
