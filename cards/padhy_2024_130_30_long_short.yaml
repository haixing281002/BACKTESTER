india_notes:
  - category: execution
    item: >
      A six-month single-stock short in India is not a simple cash-market short.
      Cash-market shorts must be covered the same day unless borrowed through
      SLB, so the 30% leg needs SLB borrow or rolled single-stock futures. Many
      NIFTY500 Momentum 50 names are mid or small caps outside the F&O list, so
      futures do not exist for them and SLB is the only route, often thin.
    why: "The operator's universe moves the short leg out of the mega-caps where borrow is easiest."
    triggered_by: "30% short positions held for six months (pages 4-6), on a momentum universe"
    addresses: ["daily close for each stock, corporate-action neutralised (bhavcopy ingest)"]
    evidence_page: 4
  - category: data
    item: >
      NSE publishes the NIFTY500 Momentum 50's level but the fund holds no
      constituent history. The index was launched years after its 2005 base
      date, so its pre-launch level is backfilled. Its launch date is not in the
      permitted sources, so part of this 2022-2026 window may also be backfilled.
      The rebuilt list remains an approximation of the real one either way.
    why: "A result is only 'on the index's companies' if the rebuilt list tracks the index."
    triggered_by: "operator's choice of the NIFTY500 Momentum 50 universe at Gate A"
    addresses: ["point-in-time NIFTY500 Momentum 50 lookalike at each formation date: top 500 by free-float market cap (bhavcopy price x Screener shares x free float), then NSE's risk-adjusted 6m/12m momentum score, top 50"]
    evidence_page: 7
  - category: validity
    item: >
      The paper's Sharpe screen (six-month excess return over volatility) is
      close to the momentum index's own selection score. On this universe the
      screens may mostly re-rank names by the score that put them there, so a
      result may be leveraged momentum rather than the paper's signal.
    why: "Without the top-30 sensitivity, a momentum result would be read as the paper's result."
    triggered_by: "Sharpe and Treynor ratios as selection screens (page 3)"
    addresses: ["NIFTY500 Momentum 50 index daily close (scoring benchmark for tracking error, IR and beta, and the do-nothing comparator)"]
    evidence_page: 3
  - category: validity
    item: >
      The paper's Appendix 1 list is a single snapshot of the Sensex applied to
      2019-2024. It is missing names that left in that window (for example HDFC
      Ltd, merged into HDFC Bank in 2023). That is look-ahead in the universe,
      and it can flatter a strategy that buys recent winners.
    why: "A fixed list built from later membership excludes the names that fell out, and the strategy's shorts are drawn from exactly those laggards."
    triggered_by: "the fixed list of 30 companies (Appendix 1, pages 7-8)"
    addresses: ["NIFTY 50 daily close (scoring benchmark for the mega-cap sensitivity only)"]
    evidence_page: 7
  - category: data
    item: >
      Screener's free float is derived from promoter holding, so companies with
      no promoter group (HDFC Bank, ICICI Bank, ITC, L&T, HDFC Ltd) have no value.
      These are counted as fully free float, not dropped.
    why: "A free-float rule that treats a blank as missing removes the largest widely held stocks from the NIFTY 500 approximation."
    triggered_by: "free-float market cap ranking for the parent NIFTY 500 (Appendix 1, pages 7-8)"
    addresses: ["point-in-time NIFTY500 Momentum 50 lookalike at each formation date: top 500 by free-float market cap (bhavcopy price x Screener shares x free float), then NSE's risk-adjusted 6m/12m momentum score, top 50"]
    evidence_page: 7
  - category: data
    item: >
      The risk-free rate is a flat 6% a year. The paper uses a government bond
      series. Since the rate is the same for every stock, it changes Sharpe and
      Treynor ranks only for stocks whose six-month return sits near 3%.
    why: "The screens rank excess returns, so a constant rate barely moves ranks, but it is still not the paper's input."
    triggered_by: "Sharpe and Treynor ratios against government bond returns (page 3)"
    addresses: ["risk-free rate: flat 6% a year, operator-declared"]
    evidence_page: 3
  - category: cost
    item: >
      The paper's 1.1% cost is charged on net gain or loss, so a flat half-year
      is free. Here the momentum list turns over heavily and gross is 160%, so a
      full turnover at a rebalance is up to 1.6 times capital round trip, about
      48bp at 30bp, twice a year, plus borrow all year on the 30% short. Mid
      and small momentum names trade wider than the 30bp floor.
    why: "Leverage and a high-turnover universe make costs bite harder than on the paper's mega-caps."
    triggered_by: "26bp transaction plus 84bp short-selling cost on net gain (page 4)"
    addresses: ["NIFTY 500 daily close (fund benchmark)"]
    evidence_page: 4
