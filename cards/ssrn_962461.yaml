notes: >
  Quick-test card (CLAUDE.md default 2026-10-06): data_plan and convertibility are
  deliberately not written. The question is whether the 10-month moving-average
  switch reduces drawdowns without giving up much return on five Indian equity
  sleeves, after 30bp costs, over October 2021 to October 2026. Step 05 is blocked
  on a per-sleeve switch allocator (strategy.template_gap). Data: NSE bhavcopy,
  Screener.in and the NIFTY 500 workbook only, per the operator.

india_notes:
  - category: data
    item: >
      The NIFTY 500 workbook and bhavcopy are price-return series. The paper insists
      on total return and warns that mismatched data will not reproduce it (page 58).
    why: >
      Dividends are missing from every sleeve while cash earns 6%, which tilts the
      comparison toward the timing book; the bank and commodity-producer sleeves are
      the highest-yielding, so they are understated most.
    triggered_by: "'All data series are total return series including dividends' (page 22)"
    addresses: ["month-end NIFTY 500 close (index workbook)", "daily corporate-action-neutralised close and traded value per stock (bhavcopy master)"]
    evidence_page: 22
  - category: validity
    item: >
      Screener's industry labels and share counts are current snapshots, not point
      in time, and only companies that exist today have a page.
    why: >
      Sleeve membership and cap weights use today's classification and shares; a
      company that changed business or delisted inside the window is mis-assigned or
      missing from its basket.
    triggered_by: "industry baskets standing in for the paper's asset classes (page 15)"
    addresses: ["today's shares outstanding per stock from Screener (market cap over price), for cap weights inside a basket", "an industry label per stock, to assign it to a sleeve (Screener industry)"]
    evidence_page: 15
  - category: data
    item: >
      There is no Indian T-bill series in the permitted sources; cash is a declared
      constant 6% swept 4-8%.
    why: >
      Indian short rates rose sharply inside this window (the 2022-23 RBI hiking
      cycle, repo 4.0% to 6.5% by the drafter's recollection, unsourced), so a
      constant overstates cash early in the window.
    triggered_by: "cash returns estimated with 90-day Treasury bills (page 22)"
    addresses: ["a flat 6% annual cash rate (declared constant)"]
    evidence_page: 22
  - category: execution
    item: >
      An off-to-on switch moves 20% of the book into a basket in one day; for the
      real-estate and commodity baskets this lands in mid-cap names.
    why: >
      The paper assumed ETFs or mutual funds with no slippage (page 35). Here the
      basket is bought stock by stock, so 30bp is a floor and should be swept.
    triggered_by: "'slippage should be nearly negligible' (page 35)"
    addresses: []
    evidence_page: 35
