card_version: "1.0"

paper:
  id: maguire_2018_combining_smart_beta_adaptation
  title: "India adaptation (partial/scoped): low-beta-screened minimum-variance allocation across NIFTY500 factor sleeves"
  authors: [Phil Maguire, Karl Moffett, Rebecca Maguire]
  date: "2018-08-09"
  source_file: docs/maguire_2018_combining_smart_beta__transcript.txt
  url: "https://arxiv.org/abs/1808.02505"

intent:
  mode: adaptation
  parent_card: null
  rationale: >
    The paper combines two long/short US single-stock strategies: (1) an AdaBoost
    classifier ranking ~500 stocks by momentum/liquidity indicators, long the top
    quintile and short the bottom; (2) a minimum-variance portfolio over the 25
    lowest-beta stocks, with unconstrained long/short weights. Neither transfers
    whole. (1) requires individual-constituent NIFTY500 data we do not hold and a
    cross-sectional stock-ranking allocator shape none of our eight registered
    templates provide -- see broken_assumptions; it is NOT attempted in this card
    and is instead written up as a missing-capability item for a human to scope.
    (2) partially transfers: our engine's min_variance template is long-only
    variance minimization over a small named asset set, which is structurally
    what the paper's MVP does once you drop its short positions -- except our
    "assets" are five factor SLEEVES, not 500 individual stocks, so the screen
    can only operate at sleeve granularity. This card tests THAT narrow piece
    only: pre-screen the sleeves by estimated beta to NIFTY 500, then minimize
    variance long-only across the lower-beta subset. It is a much smaller test
    than the paper's own claims and should be read as such.
  transferred_mechanism: >
    Long-only minimum-variance allocation (min_variance template) restricted to
    the subset of NIFTY500 factor sleeves assumed lower-beta to NIFTY 500 (paper
    p.11: pre-select low-beta assets, then minimize variance among them via
    V^-1 R + V^-1 I with the sign/short freedom removed for the long-only
    mandate). Applied at factor-sleeve granularity, not individual-stock
    granularity, because that is the finest granularity our data supports.
  broken_assumptions:
    - >
      MISSING CAPABILITY (stock ranking): the paper's AdaBoost/momentum-oscillator
      component operates on ~500 individual stocks; our engine's eight registered
      templates all size positions across a small, pre-named set of sleeves handed
      to them via AllocatorContext, and our data registry holds no
      individual-constituent price/volume series. This is not a "broken
      assumption" in the usual sense -- it is a capability gap. It is not
      attempted anywhere in this card.
    - >
      GRANULARITY: the paper selects the 25 LOWEST-BETA stocks out of 500 (a
      top-5% screen with real cross-sectional dispersion) before minimizing
      variance among them. We only have five factor sleeves to screen; picking
      "the lower-beta half" of five candidates is a categorically coarser
      exercise, and the idiosyncratic-diversification argument for a 25-stock
      min-variance book does not obviously carry over to a 2-3 sleeve one.
    - >
      SHORT LEG / LEVERAGE: both the beta-neutral quintile spread (short leg,
      entirely dropped) and the unconstrained long/short signs in the paper's own
      MVP formula (also dropped) are removed for the long-only mandate; so is all
      leverage (2:1, 2.5:1 in the paper). What remains tests a small slice of the
      paper's own design space.
    - >
      NO STATED COST ASSUMPTION: the paper never states a trading-cost figure to
      override -- it only says Quantopian's backtester "accurately accounts for"
      costs, with no number given. 30bp round trip is applied as pure fund
      policy, not a deviation from a stated paper baseline.
    - >
      NO STATED IMPLEMENTATION LAG: the paper does not discuss signal-to-trade
      timing at all. lag_days=1 is fund policy, not a deviation from the paper.
    - >
      BETA-SCREEN SELECTION IS PROVISIONAL: which sleeves count as "low beta" is
      asserted here from well-known factor characteristics (Low Volatility 50,
      Quality 50, Value 50 assumed lower-beta than Momentum 50 and Alpha 50), not
      computed from actual trailing beta. This must be verified before, or
      immediately after, the first run -- see ambiguities.
    - >
      ABSTRACT VS TABLE CONFLATION: the paper's own abstract quotes its two
      components' Sharpe ratios (0.61, 0.90) as if describing their own
      unlevered performance, when Table 1 shows those are actually the 2:1-LEVERED
      figures (unlevered: 0.58, 0.89). Not directly relevant to what we adapt
      here (we apply no leverage), but reason enough to distrust any single
      headline number from this paper without checking its accounting basis.
    - >
      POINT-IN-TIME / RETURN BASIS / INVESTABILITY: the same NSE-backfill,
      price-return, and index-is-not-a-portfolio caveats apply here as to every
      other NIFTY factor-sleeve card in this fund.

universe:
  description: >
    Provisional low-beta subset of NIFTY500 factor sleeves (NIFTY500 LOW
    VOLATILITY 50, NIFTY500 QUALITY 50, NIFTY500 VALUE 50), standing in for the
    paper's 25-lowest-beta-stocks-out-of-500 screen at the only granularity our
    data supports. NIFTY500 MOMENTUM 50 and NIFTY ALPHA 50 are excluded from this
    universe on the (unverified) assumption that they run higher beta; NIFTY HIGH
    BETA 50 is excluded on both beta grounds and its short (2012-) history.
  asset_class: equity
  geography: IN
  assets:
    - NIFTY500 LOW VOLATILITY 50
    - NIFTY500 QUALITY 50
    - NIFTY500 VALUE 50
  benchmark: NIFTY 500
  cash_asset: null

signal:
  name: low_beta_sleeve_min_variance
  template: min_variance
  lookback_days: 63
  lag_days: 1
  description: >
    Paper p.11's MVP logic (minimize variance via the trailing covariance matrix
    of a pre-screened low-beta asset set) with signs constrained long-only and no
    target_vol (the paper's MVP has no explicit volatility target -- it just
    minimizes variance, full stop). lookback_days=63 mirrors the paper's stated
    "previous quarter" covariance window. Because min_variance never diverts to
    cash unless a target_vol is set, this book is always fully invested;
    portfolio.allow_cash is carried for schema consistency but is structurally
    inert here.
  params: {}

portfolio:
  rebalance: monthly
  long_only: true
  max_gross: 1.0
  allow_cash: true
  mandate_allow_cash: false      # inert here: min_variance with no target_vol never holds cash
  target_vol: null
  start: "2005-04-01"
  end: "2026-05-29"

costs:
  # 30bp round trip is fund policy; the paper states no cost figure to override.
  spread_bps: 30.0
  cost_model: half_spread
  impact_bps_per_pct_adv: 10.0

data_requirements:
  - {name: "NIFTY500 LOW VOLATILITY 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "assumed-lowest-beta sleeve in the screened set"}
  - {name: "NIFTY500 QUALITY 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "assumed-lower-beta sleeve in the screened set"}
  - {name: "NIFTY500 VALUE 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "assumed-lower-beta sleeve in the screened set"}
  - {name: "NIFTY 500", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "fund benchmark and beta-screen numeraire"}
  - {name: "NIFTY500 MULTIFACTOR MQVLV 50", kind: price, frequency: daily, mandatory: true, purpose: "off-the-shelf multifactor competitor -- the real alternative to building this"}
  - {name: india_cash_rate, kind: risk_free_rate, frequency: daily, mandatory: true, purpose: "Sharpe-ratio numeraire only -- this book itself never holds cash"}

ambiguities:
  - field: universe.mapping (scope)
    issue: >
      The paper's more original and more heavily promoted component (AdaBoost
      cross-sectional stock ranking) cannot be tested at all with current data
      and templates; this card tests only its secondary, lower-profile component
      (minimum variance), at coarser granularity than the paper used.
    resolution: >
      Proceed with the scoped card, explicitly labelled as a PARTIAL test, not
      scored against the paper's combined-strategy numbers. Write up the
      stock-ranking component as a missing-capability specification (see notes)
      for a human to decide whether it is worth building: individual-constituent
      NIFTY500 price/volume data would need to be procured, and a new
      cross-sectional stock-selection allocator would need to be designed and
      audited -- this is new engine work, not something this card, or any card,
      can authorize on its own.
    confidence: high
    material: true

  - field: universe.assets (beta screen)
    issue: >
      Which sleeves are "low beta" is asserted from general factor
      characteristics (low-vol and quality/value sleeves are conventionally
      more defensive than momentum/alpha sleeves), not computed from this fund's
      own data.
    resolution: >
      Compute each sleeve's trailing beta to NIFTY 500 (a simple, already-
      available calculation) before or immediately after the first run, and
      confirm the three chosen sleeves are in fact the lowest-beta three of the
      five. If not, redraft the universe rather than keep a screen known to be
      wrong.
    confidence: low
    material: true

  - field: signal.lookback_days
    issue: >
      63 trading days ("previous quarter") mirrors the paper's own window, but
      it was chosen for a 25-INDIVIDUAL-STOCK covariance matrix; sleeve-level
      indices are already diversified composites, so a quarter's worth of daily
      returns may be a very different amount of effective information at this
      granularity, and the paper gives no evidence either way for indices.
    resolution: >
      Treat 63 days as a starting point, not a validated choice; report a named
      sensitivity across {21, 63, 126, 252} days, since min-variance weights
      (unlike the SBG card's markowitz_l1) have no other risk-cap hyperparameter
      to interact with, making this the single most consequential knob here.
    confidence: medium
    material: true

  - field: metrics.sharpe_convention
    issue: >
      Same engine-wide issue as every other card: ros/validation/metrics.py
      implements a geometric and a conventional Sharpe and requires a card to
      state which one it targets. This card states neither.
    resolution: >
      Report both sharpe_geometric and sharpe_conventional side by side, as
      required fund-wide practice, not a choice specific to this card.
    confidence: high
    material: true

  - field: costs.impact_bps_per_pct_adv
    issue: >
      10.0 is the same fund-wide guessed floor used on other cards, not
      evidenced for this specific universe. Min-variance turnover is typically
      lower than a momentum/optimization-driven book, so this may be more
      conservative here than elsewhere, but that has not been checked.
    resolution: >
      Keep 10.0 as the fund-wide placeholder pending the same procurement item
      (real tracking-error/turnover data) already logged against the SBG-paper
      card; report turnover explicitly so a reviewer can judge how much this
      assumption actually matters for THIS strategy. Materiality raised to true
      (critique-card finding): "min-variance turnover is typically lower" is an
      asserted, not measured, claim for this specific 3-sleeve universe, and
      should not be pre-judged as immaterial before the run's own turnover
      figure confirms it.
    confidence: medium
    material: true

  - field: n_configs_tried
    issue: >
      The paper documents an iterative process for its OTHER components
      (comparing "a range of different classifiers," three candidate training
      windows, a volatility-exclusion threshold, an in/out fundamental-factors
      test, a 55/45-vs-50/50 tilt, two leverage levels) but never states an
      explicit hyperparameter search specifically for the MVP's own parameters
      (N=25 stocks, the 66-day beta window, the quarterly covariance window).
      Treating this card's trial count as 1 (implying zero selection bias) would
      be naive given the paper's overall iterative process; treating it as the
      full ~15-20 implied by the other components would overstate what was
      actually searched for the piece we are adapting.
    resolution: >
      Carry n_configs_tried=5 as a nominal, explicitly-hedged floor -- not a
      documented count, since none exists for this specific piece. Revisit
      upward if this card is ever extended (e.g. if the beta-screen selection in
      the ambiguity above is itself tuned rather than computed once and fixed).
    confidence: low
    material: true

replication_targets: []

benchmark_templates:
  # NOTE (critique-card finding): ros/runner.py fixes the asset universe to
  # card.universe.assets for every benchmark spec -- a benchmark_template CANNOT
  # reach outside this card's 3-sleeve universe. A prior draft here had a
  # mislabeled "Equal-weight sleeves (all 5)" entry that would have silently
  # duplicated the row below. A real 5-sleeve comparison must come from
  # cross-referencing the separate SBG-paper card's own results, not from here.
  - {name: "Equal-weight screened subset",  template: fixed_weight,  params: {weights: equal}, rebalance: annual}
  - {name: "Inverse vol (screened subset)", template: inverse_vol,   params: {}}

n_configs_tried: 5

notes: >
  MISSING CAPABILITY, for the human queue: the paper's headline mechanism is a
  cross-sectional AdaBoost classifier ranking ~500 individual stocks by RSI,
  stochastic %D, a moving-average crossover, and dollar volume, then going long
  the top quintile. None of our eight registered allocator templates
  (equal_risk_contribution, equal_weight, fixed_weight, inverse_vol,
  markowitz_l1, min_variance, ts_momentum, vol_target) perform cross-sectional
  ranking or selection across a stock universe -- all eight allocate weights
  across a small, pre-named set of assets. Testing this component for real would
  require (1) procuring individual-constituent NIFTY500 daily price and volume
  history (not currently held), and (2) designing, auditing, and registering a
  new allocator template for cross-sectional stock selection -- a human decision
  and a human implementation task, not something resolvable inside this card.
  Note also that the paper's own quintile chart (Fig. 2, p.8-9) is the only
  evidence offered that the ranking has skill; the AdaBoost classifier itself
  only reached 53% cross-validation accuracy, and the paper never reports
  whether a much simpler rank-by-momentum rule (no ML at all) would have done
  comparably -- worth asking for, if this is ever scoped as a build.

  Separately, for what THIS card actually tests: this is a narrow, low-ambition
  experiment by construction (a 3-sleeve min-variance book) and should not be
  expected to reproduce anything like the paper's own reported Sharpe ratios,
  which describe a materially different (and partly mis-stated, see
  broken_assumptions on abstract/table conflation) long-short, leveraged
  strategy on 500 individual stocks.

  RISK-FREE BASIS (critique-card finding): the paper never states what
  risk-free rate underlies its own reported Sharpe ratios (0.42 for S&P 500,
  0.58/0.89/0.92 unlevered for its three strategies) -- unlike the SBG paper,
  which used the fed funds rate throughout. This does not affect anything this
  card computes (there are no replication_targets), but no cross-paper Sharpe
  comparison should ever be attempted against this paper's own numbers -- there
  is no disclosed common basis to compare against.
