convertibility:
  verdict: convertible_with_data
  confidence: low
  headline: Cannot run until an Indian short interest series exists; if one does, signal meaning is doubtful
  what_must_be_true:
  - 'The low short interest effect exists in the source market and is not an artefact: partly, since equal weighting
    gives 1.4% a month, value weighting 0.5%, and NYSE-AMEX alone is not significant.'
  - A usable short interest series exists for Indian stocks.
  - Low measured short interest in India reflects short sellers' view and not an inability to short.
  - 'An effect survives in NIFTY 500 names: the paper finds none in its largest size quartile (Table 5) and holds
    stocks far smaller than anything in this universe.'
  - The edge survives 30bp round trip at monthly turnover plus real borrow cost on the most shorted names.
  - The short leg adds more than it costs relative to the low-SIR leg alone.
  - The book is implementable at the fund's size in names that are not micro caps.
  weakest_link: 'Two links of similar weakness, kept apart. (a) The segment link: the paper''s own Table 5 shows
    no significant low-minus-high alpha in the largest size quartile (Panel C large size: 0.0% to 0.6%, none significant),
    and NIFTY 500 holds nothing like the $29M median low-SIR stock (Table 4). Even with perfect data a large-cap
    null is the likelier outcome, and unlike data it cannot be bought. (b) The meaning link: in India a low reading
    may mark stocks that cannot be shorted, which the paper''s own background (page 7) predicts should underperform.
    The data link (whether a series exists) is a precondition for both, not the weakest link itself.'
  decisive_evidence: 'In order: (1) a monthly stock-level short position series with publication dates and coverage
    by size band; (2) the NIFTY Smallcap 250 sub-cut, pre-declared as the decisive test of the segment link and
    reported next to the NIFTY 500 result; (3) per-stock borrowability, to test whether low-SIR names are the unshortable
    ones. Ask the data owner for coverage by size band before buying a series that covers only large names.'
  if_it_fails: 'A null on NIFTY 500 with data would say only that short interest carries no information in the large-cap
    half of India, which the paper also finds in the US largest quartile. A failure because low-SIR names are the
    unshortable ones would be the more useful finding: short interest is a constraint proxy in India, not an opinion
    measure.

    '
  capacity_note: 'Unknown and probably small on both legs. The paper''s alpha sits in small, low priced, high turnover
    stocks, and a monthly rebalance into the lower half of NIFTY 500 is capacity limited by traded value. The short
    leg adds borrow depth and margin as separate limits, neither measured here.

    '
india_notes:
- category: data
  item: 'No exchange publishes a US-style monthly stock-level short interest figure for all Indian stocks. Candidates
    are securities lending and borrowing outstanding and exchange short-sale disclosures. Whether either gives a
    monthly, stock-level, history-long series is unverified here.

    '
  why: 'The strategy ranks on this field. The same name (short interest) may measure a very different thing in India,
    and a series that covers only F&O stocks excludes the segment where the paper''s effect is strongest.

    '
  triggered_by: the paper sorts every stock on monthly exchange-reported short interest (page 8)
  addresses:
  - monthly stock-level short position with report and publication dates (NOT HELD)
  evidence_page: 8
- category: validity
  item: 'In India a near-zero short position often means the stock cannot be shorted, not that short sellers chose
    to stay away.

    '
  why: 'UNVERIFIED (drafter''s market knowledge, confirm at Gate A): The paper''s reading of low short interest
    as good news rests on shorting being feasible. Where it is not, its own background (page 7) predicts underperformance,
    so the low-SIR leg can hold two opposite populations.

    '
  triggered_by: the interpretation in section 2 that absence of short selling signals no private bad news
  addresses:
  - monthly stock-level short position with report and publication dates (NOT HELD)
  evidence_page: 7
- category: execution
  item: 'The short leg is the highest short interest quartile. These are the stocks where borrowing is scarcest
    and recalls are most likely, and India permits no naked shorting.

    '
  why: 'UNVERIFIED (drafter''s market knowledge, confirm at Gate A): A flat borrow cost understates the cost of
    exactly the names this sort selects.

    '
  triggered_by: the long-short portfolio SIR 1% minus SIR 99% (Table 1)
  addresses:
  - the short leg must be restricted to names that can actually be shorted once a borrowability list exists
  evidence_page: 31
- category: timing
  item: 'The publication date of each short position report must gate its use, and the paper never states it.

    '
  why: 'Using the report date instead of the publication date is a look-ahead that flatters a monthly rebalance.

    '
  triggered_by: portfolios formed from the previous month's report without a stated date (page 9)
  addresses:
  - short interest is used only after its publication date; lag_days >= 1
  evidence_page: 9
- category: cost
  item: 'Monthly rebalancing into the lower half of NIFTY 500 by size is costlier than the 30bp floor, and the paper
    reports no costs.

    '
  why: 'The effect is concentrated in high turnover, smaller stocks, where impact and circuit limits bite and where
    30bp is optimistic.

    '
  triggered_by: the Table 5 finding that alpha is concentrated in small, high turnover cells (page 38)
  addresses:
  - daily close, volume and market cap, Accord-priced Indian equities (~1,314 names)
  evidence_page: 38
- category: validity
  item: 'Point-in-time NIFTY 500 membership is available only to March 2026 and is reconstructed from a market-rank
    file, not from official constituent lists.

    '
  why: 'The sort is cross-sectional and monthly, so membership errors change which names can enter either leg. A
    rank-based proxy mixes in names that were never index members and drops ones that were, in the small-cap half
    where the effect lives.

    '
  triggered_by: the strategy ranks within a changing universe every month and the paper includes delisted stocks
    (page 8)
  addresses:
  - monthly point-in-time market-rank universe (Monthly_uni_new.xlsx)
  evidence_page: 8
