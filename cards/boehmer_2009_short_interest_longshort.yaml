ambiguities:
- field: strategy.signal_definition
  headline: Short interest report date vs tradable date is unstated in the paper; look-ahead risk
  issue: 'The paper forms portfolios at the start of month t from the previous month''s short interest report (page
    9) but never says which date the report is struck on or when it becomes public.

    '
  resolution: 'Use each report only from its own publication date plus lag_days of 1, and require the data request
    to include a publication timestamp. No row without one is eligible.

    '
  confidence: low
  material: true
  evidence_page: 9
- field: strategy.signal_definition
  headline: Zero-SIR names go first, all of them, as in the paper; no turnover tie-break
  issue: "The paper's lightly shorted portfolios take every zero short interest stock before adding others to reach\
    \ the percentile, so the 1% portfolio averages 232 stocks against 45 in the 99% portfolio (pages 11, 14).\n\
    \ In India zero readings are probably a large majority, so the tie rule decides leg membership far more than\
    \ in the paper."
  resolution: 'Tie and zero handling follows the paper (page 17, page 11): every zero-SIR eligible name is in the
    low group first. If zero-SIR names are 25% or less of eligible_t, the low group is filled up from the lowest
    positive SIR to the quartile, and every name tied at the boundary is included, so leg size can vary. If zero-SIR
    names are more than 25% of eligible_t, the low group is ALL of them and the high group is the top third of the
    positive-SIR names, as the paper splits the remainder into three equal groups. There is no tie-break by turnover.
    If either leg has fewer than 20 names the month is carried forward and flagged. The share of eligible names
    at zero is reported every month.'
  confidence: medium
  material: true
  evidence_page: 11
- field: strategy.signal_definition
  headline: Two turnover definitions in the paper; trailing-month shares traded chosen
  issue: 'The text on page 8 defines turnover as average daily volume over shares outstanding; the Table 4 caption
    (page 36) says monthly shares traded over shares outstanding. Table 4 values fit the monthly definition.

    '
  resolution: Use monthly shares traded divided by shares outstanding (market cap over price, not free float). Turnover
    is measured over the trailing calendar month ending on the rebalance date (shares traded in that month divided
    by shares outstanding, shares taken as market cap over price) and shifted by lag_days, never over the holding
    month.
  confidence: medium
  material: true
  evidence_page: 36
- field: universe.description
  headline: Top-half turnover filter replaces the paper's size-then-turnover quartile grid
  issue: 'The paper sorts 4x4x4 (size, turnover, SIR) giving 64 cells. With about 500 names that gives roughly 8
    names per cell, which is unusable.

    '
  resolution: 'Keep the paper''s central finding that the effect sits in high-turnover stocks, by restricting to
    the top half by turnover, and sort on SIR only. Size conditioning is dropped and reported as a limitation. A
    smallcap cut is kept as a sensitivity.

    '
  confidence: medium
  material: true
  evidence_page: 18
- field: strategy.weighting_rule
  headline: Equal weighting chosen; paper's value-weighted effect is about a third as large
  issue: 'Table 1 reports both weightings and the long-leg alpha drops from about 1.4% to 0.5% a month with value
    weighting (page 31). The paper calls neither clearly superior (page 10).

    '
  resolution: 'Equal weight, matching the paper''s headline, and state in every report that it is the more flattering
    basis. A value-weighted run is not part of this card.

    '
  confidence: medium
  material: true
  evidence_page: 10
- field: costs.spread_bps
  headline: Paper reports no costs or turnover; direction of cost error is unknown
  issue: No costs, turnover or capacity appear in the paper. Short interest is persistent (77% of low-SIR stocks
    move at most one decile a month, page 24), but those low deciles are economically almost identical (footnote
    7), so realised turnover is unknown.
  resolution: Charge the fund's 30bp floor on both legs plus 300bp a year of borrow on short notional, measure realised
    monthly turnover per leg, report the break-even cost and sweep 30 to 90bp and borrow 100 to 600bp.
  confidence: low
  material: true
- field: data.pit_status
  headline: Point-in-time membership ends March 2026; sample ends there
  issue: 'The monthly universe file has no usable rows after March 2026 although prices run to July 2026.

    '
  resolution: End the sample at 2026-03-31 rather than ranking on stale membership.
  confidence: high
  material: false
- field: data_plan.ideal (delisting returns)
  headline: Delisted names and final returns in the held price panel are unchecked
  issue: The paper keeps delisted stocks and uses CRSP delisting returns because short interest is exceptionally
    high in delisting stocks (page 8). Whether the 1,314-security Accord panel contains delisted or suspended names,
    and what their final return is, has not been checked.
  resolution: Before Step 04 run the master-universe survivorship check; require delisted names to be present and
    set a stated final-return convention (last traded price, or zero after suspension). If the panel is survivor-only,
    report that the short leg is understated and the long leg flattered.
  confidence: medium
  material: true
  evidence_page: 8
- field: intent.broken_assumptions
  headline: India short-selling facts below are the drafter's own, unsourced
  issue: Claims that India has no naked shorting, that borrowing concentrates in F&O names, and that a near-zero
    short position mostly means inability to short are stated without a source.
  resolution: Treated as UNVERIFIED market-structure claims; the data owner or PM confirms them at Gate A and a
    source is added.
  confidence: low
  material: true
replication_targets: []
benchmark_templates:
- name: Equal-weight eligible universe (no short interest sort)
  template: equal_weight
  params: {}
  rebalance: monthly
- name: Inverse-vol eligible universe (no short interest sort)
  template: inverse_vol
  params: {}
  rebalance: monthly
data_plan:
  ideal:
  - field: Stock-level short position (shares sold short) for every NIFTY 500 stock, with report date and publication
      date
    granularity: monthly
    history_from: '2012-01-02'
    why: 'This is the signal. The paper sorts on a monthly snapshot of short interest divided by shares outstanding
      (page 4).

      '
    why_granularity: 'Monthly, matching the paper. Daily would let the signal be refreshed faster than the paper
      tests and change the question; quarterly would drop most of the variation the persistence result relies on
      (Figure 3, page 45).

      '
    why_history: 'As far back as the Accord price panel (2012) so that the sample is as long as the price data allows.
      Short samples are the card''s second weakest link.

      '
    adjustments: 'Needs shares outstanding at the report date (not free float), the report date and the publication
      date as separate fields, and corporate-action adjustment for splits and bonus issues on the position count.

      '
    minimum_viable: true
  - field: Daily price, volume and market cap for the NIFTY 500 universe
    granularity: daily
    history_from: '2012-01-02'
    why: Returns, the turnover filter and the market-cap link to shares outstanding.
    why_granularity: 'Daily gives monthly turnover by summation. Monthly bars alone could not form the turnover
      filter; intraday data answers a question the paper does not ask.

      '
    why_history: 2012-01-02 is the start of the Accord panel; the backtest window starts 2013-03-31.
    adjustments: price and market cap as supplied by Accord Fintech; market cap is total, not free float; delisted
      and suspended names must be present with a stated final-return convention (see ambiguities)
    minimum_viable: true
  - field: Point-in-time NIFTY 500 membership, monthly
    granularity: monthly
    history_from: '2012-01-02'
    why: Avoids survivorship bias; the paper includes delisted stocks.
    why_granularity: monthly, matching the source file's snapshots
    why_history: same window as the price panel
    adjustments: market rank field, forward filled between monthly snapshots; usable only to March 2026
    minimum_viable: true
  - field: Per-stock borrowability and borrow cost, monthly
    granularity: monthly
    history_from: '2013-03-31'
    why: The short leg holds the most shorted names, so whether it can be run at all depends on this.
    why_granularity: monthly, to match the rebalance
    why_history: same window as the price panel
    adjustments: 'per stock and date: is_borrowable and borrow_cost_bps'
    minimum_viable: false
  - field: India Fama-French-Carhart monthly factor returns
    granularity: monthly
    history_from: '2012-01-02'
    why: The paper's headline metric is the four-factor alpha.
    why_granularity: monthly, as in the paper's regression
    why_history: same window as the price panel
    adjustments: state size breakpoints and whether built on NSE or all-India stocks
    minimum_viable: false
  rejected_alternatives:
  - option: Use F&O open interest or delivery percentage as a stand-in for short interest
    why_not: 'Both are different quantities. Open interest mixes long and short positions and exists only for F&O
      names, and delivery percentage measures something else. A proxy would test a different paper under the same
      title.

      '
  - option: Run the turnover and size sort without any short interest signal
    why_not: That tests the size and liquidity effects the paper explicitly controls for, not short interest.
  - option: Quarterly short position snapshots
    why_not: Too coarse; the paper's alphas are monthly and persist about six months (Figure 3), so a quarter blurs
      the formation date.
  - option: Run on the sleeves the fund already holds
    why_not: No index sleeve has a short interest series; a cross-sectional mechanism needs stocks.
  granularity_verdict: 'Monthly short interest and daily prices, because the paper forms portfolios monthly and
    the turnover filter needs daily volume.

    '
  optimality_argument: 'The smallest dataset that tests the paper''s actual mechanism is a monthly stock-level short
    position series joined to the held daily price panel and point-in-time membership. Every other addition either
    tests a different mechanism (open interest, delivery percentage), cannot form the estimator (quarterly), or
    prices a decision the strategy does not make (intraday).

    '
  what_would_change_the_answer: 'The short interest series decides everything: without it there is no test. Borrowability
    data could change what the short leg may claim, and factor returns only change how alpha is labelled.

    '
selection:
  rule: 'Monthly: universe = point-in-time NIFTY 500 names priced in Accord. eligible = universe names with a short
    interest figure published on or before the rebalance date and turnover in the top half. Rank on the negative
    of SIR with zero-SIR names first. LONG = lowest-SIR quartile, equal weighted. SHORT = highest-SIR quartile,
    equal weighted. No explicit securities are named.

    '
  explicit_securities: []
  verified_against: master_universe
  as_of: '2026-03-31'
  why_these: 'The rule is the whole decision. The allocator re-derives both legs each month from the held price
    panel and the short interest series once supplied. Every held name should be written to a holdings log by write_holdings_log().

    '
backtest_plan:
  sample_start: '2013-03-31'
  sample_end: '2026-03-31'
  why_this_window: 'The fund convention start matches accord_data.BACKTEST_START. The end is March 2026, where point-in-time
    membership stops, instead of the price end in July 2026. Truncating earlier would lose the 2020 crash and recovery,
    which is the main stress test for a strategy that holds the most shorted stocks.

    '
  warmup_days: 60
  why_warmup: 'Two months, so the first rebalance has a known short interest report and a full month of turnover.

    '
  rebalance_rule: Last trading day of each month, using reports published before that day; signals shifted by 1
    + lag_days.
  weights_rule: Equal weight within each leg, 50% long and 50% short, gross <= 1.0.
  explicit_weights: {}
  benchmarks:
  - name: NIFTY 500
    why_this: The fund benchmark and the do-nothing option.
  - name: Low-SIR leg only (same universe, same rule)
    why_this: Isolates what the short leg adds. The paper's long-leg and short-leg shares differ by weighting, so
      the split must be measured here.
  - name: Equal-weight eligible universe, top-half turnover
    why_this: Strips the short interest sort and keeps the turnover and universe choices, so any edge is attributable
      to short interest and not to liquidity.
  - name: NIFTY500 VALUE 50
    why_this: The paper's low-SIR portfolios look like small value stocks (page 11); this is the off-the-shelf product
      that would capture that tilt.
  - name: Cash-plus (flat 6% proxy swept 4-8%)
    why_this: A beta-near-negative-0.4 spread should be judged against cash and on alpha, not against a long-only
      index it will lose to in a rising market.
  must_beat:
  - the equal-weight top-half-turnover universe, or the short interest sort adds nothing beyond liquidity
  - the low-SIR long leg alone, or the short leg is adding cost without adding return
  - the NIFTY Smallcap 250 sub-cut, reported separately and pre-declared as the decisive test of the segment link
  - 'zero on factor-adjusted alpha: the book''s alpha after a regression on NIFTY 500 and the fund''s factor sleeves
    must be positive at 5%, with realised beta reported'
  success_looks_like: 'Primary: positive alpha at 5% after regressing the long-short return on NIFTY 500 and the
    fund''s factor sleeves (VALUE 50, MOMENTUM 50), with realised beta reported, because the paper''s own metric
    is factor alpha. The book also beats the low-SIR leg alone after borrow and short-side costs, beats the equal-weight
    turnover-filtered universe, survives a borrow sweep from 100 to 600bp, and the Smallcap 250 sub-cut agrees in
    sign. Geometric Sharpe against NIFTY 500 is reported but is not the test, since the book has net negative market
    beta.'
  failure_looks_like: "Any of: the low-SIR leg does not beat the high-turnover equal-weight universe, which would\
    \ mean the result is liquidity and not short interest; the short leg costs more than it earns; alpha disappears\
    \ against the factor fingerprint; the verdict flips inside the borrow sweep; or the low-SIR names turn out to\
    \ be the least shortable stocks, which would read as a short constraint proxy and not short seller information.\n\
    \ Also a failure: positive alpha only in the NIFTY 500 cut and not in the Smallcap 250 sub-cut, or alpha that\
    \ comes entirely from a short-beta tilt."
  known_failure_modes:
  - 'SHORT CONSTRAINT MASQUERADING AS GOOD NEWS: if low measured short positions in India mostly mark stocks that
    cannot be shorted, the long leg holds a population the paper would predict to underperform.

    '
  - 'MICRO-CAP ARTEFACT: the paper''s alpha sits in tiny, low-priced stocks. A null on NIFTY 500 would not disprove
    the paper, only its large-cap case.

    '
  - 'BORROW COST AND RECALL: the short leg is the most shorted quartile, where borrow is scarce; a flat 300bp is
    probably light.

    '
  - 'SHORT HISTORY: about 12 years and 150 monthly observations, against 211 months in the paper.

    '
  - 'SURVIVORSHIP: a price panel without delisted or suspended names flatters the low-SIR small names and misstates
    the most-shorted leg, where delisting losses concentrate.'
