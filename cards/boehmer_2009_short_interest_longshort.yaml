card_version: '1.0'
paper:
  id: boehmer_2009_short_interest_longshort
  title: 'India adaptation: low-short-interest long-short on NIFTY 500 stocks (from Boehmer, Huszar & Jordan 2009,
    ''The good news in short interest'')'
  authors:
  - Ekkehart Boehmer
  - Zsuzsa R. Huszar
  - Bradford D. Jordan
  date: '2009-04-23'
  source_file: docs/papers/boehmer_huszar_jordan_2009_good_news_short_interest.pdf
  source_sha256: 22205b85f0d95b44
intent:
  mode: adaptation
  parent_card: ''
  rationale: 'The paper''s headline portfolio is long the lowest short-interest stocks and short the highest (SIR
    1% minus SIR 99%, Table 1). This is the full-construction card: both legs kept, translated to the NIFTY 500
    using stock-level data held locally, and run through universal_backtester with allow_short=True. A paired long-only
    card, boehmer_2009_short_interest_adaptation.yaml, exists because the short leg is the one leg with a named
    India constraint: it is the MOST shorted stocks by construction, which are exactly the names hardest to borrow,
    and India has no naked shorting. Neither card can run until a stock-level short interest series for India exists,
    so both carry a blocking data request.

    '
  transferred_mechanism: 'Each month, rank the point-in-time NIFTY 500 names that trade heavily (turnover in the
    top half) on last month''s short interest ratio (short position divided by shares outstanding), with every zero-short-interest
    name placed first. Hold the lowest-SIR quartile long and the highest-SIR quartile short, equal weighted within
    each leg, gross neutral, rebalanced monthly. The mechanism that is meant to transfer is the paper''s reading
    of absent short selling as a signal of no private bad news, which only holds where shorting is feasible.

    '
  broken_assumptions:
  - 'THE SIGNAL DOES NOT EXIST IN HELD DATA. The paper uses exchange-published monthly short interest for every
    NYSE, AMEX and NASDAQ stock. No stock-level short position series for India is held. Every other broken assumption
    below is secondary to this one.

    '
  - 'UNVERIFIED (drafter''s market knowledge, confirm at Gate A): SHORT CONSTRAINTS BIND IN INDIA, WHICH REVERSES
    THE PAPER''S READING. The paper interprets low short interest as short sellers choosing to avoid a stock (section
    2, page 7), which is only true where shorting is easy and cheap. India has no naked short selling and borrowing
    is concentrated in F&O-eligible names, so for most NIFTY 500 stocks a near-zero short position reflects inability
    to short. The paper''s own background says a constraint-driven zero should predict underperformance, the opposite
    of its finding. The low-SIR leg may therefore mix two opposite populations.

    '
  - 'UNVERIFIED (drafter''s market knowledge, confirm at Gate A): THE SHORT LEG IS THE LEAST BORROWABLE BY CONSTRUCTION.
    It holds the stocks with the highest existing short interest, which are the ones where borrow is scarce or expensive
    and recalls are likely. The paper charges no borrow cost.

    '
  - 'THE PAPER''S LOW-SIR NAMES HAVE NO COUNTERPART IN NIFTY 500. Low-SIR stocks have a median market cap of about
    $29M and median price of $5.30 (Table 4, page 36). The paper shows the effect is absent in the largest size
    quartile (Table 5, page 38). NIFTY 500 holds nothing that small, so the test is weaker than the paper''s by
    design.

    '
  - 'THE LOW-SHORT-INTEREST LEG IS A DIFFERENT SIZE. The paper''s 1% portfolio holds 232 stocks on average (about
    5% of 4,400) because all zero-SIR names go in first, against 45 in the 99% leg (page 14). This card uses quartiles
    on each side (Table 5 convention, page 17), so both legs are the same size.

    '
  - 'FACTOR-ADJUSTED ALPHA CANNOT BE REPRODUCED AS PRINTED. The paper''s headline is a Fama-French-Carhart four-factor
    alpha using US factors. No Indian RMRF, SMB, HML or MOM series is held, and book-to-market is not in the local
    fundamentals (only PE and EV/EBIT).

    '
  - 'EQUAL WEIGHTING HEAVILY FAVOURS THE EFFECT. Equal-weighted long alpha is about 1.4% a month against 0.5% value
    weighted (Table 1, page 31). This card is equal weighted to match the paper''s headline, and states that it
    is the more flattering of the two.

    '
  - 'NO COSTS IN THE PAPER. It reports no transaction costs, turnover or capacity. This card charges 30bp round
    trip plus a borrow cost, and is likely still optimistic for monthly rebalancing into the lower half of NIFTY
    500.

    '
  - 'SAMPLE LENGTH AND ERA. 1988-2005 for the paper against about 13 years of Indian data, ending 2026-03 where
    point-in-time membership stops.

    '
universe:
  description: 'Point-in-time NIFTY 500 constituents (Monthly_uni_new.xlsx, top 500 by market rank, restricted to
    Accord-priced names), further restricted each month to names with a known short interest figure and turnover
    in the top half of that month''s eligible names. Ranked on short interest ratio; both quartiles traded.

    '
  asset_class: equity
  geography: IN
  assets:
  - ACCORD_STOCK_LEVEL_PRICE_MCAP
  benchmark: NIFTY 500
  cash_asset: CASH_PROXY_CONSTANT_6PCT
universe_translation:
  source_universe: CRSP all US common stocks
  source_breadth: 4400
  source_selection_rule: 'CRSP share codes 10 and 11 on NYSE, AMEX and NASDAQ; listed at least one year; non-missing
    return, volume, shares outstanding and price; when-issued excluded; delisting returns kept. No size, price or
    liquidity floor in the baseline.

    '
  target_universe: NIFTY 500 constituents
  grade: loose
  resolution: needs_data
  rationale: 'The mechanism is a cross-sectional percentile sort needing a few hundred names, and the paper shows
    the effect lives in small and mid-small, high-turnover stocks (Table 5). NIFTY 500 is the largest in-mandate
    universe held at stock level. NIFTY Smallcap 250 ranked first (55 against 53) and is kept as a sub-segment cut,
    because a smallcap-only universe removes the size contrast the paper''s own evidence rests on. Grade is loose
    because the paper''s most extreme low-SIR names are far smaller than anything in NIFTY 500.

    '
  transfer_risks:
  - No stock-level short interest series for India is held; the signal itself is missing.
  - Zero or low short positions in India mostly reflect inability to short, not short sellers' view, which reverses
    the paper's interpretation for those names.
  - The paper's low-SIR median market cap is about $29M; NIFTY 500 has no stocks that small.
  - Turnover and size conditioning needs about 250 names after the high-turnover filter; the universe is at that
    floor.
  - India factor returns are not held, so the four-factor alpha is replaced by the fund's own factor fingerprint.
  mechanism_needs:
    needs_cross_section: true
    min_names: 250
    cap_segment: small
    sector: null
    min_history_years: 10.0
    must_be_in_mandate: false
    notes: 'A quartile sort with about 25 names per decile-sized bucket needs 250 eligible names after the turnover
      filter. The paper''s strongest results are in small and mid-small stocks, so the segment test matters more
      than the headline one.

      '
  alternatives_considered:
  - NIFTY Smallcap 250 constituents (ranked first, in mandate)
  - NIFTY Total Market constituents (out of mandate)
  - NIFTY Microcap 250 constituents (out of mandate)
  - NIFTY MidSmallcap 400 constituents
  why_not_alternatives: 'Smallcap 250 is kept as a sub-segment cut instead of the governing universe because the
    paper''s own evidence is a size-by-turnover interaction. Total Market and Microcap 250 are outside the mandate
    and the monthly universe file covers only the top 500 in most months. MidSmallcap 400 is adjacent but adds nothing
    the NIFTY 500 plus Smallcap 250 pair does not already cover.

    '
  required_instruments:
  - ACCORD_STOCK_LEVEL_PRICE_MCAP
  - monthly stock-level short position series for India (NOT HELD)
  - NIFTY 500
  evidence_page: 8
strategy:
  signal_name: neg_short_interest_ratio
  signal_definition: "SIR(i, t-1) = short position in stock i as of the most recent short interest report published\
    \ before the rebalance date, divided by shares outstanding. The score handed to the allocator is -SIR, so the\
    \ lowest SIR scores highest. Each month-end rebalance: universe_t = point-in-time NIFTY 500 names priced in\
    \ Accord. eligible_t = universe_t names with a short interest figure known on or before the rebalance date AND\
    \ trailing-month turnover (defined below) in the top half of universe_t. Tie and zero handling follows the paper\
    \ (page 17, page 11): every zero-SIR eligible name is in the low group first. If zero-SIR names are 25% or less\
    \ of eligible_t, the low group is filled up from the lowest positive SIR to the quartile, and every name tied\
    \ at the boundary is included, so leg size can vary. If zero-SIR names are more than 25% of eligible_t, the\
    \ low group is ALL of them and the high group is the top third of the positive-SIR names, as the paper splits\
    \ the remainder into three equal groups. There is no tie-break by turnover. If either leg has fewer than 20\
    \ names the month is carried forward and flagged. The share of eligible names at zero is reported every month.\
    \ Missing short interest means ineligible, never zero. Long = the low group and short = the high group, as defined\
    \ above, equal weighted within each leg.\n Turnover is measured over the trailing calendar month ending on the\
    \ rebalance date (shares traded in that month divided by shares outstanding, shares taken as market cap over\
    \ price) and shifted by lag_days, never over the holding month."
  inputs_required:
  - monthly stock-level short position with report and publication dates (NOT HELD)
  - daily close, volume and market cap, Accord-priced Indian equities (~1,314 names)
  - monthly point-in-time market-rank universe (Monthly_uni_new.xlsx)
  - NIFTY 500 daily close (benchmark)
  - factor sleeves NIFTY500 VALUE 50, NIFTY500 MOMENTUM 50 and others for the factor fingerprint
  cross_sectional: true
  formation_rule: 'Tie-inclusive quartile cut on -SIR among eligible names each month, with the paper''s zero rule:
    all zero-SIR names are the low group when they exceed 25% of eligible, and the high group is then the top third
    of the positive-SIR names. Table 5 (page 17) uses SIR quartiles inside size and turnover cells; this card uses
    one cut inside the high-turnover half.'
  weighting_rule: 'Equal weighted within each leg, 50% long and 50% short notional, gross 1.0, unlevered, matching
    the paper''s equal-weighted headline.

    '
  holding_period: one month, until the next rebalance
  rebalance_frequency: monthly
  is_long_short: true
  long_only_adaptation: ''
  constraints:
  - gross exposure |long| + |short| <= 1.0, dollar neutral 0.5 / 0.5
  - eligibility needs point-in-time NIFTY 500 membership, a known short interest figure and top-half turnover
  - 30bp round trip on both legs plus a borrow cost on short notional
  - short interest is used only after its publication date; lag_days >= 1
  - the short leg must be restricted to names that can actually be shorted once a borrowability list exists
  - legs are tie-inclusive and variable in size; a month with either leg under 20 names is carried forward and flagged
  - a month with fewer than 250 eligible names is skipped, never traded; months traded and months skipped are reported
  engine_template: NEEDS_NEW_TEMPLATE
  template_gap: 'Spec for a human to implement: a tie-inclusive variant of universal_backtester CrossSectionalLongShort.
    Inputs: alpha (= -SIR) and eligible per month. Outputs: weights. Rule: if zero-SIR names are 25% or less of
    eligible, hold the lowest quartile by count extended to include every name tied at the boundary; if more than
    25%, hold all zero-SIR names long and the top third of positive-SIR names short. Equal weight within each leg.
    Carry weights forward if eligible names are under 250 or a leg is under 20. Objective: reproduce the paper''s
    zero-first grouping instead of an arbitrary tie-break by array order, which the existing allocators use. Nearest
    registered allocator is named in signal.template.'
  confidence: medium
  evidence_pages:
  - 2
  - 8
  - 9
  - 10
  - 11
  - 14
  - 18
signal:
  name: neg_short_interest_ratio
  template: universal_backtester:cross_sectional_long_short
  lookback_days: 30
  lag_days: 1
  description: "lag_days is the repo floor; the real gate is the publication date of each short position report,\
    \ which the paper never states. The allocator ranks the highest score long, so the signal supplies the negative\
    \ of SIR and the lowest SIR is held long. lookback_days (30) is the reporting cadence, not a return window.\
    \ Runs through universal_backtester.engine.Backtester with allow_short=True and build_allocator(\"cross_sectional_long_short\"\
    ), never through ros/engine. A new script mirroring scripts/alquist_2018_india_small_cap_backtest.py is needed\
    \ for Step 05 and has not been written. The allocator's min_names counts total eligible names across both legs,\
    \ and it carries weights forward unchanged below that floor.\n TIE HANDLING: the registered allocator breaks\
    \ boundary ties by array order, which would make the legs arbitrary when many names are at zero; see strategy.template_gap."
  params:
    quantile: 0.25
    weighting: equal
    long_weight: 0.5
    short_weight: 0.5
    min_names: 250
    turnover_filter: top half of the universe by trailing-month turnover
portfolio:
  rebalance: monthly
  long_only: false
  max_gross: 1.0
  allow_cash: false
  mandate_allow_cash: false
  start: '2013-03-31'
  end: '2026-03-31'
costs:
  spread_bps: 30.0
  cost_model: half_spread
  borrow_bps: 300.0
data_requirements:
- name: STOCK_SHORT_INTEREST_MONTHLY_IN
  kind: fundamental
  frequency: monthly
  start: '2013-03-31'
  mandatory: true
  purpose: the sorting signal itself; without it there is no test of this paper
- name: ACCORD_STOCK_LEVEL_PRICE_MCAP
  kind: price
  frequency: daily
  start: '2013-03-31'
  mandatory: true
  purpose: stock-level pricing, volume and market cap for both legs and the turnover filter
- name: Monthly_uni_new.xlsx point-in-time universe
  kind: membership
  frequency: monthly
  start: '2013-03-31'
  mandatory: true
  purpose: point-in-time NIFTY 500 universe; membership ends March 2026
- name: NIFTY 500
  kind: price
  frequency: daily
  start: '2013-03-31'
  mandatory: true
  purpose: fund benchmark and do-nothing comparator
- name: NIFTY500 VALUE 50
  kind: price
  frequency: daily
  start: '2013-03-31'
  mandatory: true
  purpose: factor fingerprint, since the paper's value and size loadings are material
- name: NIFTY500 MOMENTUM 50
  kind: price
  frequency: daily
  start: '2013-03-31'
  mandatory: true
  purpose: factor fingerprint, since the paper's portfolios load negatively on momentum
- name: india_cash_rate
  kind: risk_free_rate
  frequency: daily
  mandatory: true
  purpose: Sharpe numeraire
- name: India Fama-French-Carhart factor returns, monthly
  kind: factor_return
  frequency: monthly
  mandatory: false
  purpose: the paper's own headline alpha; fallback is the fund's factor fingerprint
- name: borrowability and borrow cost per stock
  kind: membership
  frequency: monthly
  mandatory: false
