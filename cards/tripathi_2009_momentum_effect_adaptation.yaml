card_version: "1.0"

paper:
  id: tripathi_2009_momentum_effect_adaptation
  title: "Investment Strategies In The Indian Stock Market: A Survey"
  authors: [Vanita Tripathi]
  date: "2009-11-01"
  source_file: "admin,+IJF+November+2009+Paper+1.pdf"
  source_sha256: null

intent:
  mode: adaptation
  parent_card: null
  rationale: >
    The survey names "momentum effect (buy past winners)" as one of 21 practitioner-rated
    strategies (Table 3 item 10, p.6; mean score 3.086, tied for 3rd-most-worthy, p.7), and
    Table 6 ranks it the 2nd most WIDELY USED strategy among respondents (mean 2.290, p.9).
    But the paper supplies no formation rule, breakpoint, holding period or rebalance
    frequency -- it is a one-line label, not a specification. This fund also has no
    individual-stock price data to rank stocks cross-sectionally; it only holds seven
    pre-built NSE factor-sleeve indices. This card tests the general PRINCIPLE the survey
    names -- buy what has been going up, avoid what has been going down -- at sleeve level,
    using the one registered template built for exactly this (ts_momentum). It is not a
    replication of anything: the paper reports no return series to replicate.
  transferred_mechanism: >
    Long-only absolute (time-series) momentum across five NSE factor sleeves: hold only
    sleeves whose trailing return is positive, size each inverse to its own volatility, and
    scale the book to a volatility target (ros/engine/templates.py TimeSeriesMomentum).
    This is the closest registered-template analogue to "buy past winners" available with
    this fund's data.
  broken_assumptions:
    - >
      BREADTH: the paper's momentum effect ranks individual STOCKS cross-sectionally (buy
      the winners, sell/avoid the losers, out of hundreds of names). This fund has no
      stock-level price data (see feasibility notes below) -- only five to seven pre-built
      factor-sleeve indices. Sleeve-level time-series momentum over five assets is a
      materially narrower, different-breadth mechanism than stock-level cross-sectional
      momentum. A positive result here says nothing about whether the stock-level effect
      the survey's respondents believe in actually exists.
    - >
      NO FORMATION/HOLDING PERIOD IN THE SOURCE: the survey gives no lookback, no holding
      period, and no rebalance frequency for momentum (p.6, Table 3 item 10 -- the entire
      specification is the six words "Momentum effect (buy past winners)"). The 252-trading-
      day lookback and monthly rebalance below are OUR choice, loosely following the
      academic convention (Jegadeesh & Titman 1993, cited by this survey's own bibliography,
      item 12), NOT sourced from this paper. Flagged as a low-confidence, material ambiguity.
    - >
      CASH: ts_momentum returns an all-cash (zero-weight) allocation when no sleeve shows
      positive trailing momentum. This fund's mandate is long-only and fully invested.
      Both variants must be run; the mandate-compliant variant governs the promotion
      decision, per the fund's standing rule for every cash-touching mechanism.
    - >
      POINT-IN-TIME: NSE factor-sleeve history is backfilled to a 2005 base date; the
      sleeves were defined and their methodology fixed years later, with knowledge of the
      intervening returns. Selection bias is built into the series (firm_registry.py).
    - >
      RETURN BASIS: these are price-return indices; dividends (~1.3-1.5% p.a.) are missing
      from every series, biasing any equity-vs-cash comparison against equity.
    - >
      INVESTABILITY: an index is not a portfolio -- no replication tracking error,
      rebalance impact, or sleeve-level turnover is charged inside the index level itself;
      the 30bp cost below is this card's own estimate, not the index's.

universe:
  description: >
    Five NSE single-factor sleeves drawn from the NIFTY500 universe (same set used in
    cards/devanathan_2026_india_factor_adaptation.yaml, for comparability). NIFTY HIGH BETA 50
    and NIFTY500 MULTIFACTOR MQVLV 50 are excluded from the selectable set: the former starts
    2012-11 (would truncate the sample seven years) and the latter is an off-the-shelf
    multifactor competitor, not a sleeve this card should be timing into and out of.
  asset_class: equity
  geography: IN
  assets:
    - NIFTY500 MOMENTUM 50
    - NIFTY500 QUALITY 50
    - NIFTY500 VALUE 50
    - NIFTY500 LOW VOLATILITY 50
    - NIFTY ALPHA 50
  benchmark: NIFTY 500
  cash_asset: CASH_PROXY_CONSTANT_6PCT   # ambiguity critic caught this missing; see critique

signal:
  name: sleeve_time_series_momentum
  template: ts_momentum
  lookback_days: 252
  lag_days: 1
  description: >
    Trailing 252-trading-day (~12-month) return per sleeve, long only sleeves with positive
    trailing return, inverse-vol sized, scaled to target_vol. lag_days=1 because NSE index
    closes publish after the close -- a signal computed on date t cannot trade at t's close.
    The lookback is an academic-convention substitute for a parameter this paper does not
    specify (see ambiguities below); it is NOT read off the source paper.
  params:
    target_vol: 0.18
    vol_weighted: true
    min_positive: 1
    alpha_source: momentum
    alpha_window: 252
    alpha_skip: 0    # straight trailing 12-month return, per this card's own description --
                     # NOT the 12-1 construction (that skips the most recent month; see
                     # cards/moskowitz_2012_tsmom_india.yaml for that variant)

portfolio:
  rebalance: monthly
  long_only: true
  max_gross: 1.0
  allow_cash: true
  mandate_allow_cash: false      # fund is long-only and fully invested
  target_vol: 0.18
  start: "2005-04-01"
  end: "2026-05-29"

costs:
  spread_bps: 30.0
  cost_model: half_spread

data_requirements:
  - {name: "NIFTY500 MOMENTUM 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "momentum-selectable sleeve", evidence_page: 5}
  - {name: "NIFTY500 QUALITY 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "momentum-selectable sleeve", evidence_page: 5}
  - {name: "NIFTY500 VALUE 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "momentum-selectable sleeve", evidence_page: 5}
  - {name: "NIFTY500 LOW VOLATILITY 50", kind: price, frequency: daily, start: "2005-04-01", mandatory: true, purpose: "momentum-selectable sleeve", evidence_page: 5}
  - {name: "NIFTY ALPHA 50", kind: price, frequency: daily, start: "2003-12-31", mandatory: true, purpose: "momentum-selectable sleeve", evidence_page: 5}
  - {name: "NIFTY 500", kind: price, frequency: daily, start: "2003-09-30", mandatory: true, purpose: "fund benchmark"}
  - {name: "CASH_PROXY_CONSTANT_6PCT", kind: risk_free_rate, frequency: daily, mandatory: true, purpose: "cash accrual for the faithful (non-mandate) variant, which can hold 100% cash"}

ambiguities:
  - field: universe.cash_asset
    issue: >
      No Indian risk-free series is in the snapshot, and ts_momentum can return 100% cash
      when no sleeve shows positive trailing momentum. Caught by the ambiguity critic after
      the first draft left cash_asset null.
    resolution: >
      Declared constant 6% proxy (CASH_PROXY_CONSTANT_6PCT), swept 4%-8% per
      firm_registry.py's standing caveat. Only affects the faithful (non-mandate) variant.
    confidence: low
    evidence_page: null
    material: true

  - field: signal.lookback_days
    issue: >
      The paper gives no formation period for the momentum effect (p.6, Table 3 item 10 --
      six-word label, no parameter).
    resolution: >
      Use the literature-standard 252 trading day (~12 month) trailing return. Swept
      63/126/252 trading days as a named sensitivity; a result that only survives at one
      lookback is reported as fragile, not as the headline.
    confidence: low
    evidence_page: 6
    material: true

  - field: portfolio.allow_cash
    issue: >
      ts_momentum can return 100% cash when no sleeve is in an uptrend; the mandate is
      fully invested and long-only.
    resolution: >
      Run BOTH: the faithful cash-holding variant (does the mechanism work at all) and a
      fully-invested variant (may we run it). The mandate variant governs promotion.
    confidence: high
    material: true

  - field: universe.mapping
    issue: >
      "Buy past winner stocks," ranked cross-sectionally across hundreds of names, is being
      tested here as time-series momentum across five pre-built sleeves. Different breadth,
      different mechanism.
    resolution: >
      Proceed as an explicit ADAPTATION. There is no paper return series to score this
      against (the source reports no backtest), so this card can never be miscoded as a
      replication -- Gate A should confirm the framing stays "does sleeve-level trend
      following work" rather than "did we replicate momentum."
    confidence: high
    material: true

  - field: portfolio.target_vol
    issue: No target volatility is given or implied anywhere in the source paper.
    resolution: >
      Borrowed the 18% convention from cards/devanathan_2026_india_factor_adaptation.yaml
      (same sleeve universe, just above NIFTY 500's realised ~20.2% vol) for
      cross-card comparability. Swept 12%-26% as a named sensitivity.
    confidence: medium
    material: true

  - field: data.pit_status
    issue: Backfilled sleeve history; construction rules fixed years after the 2005 base date.
    resolution: >
      Accept for mechanism testing only. Caps the promotion ladder at ROBUST -- no live
      claim may rest on backfilled sleeve history.
    confidence: high
    material: true

replication_targets: []

benchmark_templates:
  - {name: "Equal-weight 5 sleeves", template: fixed_weight, params: {weights: equal}, rebalance: annual}
  - {name: "Static NIFTY500 MOMENTUM 50 only", template: fixed_weight, params: {weights: {"NIFTY500 MOMENTUM 50": 1.0, "NIFTY500 QUALITY 50": 0.0, "NIFTY500 VALUE 50": 0.0, "NIFTY500 LOW VOLATILITY 50": 0.0, "NIFTY ALPHA 50": 0.0}}, rebalance: annual}

n_configs_tried: 1

notes: >
  CORRECTION (pre-first-run, before any Gate A/B evidence existed): the initial draft of
  signal.params omitted alpha_source/alpha_window, which ros/engine/prepare.py requires to
  compute a momentum signal at all for the ts_momentum template -- without them ctx.alpha is
  always None, the allocator is never "ready", and the book sits at its zero-weight initial
  state (100% cash) for the entire sample. Added alpha_source: momentum, alpha_window: 252,
  alpha_skip: 0 (see cards/moskowitz_2012_tsmom_india.yaml for the analogous, already-audited
  usage). No number from any run was altered by this change; it was caught before Step 05
  ever produced a usable result.

  n_configs_tried=1: the source paper runs no backtest of any kind (it is a 93-person
  Likert-scale opinion survey), so there is no paper-side parameter sweep to inherit into
  the deflated Sharpe trial budget. Every parameter choice here (lookback, target_vol) is
  OUR adaptation choice, logged above as low/medium-confidence ambiguities for Gate A --
  it is not the paper's, so it must not be laundered as if it were tested by the source.
  The comparison that matters at Gate B is not "is the Sharpe positive" but whether this
  beats, after 30bp costs, simply holding NIFTY500 MOMENTUM 50 statically (second
  benchmark_template above) -- i.e. whether TIMING the sleeves adds anything over just
  owning NSE's own momentum basket.
