india_notes:
  - category: data
    item: >
      Screener's annual accounts are restated latest values and carry no publication
      date; the July rebalance assumes results for the year ended March were public
      by end-May.
    why: >
      Most listed companies file audited annual results by 30 May, but late filers
      and later restatements mean some July values were not what investors saw.
    triggered_by: "'accounting variables for fiscal year t-1 are used to form portfolios from the July of year t' (page 7)"
    addresses: ["annual net profit, depreciation, sales and dividend payout % (Screener profit and loss)", "annual equity capital, reserves and total assets (Screener balance sheet)", "annual cash from operations and free cash flow (Screener cash flow)"]
    evidence_page: 7
  - category: validity
    item: >
      Market cap is today's Screener share count times the bonus/split-adjusted
      close; free float is not used, as in the paper's total market equity.
    why: >
      Indian promoter holdings are large, so total-cap weights put more money in
      PSUs and promoter-held firms than an investable (free-float) weighting would.
    triggered_by: "value-weighted decile portfolios (page 7)"
    addresses: ["market cap per stock: today's Screener shares x adjusted close"]
    evidence_page: 7
  - category: data
    item: >
      Banks and NBFCs report a different balance sheet (deposits, borrowings) and
      often no free cash flow on Screener.
    why: >
      Capital investment and accruals cannot be computed for most lenders, and the
      debt-to-equity rule will be dominated by them; each rule's coverage must be
      reported per July.
    triggered_by: "D/E, CI and accrual rules (page 27)"
    addresses: []
    evidence_page: 27
  - category: data
    item: >
      Bhavcopy and the NIFTY 500 workbook are price-return; dividends are missing on
      both sides.
    why: >
      The dividend-yield, value and earnings-yield deciles pay the highest dividends
      (often PSUs at 4-6%), so those rules are understated and less likely to be picked.
    triggered_by: "Div/P anomaly (page 27)"
    addresses: ["daily corporate-action-neutralised close per stock (bhavcopy master)", "NIFTY 500 daily close (index workbook)"]
    evidence_page: 27
