notes: >
  Quick-test card (CLAUDE.md default 2026-10-06), revised 2026-10-16 a second time with
  the operator's Gate A notes: the book's ranking is kept (120-day OLS of ln(close),
  exp(slope)^250-1, times R-squared, all names ranked before filters) and the book's
  portfolio rules are replaced with a monthly top-20 equal-weight portfolio at 5% each,
  always invested, no market filter, no costs, gross returns with annual turnover.
  Benchmarks are the NIFTY 500 price index (headline) and a monthly equal-weight basket
  of the 500 universe stocks (appendix); the inverse-volatility basket is dropped.
  Timing luck is tested by rebalancing on trading day 1, 6, 11 and 16 of each month.
  The only sensitivity is the 20% jump limit. The corporate-action event list was
  revised (IRCTC added; four stocks set to DEMERGER). Convertibility is deliberately not
  written and the data_plan is short. Data: NSE bhavcopy only (plus the NIFTY 500
  workbook for the benchmark), cached data only; no download was possible or attempted.
  Revised again 2026-10-16 with operator notes 6 and 17: the churn spec is in
  strategy.formation_rule and the churn checks (holdings ledger, per-rebalance assertions,
  look-ahead test on 3 random months, corporate-action-day check, churn report) are in the
  ambiguities list.
  Revised 2026-10-16 with operator note 6: start date moved to a first signal at the
  2022-04-29 close, bought at the 2022-05-02 close.
  Validation planned at Step 05: hand-check 3 months' rankings against Excel SLOPE and
  RSQ, and check that ADANIENT 2023-02-01, ZEEL 2024-01-23 and
  IEX 2025-07-24 appear as real falls in the adjusted series.

india_notes:
  - category: data
    item: >
      Splits, bonuses and demergers on NSE have to be separated from real jumps from
      bhavcopy alone. NSE's own previous-close field does not adjust for splits in this
      data, so ISIN changes, closeness to a standard ratio and traded value are the
      evidence, and the labels are a judgement for a human to sign.
    why: >
      NSE stocks hit price bands and have frequent bonuses, splits and demergers. The 15%
      jump rule only works if a corporate action is not read as a jump and a real fall is
      not smoothed away.
    triggered_by: "disqualify any stock with a move over 15% in 120 days (page 82)"
    addresses: ["daily corporate-action-adjusted close per stock, including delisted names, built from bhavcopy with the signed-off event list (bhavcopy)"]
    evidence_page: 82
  - category: execution
    item: >
      Stocks near the top of a momentum ranking are the ones most likely to be at an upper
      price band, where a buy may not fill, and stocks that drop out may be stuck at a
      lower band when the rule says sell.
    why: "The rule resets all 20 holdings at one close each month."
    triggered_by: "buy from the top of the ranking (page 98)"
    addresses: ["point-in-time top-500 membership by trailing traded value (bhavcopy), rebuilt at month-end"]
    evidence_page: 98
  - category: validity
    item: >
      The universe is ranked by traded value, which already favours recently popular
      stocks, and momentum stocks are popular stocks, so the traded-value top 500 is
      partly selected on the same thing the ranking rewards. Rebuilding only at month-end
      softens this but does not remove it.
    why: "A rising stock trades more, so it enters a traded-value top 500 as it climbs, which can flatter a momentum rank."
    triggered_by: "S&P 500 membership is by size and committee, not by recent trading (page 40)"
    addresses: ["point-in-time top-500 membership by trailing traded value (bhavcopy), rebuilt at month-end"]
    evidence_page: 40
  - category: cost
    item: >
      Costs are zero by the operator's design, but the monthly reset of every holding to
      5% trades a large part of the book every month, often into mid and small caps with
      wide spreads.
    why: "India's round trip cost is far above a US large cap's; the turnover is high enough that the gross result will not be achievable net."
    triggered_by: "monthly full reset to equal weights"
    addresses: ["NIFTY 500 daily close (benchmark only)"]
    evidence_page: 99
  - category: timing
    item: >
      The NIFTY 500 workbook ends on 2026-09-18, earlier than bhavcopy (2026-10-05). Six
      special weekend or holiday sessions (2023-11-12, 2024-01-20, 2024-03-02, 2024-05-18,
      2025-02-01, 2026-02-01) are in the workbook but not in the bhavcopy cache.
    why: "The index gap shortens the NAV window; a missing session turns a one-day move into a two-day move."
    triggered_by: "benchmark comparison to 2026-09-18"
    addresses: ["NIFTY 500 daily close (benchmark only)"]
    evidence_page: 88

data_plan:
  ideal:
    - field: "daily open, high, low, close and traded value per stock, split and bonus adjusted, delisted names included, keyed on ISIN"
      granularity: daily
      history_from: "2008-01-01"
      why: "The regression, the 100-day average and the 15% jump test all need daily bars; delisted names must be held into their fall, never dropped."
      why_granularity: "Monthly bars would blur the jump test and the 120-day fit; intraday adds nothing to a rule that trades once a month at a close."
      why_history: "A design with no market filter needs at least one fall of 40% or more (2008) to show what it does in a bear market. About 4.5 years held has none."
      adjustments: "Splits, bonuses and demergers neutralised using the signed-off bhavcopy event list, with real falls kept; price return only; ISIN key so renamed symbols do not splice."
      minimum_viable: true
    - field: "historical NIFTY 500 membership by date"
      granularity: monthly
      history_from: "2008-01-01"
      why: "The paper buys only index members on each day."
      why_granularity: "Index rebalances are semi-annual, so monthly captures every change."
      why_history: "Same window as prices."
      adjustments: "As announced, with the effective date, not the announcement date."
      minimum_viable: false
    - field: "NIFTY 500 daily close, total return"
      granularity: daily
      history_from: "2008-01-01"
      why: "The fund benchmark."
      why_granularity: "Daily, to match the NAV dates."
      why_history: "Same window as the strategy; the workbook holds this already (price only)."
      adjustments: "Price return held; total return would add about 1.3 to 1.5 points a year."
      minimum_viable: true
  rejected_alternatives:
    - option: "NSE factor index workbook (index closes only)"
      why_not: "The rule ranks individual stocks on their own trend; index closes carry none of that."
    - option: "Top 1,000 by traded value as the universe"
      why_not: "The paper's universe is a 500-name large-cap index; going to 1,000 adds illiquid names the mandate excludes."
    - option: "What is held now: bhavcopy from October 2021, adjusted prices, NIFTY 500 workbook"
      why_not: "Not rejected for this quick test, it is what runs. Its shortcomings are 4.5 years, no bear market, a proxy universe and a hand-labelled corporate-action list."
  what_would_change_the_answer: >
    A history back to 2008 could change the reading, because a 4.5-year window with a
    worst fall of about 19% can neither confirm nor reject how a no-filter design behaves
    in a crash. Real NIFTY 500 membership and a total return index only change what may
    be claimed.
  granularity_verdict: "Daily bars are right: the rule trades monthly but measures jumps and trend on daily data. The binding constraint is years of history, not frequency."
  optimality_argument: >
    The claim being tested is that smooth momentum stocks keep rising for a month or more,
    so holding the best 20 and resetting monthly beats the market. That needs enough months
    and enough stocks, and the held data has about 53 monthly portfolios and 500 names. What it cannot
    show is behaviour in a bear market, since 2022 to 2026 in India has none worse than
    about a 19% fall in the NIFTY 500 (to February 2025). So the dataset this paper
    deserves reaches back to 2008; what is held answers whether the ranking shows an edge
    in this window and nothing about crash protection.
