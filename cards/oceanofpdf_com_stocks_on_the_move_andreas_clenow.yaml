open_questions:
  - question: "Please sign off the split, bonus and demerger event list before the run uses it."
    why_it_matters: "A wrong label hides a real jump (so the 15% rule lets a stock in) or invents one (so a good stock is thrown out). The list has 734 rows, of which 263 are proposed as adjustments (250 split/bonus, 13 demergers) and about 121 need a human look."
    what_i_assumed: "The proposed labels are applied as they stand unless the operator edits corporate_action_events.csv. IRCTC 2021-10-28 was added; TATAMOTORS, SIEMENS, ABFRL and VEDL are DEMERGER at the observed ratio, as asked. ADANIENT 2023-02-01, ZEEL 2024-01-23 and IEX 2025-07-24 stay REAL. ALLCARGO 2024-01-02 and CUPID 2026-03-09 stay REAL pending a check; their volume jump suggests a rescale."
    headline: "Sign off the corporate-action event list (263 proposed adjustments); verify ALLCARGO and CUPID"
    ask_of: researcher
    blocks_run: false
  - question: "Is the convertibility chain needed now, or does the quick-test result decide first?"
    why_it_matters: "A thin chain would look checked and not be."
    what_i_assumed: "Convertibility is deferred until the quick-test result says the mechanism shows up at all, per CLAUDE.md's quick-test default. The data_plan is short and states the shortfalls."
    headline: "convertibility is deferred until the quick test says it is worth the time"
    ask_of: researcher
    blocks_run: false
  - question: "Is a gross-only result acceptable as the headline, given the monthly full reset trades most of the book every month?"
    why_it_matters: "The 30bp round-trip floor would take a visible slice of a high-turnover strategy, and the card no longer shows it."
    what_i_assumed: "Yes, as the operator designed: gross returns plus annual turnover, so a reader can price the cost. Gate B must say the gross result cannot be achieved."
    headline: "Costs are zero by design; gross returns are not achievable"
    ask_of: pm
    blocks_run: false
  - question: "Is the traded-value top 500 an acceptable stand-in for NIFTY 500?"
    why_it_matters: "It may rank stocks the index excludes, and exclude stocks the fund can hold."
    what_i_assumed: "Yes for a first read. No universe-size sensitivity is run."
    headline: "Accept a traded-value top 500 instead of real NIFTY 500 membership?"
    ask_of: pm
    blocks_run: false
  - question: "Is n_configs_tried = 8 honest?"
    why_it_matters: "The deflated Sharpe depends on it."
    what_i_assumed: "8 is a floor taken from the book's own earlier models. This run adds four rebalance-day timings and a 20% jump-limit sensitivity, so the true count is higher; the researcher should raise it before Gate B."
    headline: "n_configs_tried = 8 is a floor; this run's own variants add to it"
    ask_of: researcher
    blocks_run: false

