notes: >
  Quick-test card drafted 2026-10-30 in a Lightyear run (run id 20261030-124039-5511)
  against the three data files: Ace Equity prices (2000-01-03 to 2026-10-26, 4,512
  securities), the NIFTY 500 holdings workbook (55 quarterly snapshots, 2012-03-31 to
  2026-05-31; backtest end limit 2026-09-29) and the NSE index workbook (NIFTY 500 close
  to 2026-09-18). Every number above about the data (458 priced members in the first
  snapshot, 40 unmapped, 38% worst index fall on 2020-03-23, 25% of days below the
  200-day average, 717 Wednesdays in the window) was printed by
  outputs/lightyear/20261030-124039-5511/scratch/inventory_check.py in this session.
  The book's headline figures were read from the rendered table images on pages 115,
  221, 225, 228 and 231, not from extracted text. This card supersedes the 2026-10-16
  card for the same PDF, which ran on NSE bhavcopy with a traded-value top-500 proxy
  universe and the operator's monthly top-20 equal-weight design; that design is
  recorded in open_questions and can be re-run as a sensitivity on request.
  Sensitivities planned at Step 05: Thursday signal day, 20% gap limit, 120-day
  regression window, no index filter. Cost sweep 0 to 100bp. Cash sweep 0, 4, 6, 8%.
  Critique (2026-10-30) folded in: top-20% band is of all ranked members, filters
  after; the Momentum 50 bar needs both return and drawdown; cash swept down to 0%;
  engine works in weights, share counts quoted on unadjusted prices; Momentum 50 is
  marked backfilled wherever it appears.
  REVISION after the operator's Gate A notes (2026-10-30, same run): (1) cash kept as a
  drift only, the book's own drift stays in the headline, no cash target; (2) costs set
  to zero at the operator's instruction, gross equals net, the 30bp house floor shown in
  the appendix sweep; (3) window 2014-01-01 to 2026-09-18 (the operator asked for
  2026-09-30; the house limit is 2026-09-29 and the NIFTY 500 index series ends
  2026-09-18, so the run ends there; first signal 2014-01-07, last 2026-09-15, 629
  signals, 3,147 trading days, 24.6% of days below the 200-day average, worst index fall
  38.3% on 2020-03-23); (4) the 15% gap rule kept as it is; (5) the NIFTY 500 TRI the
  operator named as benchmark is not in the three files (checked 2026-10-30 with
  load_banner_workbook on both sheets of the NSE index workbook), so the NIFTY 500 price
  index stays the benchmark and the TRI is a high-priority data request. The numbers in
  this paragraph were printed by scratch/inventory_check_revision.py and
  scratch/window_stats_revision.py in this run.

data_plan:
  # Designed from the book first (pages 40, 240: membership, delistings, dividends,
  # end-of-day data only), then compared with the three files the fund holds.
  ideal:
    - field: "daily adjusted close per index member, delisted names included, keyed by ISIN"
      granularity: daily
      history_from: "2007-01-01"
      why: "The 90-day regression, the 100-day average and the 15% one-day gap test are all computed on daily closes; a delisted name must be held into its fall, never dropped (page 240)."
      why_granularity: "The book states 'all calculations are done on daily data' (page 98) and that intraday 'won't improve the strategy' (page 240). Weekly bars cannot see a one-day 15% move or form a 90-point regression; intraday prices a decision the rule never makes."
      why_history: "From 2007 so the window holds the 2008 bear market (NIFTY 500 fell more than half) as well as 2020; the book earned most of its edge in two slow bear markets (pages 219 to 221), and a sample with only a three-week crash cannot test that."
      adjustments: "Splits, bonuses, rights and demergers back-adjusted so a mechanical price change never reads as a gap; real shocks kept; ISIN key so a renamed symbol does not splice two companies."
      minimum_viable: true
    - field: "daily adjusted high and low per stock, same adjustment factor as the close"
      granularity: daily
      history_from: "2007-01-01"
      why: "The 20-day average true range that sizes every position needs high, low and previous close (page 88)."
      why_granularity: "ATR is defined on daily bars; a weekly range overstates it and shrinks every position."
      why_history: "Same window as the closes; 20 days of warm-up only."
      adjustments: "Identical back-adjustment to the close so ATR as a share of price is unchanged by corporate actions."
      minimum_viable: true
    - field: "NIFTY 500 index daily close (price index) for the 200-day filter"
      granularity: daily
      history_from: "2006-01-01"
      why: "New buys are gated on the index close against its 200-day simple average (page 99); the book reads the price index, so a price index is the right series for the gate."
      why_granularity: "A 200-day average needs daily closes; the gate is checked weekly but on daily data."
      why_history: "200 trading days before the first signal."
      adjustments: "None; index level as published."
      minimum_viable: true
    - field: "index membership on each day, with the effective date of every addition and removal"
      granularity: daily
      history_from: "2007-01-01"
      why: "Only current members may be bought and a leaver is sold at once (pages 99, 107); the author calls this 'absolutely critical'."
      why_granularity: "NSE changes take effect on a dated day; a quarterly snapshot can be up to three months late on either side of a change."
      why_history: "Same window as the prices."
      adjustments: "Effective dates, not announcement dates; delisted and merged names kept with their ISIN."
      minimum_viable: false
    - field: "cash dividends per stock (or total-return adjustment factors) and the NIFTY 500 Total Return index"
      granularity: daily
      history_from: "2007-01-01"
      why: "The book's strategy and benchmark both include dividends (pages 40, 115); without them both sides are understated."
      why_granularity: "Ex-dates are daily events; monthly factors blur which week a payout fell in."
      why_history: "Same window."
      adjustments: "Total-return factors applied on the ex-date; the TRI as published by NSE."
      minimum_viable: false
    - field: "Indian overnight or 91-day T-bill rate"
      granularity: daily
      history_from: "2007-01-01"
      why: "The book is in cash whenever the index is under its 200-day average, about a quarter of the days in the window; what that cash earns is part of the result."
      why_granularity: "Daily accrual on a daily NAV."
      why_history: "Same window; must cover the 2009, 2020-21 easing cycles and the 2022-23 tightening."
      adjustments: "None."
      minimum_viable: false
    - field: "daily NSE price-band (circuit) status per stock"
      granularity: daily
      history_from: "2007-01-01"
      why: "Buys at the top of a momentum ranking and sells after a sharp fall are the trades most likely to sit at a band where a close-price fill did not exist."
      why_granularity: "Bands are set per stock per day."
      why_history: "Same window."
      adjustments: "None."
      minimum_viable: false
  rejected_alternatives:
    - option: "Weekly bars (the 'lazy solution' the author names on page 245)"
      why_not: "Cannot see a one-day 15% move, gives a 90-week not 90-day regression, and loses the daily NAV the drawdown figures need."
    - option: "Intraday data"
      why_not: "The book trades once a week at a close and says intraday 'won't improve the strategy as such' (page 240); it would price a decision the rule never makes."
    - option: "NIFTY Total Market (750 names) or a top-1,000-by-traded-value universe"
      why_not: "Out of mandate, and it adds microcaps where the 15% rule and the ATR sizing behave least like the book's large-cap calibration; the author's analogue is a 500-name large index."
    - option: "The traded-value top-500 proxy universe used in the 2026-10-16 run of this book"
      why_not: "Real point-in-time NIFTY 500 membership is now held; a universe selected on recent turnover is partly selected on the thing the ranking rewards, which flatters a momentum test."
    - option: "The NSE index workbook alone (index levels, no stocks)"
      why_not: "The rule ranks individual stocks on their own trend; index closes carry none of that."
    - option: "What is held now: Ace prices from 2000, quarterly NIFTY 500 snapshots from 2012-03-31, NIFTY 500 price index"
      why_not: "Not rejected, it is what runs. Its shortcomings: membership is held from 2012 and the operator's window starts 2014, so 2008 is outside it; membership is quarterly, not daily; 34 of 500 names in the 2013-12-31 snapshot cannot be priced; no dividends and no NIFTY 500 TRI; a constant cash rate; no band history. All three minimum-viable fields are in hand; the four that are not change what may be claimed, not whether the mechanism shows up."
  granularity_verdict: "Daily bars are right, as the book itself says: the rule trades weekly but measures gaps, trend, ATR and the index filter on daily data. The binding constraint is history (membership from 2012, so one crash, not two bear markets), not frequency."
  optimality_argument: >
    The claim is that smooth risers among the members of a 500-stock index keep rising for
    weeks, and that stepping aside when the index is under its 200-day average avoids the
    worst of bear markets. Testing it needs daily closes and ranges for every member on
    each day (held, from 2000), the member list on each day (held quarterly from 2012) and
    the index level (held from 1996). Those three are enough to run the book's rules
    exactly; everything else on the list sharpens the reading. Dividends change the level
    of both sides by about the same amount; daily membership and the band history change
    the timing of a minority of trades; a real cash rate changes how much the
    bear-market stretches earn. None of them can turn a mechanism that is absent into
    one that is present. What the held set cannot do is reach 2008, so the one thing the
    book is proudest of, a shallow loss in a long bear market, is tested only on 2020's
    three-week fall. A membership file reaching back to 2007 is the single addition that
    would test a different claim rather than refine this one.
  what_would_change_the_answer: >
    Membership history back to 2007 (adds the 2008 bear market) could change the verdict
    on the filter. Daily membership dates and the ISIN bridge for the 34 early unmapped
    names could move the return by a few tenths of a percent a year and the direction
    is unknown, so they are reported as counts beside the result. Dividends (and the
    NIFTY 500 TRI the operator asked for), the cash rate and band history change what
    may be claimed, not whether the ranking shows an edge. A trading cost above zero
    changes what the fund would keep, which is why the appendix sweep runs to 100bp.

india_notes:
  - category: execution
    item: >
      Momentum leaders on NSE are often at an upper price band (5%, 10% or 20%), where a
      buy at the close may not fill, and a name being sold after a sharp fall may be at a
      lower band. Fills are assumed at the close; the run counts buys on days the stock
      closed up more than 9.5% and sells on days it closed down more than 9.5%.
    why: "The book buys from the top of the ranking at the close (page 99); in India that is exactly where circuit filters bite."
    triggered_by: "buy from the top of the ranking list until you run out of cash (page 99)"
    addresses: ["daily corporate-action-adjusted close per NIFTY 500 member, keyed by ISIN, delisted names included (Ace)"]
    evidence_page: 99
  - category: data
    item: >
      Ace back-adjusts for splits and bonuses, so a split day does not read as a gap.
      Demergers and rights issues may be adjusted differently or not at all, and a large
      unadjusted ex-date move will count as a 15% gap and disqualify the name for 90
      days. The run lists every disqualifying move above 15% with the ratio of adjusted
      to unadjusted close around it so a human can spot corporate actions among them.
    why: "The 15% rule is only the book's rule if real shocks are kept and mechanical price changes are removed."
    triggered_by: "disqualify any stock with a move larger than 15% in the past 90 days (page 82)"
    addresses: ["daily adjusted high and low per stock, same adjustment, for the 20-day average true range (Ace)"]
    evidence_page: 82
  - category: validity
    item: >
      NIFTY 500 is a large, mid AND small cap index (50 / 50 / 100 / 150 / 250 split in
      the workbook), whereas the S&P 500 is large cap only. The author expects smaller
      caps to show more momentum (pages 232, 233), but the 15% rule and ATR sizing will
      remove or shrink exactly those names, so the realised portfolio is likely to be
      tilted to large and mid caps. The run reports the cap-segment mix of holdings by
      year using the workbook's sub-index flags.
    why: "A result driven by a small-cap tilt and one driven by the ranking are different claims; the sub-index flags make them separable."
    triggered_by: "the choice of index will over time have quite a large effect (page 232)"
    addresses: ["point-in-time NIFTY 500 membership on each signal date (holdings workbook, quarterly snapshots)"]
    evidence_page: 232
  - category: timing
    item: >
      The NIFTY 500 index series in the workbook ends 2026-09-18, eleven days before the
      membership-driven house limit of 2026-09-29, so the run ends 2026-09-18. The
      200-day filter is read on the price index, which publishes after the close, so a
      Tuesday-close signal is actionable only on Wednesday: lag_days is 1.
    why: "A filter read on a same-day index close that is not yet published is look-ahead."
    triggered_by: "check index filter: above its 200 day moving average (page 99)"
    addresses: ["NIFTY 500 index daily close for the 200-day filter and as the benchmark (NSE index workbook)"]
    evidence_page: 99
  - category: cost
    item: >
      The book's weekly exit check, bi-weekly resize and buy-until-cash refill trade
      often, frequently in mid and small caps with wide spreads and sometimes on band
      days. The headline charges nothing, at the operator's instruction (2026-10-30).
      The house floor of 30 basis points a round trip is itself a floor, not an
      estimate, for a name at a circuit. The run reports annual turnover and sweeps the
      cost from 0 to 100bp in the appendix so the zero-cost headline and the 30bp
      reading sit on the same page.
    why: "India's round trip is several times a US large cap's, and this strategy's edge in the book is modest once the filter is removed (9.1% a year, Table 14-44); a zero-cost headline on a weekly strategy must be read with the sweep beside it."
    triggered_by: "rebalance portfolio every Wednesday; rebalance positions every second Wednesday (page 99)"
    addresses: ["daily corporate-action-adjusted close per NIFTY 500 member, keyed by ISIN, delisted names included (Ace)"]
    evidence_page: 99
