card_version: "1.0"

# Quick-test card (CLAUDE.md default, 2026-10-06): the book's own construction,
# translated to India. Drafted 2026-10-30 against the three data files
# (Ace Equity prices, NIFTY 500 holdings workbook, NSE index workbook).
# convertibility is deliberately omitted until a result earns it (data_plan is written
# because Gate A's own check blocks without one).
#
# REVISED 2026-10-30 after the operator's Gate A notes (Lightyear run 20261030-124039-5511):
#   1. cash: kept as a drift only (the book's own cash drift stays in the headline);
#   2. costs: zero basis points at the operator's instruction (house floor is 30bp; the
#      appendix cost sweep still shows 0 to 100bp);
#   3. window: 2014-01-01 to 2026-09-30 asked; the run ends 2026-09-18 because the NIFTY 500
#      index series that drives the 200-day gate and the benchmark ends there, and the house
#      limit is 2026-09-29 in any case;
#   4. the 15% gap rule kept as it is;
#   5. benchmark asked: NIFTY 500 TRI. NOT in the three data files (checked 2026-10-30:
#      the NSE index workbook holds the NIFTY 500 price index only). The benchmark used is
#      the NIFTY 500 price index, which matches the strategy's own price-return basis; the
#      TRI is a high-priority data request.
#
# REVISED AGAIN 2026-10-30 (operator's second ruling, recorded as a Gate A revision in Lightyear):
#   6. mandate: "my allow_cash: true note meant the mandate allows cash for this test", so
#      portfolio.mandate_allow_cash is now true and Gate B's "implementable within mandate" is
#      judged with cash allowed. Nothing else in the construction changed.
# Quant AI Researcher by Harshil Pahuja

paper:
  id: oceanofpdf_com_stocks_on_the_move_andreas_clenow
  title: "Stocks on the Move: Beating the Market with Hedge Fund Momentum Strategies"
  authors: [Andreas F. Clenow]
  date: "2015-01-01"
  source_file: docs/papers/oceanofpdf_com_stocks_on_the_move_andreas_clenow.pdf
  source_sha256: "c59a35cc7bee73d8b1eda36f61d70679bf4773f3f1f9ac4469e68660b031ecd3"

intent:
  mode: adaptation
  parent_card: ""
  rationale: >
    The book gives one complete rule set for owning stocks that are going up: every
    week, rank all index members by how steeply and how smoothly they have climbed
    over 90 trading days, keep only names in the top fifth that sit above their 100-day
    average and have not jumped more than 15% in a day, size each so it moves the book
    about 0.1% a day, and stop buying new names while the index is below its 200-day
    average. Clenow reports 12.3% a year against 5.2% for the S&P 500 total return
    index over 1999 to 2014, with a worst fall of 24% against 55% (Table 12-10, page
    115). This card runs those exact rules on NIFTY 500 members from January 2014 to
    September 2026 (the operator's window), with real point-in-time membership, no
    trading costs (the operator's instruction of 2026-10-30; a 0 to 100 basis point cost
    sweep sits in the appendix), and price returns on both sides because the price file
    carries no dividends. It is a first read: does the book's mechanism show up in
    India at all, and does the index filter do the same job here that it did in the
    US? The book's numbers are US, include dividends and exclude costs; they are
    context, never a target.
  transferred_mechanism: >
    Signals are computed at the Tuesday close and traded at the Wednesday close (the
    repo's one-day lag applied to the book's Wednesday rule). Universe: NIFTY 500
    members as of the latest quarterly snapshot on or before the signal date. Score
    every member with 100 trading days of its own history: fit a straight line to the
    log of its adjusted close over the last 90 trading days, annualise the slope as
    exp(slope)^250 - 1, and multiply by the R-squared of the same fit. Disqualify any
    name below its 100-day simple moving average or with a one-day close-to-close move
    above 15% in the last 90 trading days. Each week sell any holding that is outside
    the top 20% of scored members, disqualified, or no longer a member. Then, only if
    the NIFTY 500 index close is above its 200-day simple moving average, buy down the
    ranking, skipping disqualified and held names, until the cash is spent; each new
    position is sized at shares = NAV x 0.001 / ATR20. Every second Wednesday, reset
    every holding to its target size if the difference exceeds 5%. Cash is only ever a
    drift: what the sizing leaves unspent and what the index filter keeps out of the
    market; it earns a flat 6%. No trading cost is charged, at the operator's
    instruction, so gross equals net in the headline; a 0 to 100 basis point cost sweep
    is reported in the appendix.
  broken_assumptions:
    - >
      PRICE RETURN, NOT TOTAL RETURN. The book includes cash dividends on the strategy
      and compares with the S&P 500 Total Return index (pages 40, 115). The Ace file has
      no dividends, so both the strategy and the NIFTY 500 benchmark are price return;
      the comparison is fair but each side is understated by roughly its dividend yield.
    - >
      MEMBERSHIP IS QUARTERLY, NOT DAILY. The book knows index membership on every day
      (page 107). The holdings workbook gives quarter-end snapshots from 2012-03-31, so a
      joiner becomes eligible at the first snapshot that lists it and a leaver is sold at
      the first snapshot that omits it, up to three months after the actual change.
    - >
      THE EARLY UNIVERSE IS THINNER ON LATER FAILURES. In the 2013-12-31 snapshot, the
      first one this run uses, 34 of 500 names have no ISIN in the price file (21 by
      end-2014, 9 by end-2017, 2 by 2021). Those are mostly companies that later
      delisted, so the 2014 to 2017 universe under-represents names that went bad. The
      bias runs in the strategy's favour and is stated as a gap.
    - >
      INDIAN STOCKS GAP MORE. The 15% one-day rule was set for S&P 500 large caps. NIFTY
      500 holds about 250 small caps that move 15% in a day far more often, and NSE price
      bands (5%, 10%, 20%) sit exactly where momentum leaders trade. The rule will
      disqualify a larger share of the ranking here and tilt the book to large and mid
      caps. That is the book's rule doing its job in a different market, not an error, and
      the run reports how many names it removes each week.
    - >
      THE RISK FACTOR WAS SET FOR US VOLATILITY. With 10 basis points per name the author
      holds 20 to 30 stocks (page 230). Indian names have a larger average true range as a
      share of price, so the same factor gives smaller weights and a broader book; the run
      reports the name count and the cash share rather than retuning the factor.
    - >
      COSTS. The book states none (pages 43, 48, 93), and at the operator's instruction
      (2026-10-30) this card charges none either, so the headline is gross and gross
      equals net. The house floor for an Indian round trip is 30 basis points and this
      strategy trades weekly, so the appendix sweeps the cost from 0 to 100 basis points
      and reports the round-trip cost at which the edge over NIFTY 500 reaches zero. A
      reader must take the headline as the book's basis, not as what the fund would keep.
    - >
      TWELVE AND THREE-QUARTER YEARS, NOT SIXTEEN, AND ONE CRASH, NOT TWO. The window
      2014-01 to 2026-09 contains the 2020 COVID fall (NIFTY 500 down 38.3% to 2020-03-23),
      the 2015-16 (20.8%), 2018 (15.8%), 2022 (18.5%) and 2024-25 (18.8%) corrections, but
      no multi-year bear market like 2000-2003 or 2008, which is where the book's filter
      earned most of its edge.

universe:
  description: >
    NIFTY 500 constituents, point in time, from the fund's holdings workbook: quarterly
    snapshots from 2012-03-31, a name being a member from the first snapshot that lists
    it to the first that does not, delisted names kept and keyed by ISIN. Prices and
    daily high, low and close from the Ace Equity file, back-adjusted for splits and
    bonuses, joined to membership on ISIN. In mandate, so a result is actionable.
    Benchmark: the operator asked for the NIFTY 500 Total Return index (TRI). It is not
    in the three data files (checked 2026-10-30), so the NIFTY 500 price index is the
    benchmark; the strategy is price return too, so the two sides are on one basis.
  asset_class: equity
  geography: IN
  assets:
    - nifty_500_constituent_prices
  benchmark: NIFTY 500
  cash_asset: CASH_PROXY_CONSTANT_6PCT

universe_translation:
  source_universe: "S&P 500 constituents on each day, with historical membership and delisted stocks, January 1999 to December 2014"
  source_breadth: 500
  source_selection_rule: >
    Rank every current member on the 90-day score; hold only names in the top 20% of
    the ranking (the top 100 of 500), above their 100-day average and without a one-day
    move above 15% in the past 90 days; open new positions only while the S&P 500 is
    above its 200-day average, buying down the ranking until the cash is spent (pages
    98, 99, 110, 111).
  target_universe: "NIFTY 500 constituents"
  grade: close
  resolution: direct
  rationale: >
    The book's rules are written for a 500-stock index and its key cut, the top 20%, is
    100 names. NIFTY 500 is the only in-mandate Indian universe of that breadth, it is
    the fund's own benchmark, and real point-in-time membership is held, so the
    index-member constraint the author calls 'absolutely critical' (page 107) is applied
    as written rather than proxied. The code ranks NIFTY 500 first for a 500-name,
    cross-sectional, broad-market mechanism. NIFTY 500 reaches further down the cap
    ladder than the S&P 500 does in the US, which the author expects to help momentum
    (pages 232, 233) but which makes the 15% gap rule and the ATR sizing bite differently.
  transfer_risks:
    - "NSE price bands and frequent 15%-plus days in mid and small caps: the gap rule disqualifies far more of the ranking than in the S&P 500, and limit-up days cluster at the top of a momentum list."
    - "Quarterly membership snapshots, not daily: joiners enter late, leavers are sold up to a quarter late."
    - "34 of 500 names in the 2013-12-31 snapshot (the first this run uses) cannot be priced (no ISIN bridge); they are mostly later delistings, so the early universe is thinner on failures."
    - "No dividends in the price file: both sides are price return; the book's are total return, and the NIFTY 500 TRI the operator asked for as benchmark is not held."
    - "The 10-basis-point risk factor was tuned to US volatility; Indian ATR as a share of price is higher, so the book will hold more names with more cash than the author's 20 to 30."
    - "The NIFTY 500 index closed below its 200-day average on 24.6% of trading days between 2014-01-01 and 2026-09-18, so the cash drift is a live part of the test; cash earns a declared constant, not a market rate."
    - "No trading cost is charged (operator's instruction); a weekly strategy with zero cost overstates what the fund would keep, which is why the appendix cost sweep exists."
  mechanism_needs:
    needs_cross_section: true
    min_names: 500
    cap_segment: large_mid
    sector: null
    min_history_years: 10.0
    must_be_in_mandate: false
    notes: >
      The book's hold band is the top 20% of a 500-stock index, which it equates to the
      top 100 (pages 95, 110). A thinner index gives a thinner candidate pool for 20 to 30
      positions after the two stock filters. Ten years so that at least one real bear
      market falls inside the sample; the operator's window is 12.7 years (2014-01-01 to
      2026-09-18) with one 38% fall.
  alternatives_considered:
    - "NIFTY Total Market constituents (750 names, OUT OF MANDATE; ranked second by the code)"
    - "NIFTY LargeMidcap 250 constituents (250 names, in mandate; ranked third)"
    - "NIFTY MidSmallcap 400 constituents (400 names, in mandate; ranked fourth)"
  why_not_alternatives: >
    Total Market adds 250 microcaps where the 15% rule and the ATR sizing behave even
    more differently from the book, and a result there could not be held by the fund.
    LargeMidcap 250 gives a top 20% of only 50 names to fill 20 to 30 positions after
    the filters. MidSmallcap 400 drops the large caps the S&P 500 analogue is made of.
    NIFTY 500 is the one universe that is both the right breadth and the fund's own
    benchmark, with real membership held.
  required_instruments:
    - nifty_500_constituent_prices
    - ACE_EQUITY_STOCK_PRICES
    - nifty_500_membership_history
    - NIFTY 500
    - CASH_PROXY_CONSTANT_6PCT
  evidence_page: 98

strategy:
  signal_name: volatility_adjusted_momentum_regression_slope_x_r2
  signal_definition: >
    For every current NIFTY 500 member with at least 100 trading days of its own
    adjusted-close history, fit an ordinary least squares line to the natural log of the
    daily adjusted close against the day number over the last 90 trading days ending at
    the signal close. Annualise the daily slope as exp(slope) to the power 250, minus 1
    (page 77). Multiply by the R-squared of the same 90-day fit. Sort every scored member
    on that product; rank 1 is the highest, ties broken by ISIN. A name is disqualified,
    for buying and for holding, if its adjusted close is below its 100-day simple moving
    average (page 81) or if any one-day close-to-close move in the last 90 trading days
    exceeded 15% in either direction, measured on adjusted closes (page 82). The index
    gate reads the NIFTY 500 index close against the simple average of its last 200
    closes (page 99).
  inputs_required:
    - "daily corporate-action-adjusted close per NIFTY 500 member, keyed by ISIN, delisted names included (Ace)"
    - "daily adjusted high and low per stock, same adjustment, for the 20-day average true range (Ace)"
    - "point-in-time NIFTY 500 membership on each signal date (holdings workbook, quarterly snapshots)"
    - "NIFTY 500 index daily close for the 200-day filter and as the benchmark (NSE index workbook)"
  cross_sectional: true
  formation_rule: >
    Every Tuesday close is a signal date (the previous trading day if Tuesday is a
    holiday); trades fill at the following trading day's close, normally Wednesday.
    Ranks are assigned to every member with enough history BEFORE any filter, so the
    top 20% is a cut of the whole index, not of the names that pass the filters (the
    book ranks all, then disqualifies, pages 98, 99). Step 1, sells: sell any holding
    whose rank is outside the top 20% of all ranked members, that is below its 100-day
    average, that had a one-day move above 15% in the last 90
    trading days, or that is no longer a NIFTY 500 member at the latest snapshot. A
    holding that stops trading (suspension, delisting) is sold at its last available
    close on the day that is learned and the proceeds sit in cash. Step 2, resize: on
    every second signal date, recompute each remaining holding's target shares as
    NAV x 0.001 / ATR20 and trade to target if the share difference exceeds 5% (pages
    99, 246). Step 3, buys: only if the NIFTY 500 index close on the signal date is
    above its 200-day simple moving average, walk down the ranking from rank 1, skip
    names that are held or disqualified, and buy each at NAV x 0.001 / ATR20 shares
    until the next position would cost more than the cash available; stop there. If the
    index is below its average, buy nothing and hold the cash; when it crosses back
    above, refill from the top of the list the same way (page 111). On the first signal
    date, Tuesday 2014-01-07 (fills Wednesday 2014-01-08), the initial book is built by
    Step 3 alone. No trades on any other day.
  weighting_rule: >
    Shares per position = NAV x 0.001 / ATR20, where ATR20 is the simple 20-day average
    of the true range (the largest of high minus low, high minus previous close, and
    previous close minus low) on adjusted prices (pages 88, 98). As a weight that is
    0.001 / (ATR20 / price): a stock whose daily range is 2% of its price gets 5%, a 4%
    stock gets 2.5%. Weights are never scaled to sum to one; the book buys down the list
    until the cash is spent and leaves the remainder in cash (pages 80, 88, 230). Whole
    shares, starting value Rs 10 crore. No position cap beyond the formula and no
    sector cap (page 80). The engine works in weights: ATR20 and price are both Ace
    back-adjusted series, so their ratio is right while an adjusted share count is not;
    share counts and fills quoted to a human use the unadjusted close of the day.
  holding_period: "Open-ended: held until the weekly exit test fails (rank outside top 20%, below 100-day average, a 15% gap, or left the index)"
  rebalance_frequency: "weekly portfolio check (Tuesday signal, Wednesday fill); position-size reset every second week"
  is_long_short: false
  long_only_adaptation: ""
  constraints:
    - "long only, unlevered, no stop losses (page 94)"
    - "only current NIFTY 500 members may be bought; a holding that leaves the index is sold at the first snapshot that omits it (pages 40, 99)"
    - "new buys only while the NIFTY 500 index close is above its 200-day simple moving average; sells are always allowed (pages 96, 99)"
    - "positions sized at a 10-basis-point risk factor over ATR20; cash is a drift only (unspent sizing and the index filter), never a target allocation, and earns the declared 6% (pages 88, 98; operator's note 2026-10-30)"
    - "signals at Tuesday close, fills at Wednesday close: lag_days is 1"
    - "zero trading cost at the operator's instruction (2026-10-30), so gross equals net; the appendix sweeps 0 to 100 basis points a round trip because the house floor is 30bp"
    - "a stock needs 100 trading days of its own history to be scored"
  engine_template: "universal_backtester:atr_risk_parity"
  template_gap: >
    universal_backtester's atr_risk_parity allocator is the book's sizing exactly
    (weight = risk_factor / (ATR / price), leftover cash kept, never renormalised) but
    it selects a fixed top-k or top quantile at each rebalance. The book keeps a holding
    while it stays in the top 20%, buys new names from the top only to fill the cash
    freed by sells, gates buys on the index 200-day average, and applies the 100-day and
    15% filters to holds as well as buys. Those pieces are plain code in
    scripts/oceanofpdf_com_stocks_on_the_move_andreas_clenow_india_backtest.py, built
    with the new-paper-backtest skill at Step 05 (ace.panel for close/high/low,
    nifty500.membership_panel for eligibility, the index workbook for the gate). No new
    ros/engine template is needed and ros/engine is not used.
  confidence: high
  evidence_pages: [40, 73, 77, 80, 81, 82, 88, 95, 96, 98, 99, 107, 110, 111, 115, 221, 225, 230, 245, 246]

signal:
  name: volatility_adjusted_momentum_regression_slope_x_r2
  template: "universal_backtester:atr_risk_parity"
  lookback_days: 90
  lag_days: 1
  description: >
    lookback_days is the 90-day regression window. Other windows: 100 days (stock trend
    filter), 90 days (gap look-back), 20 days (ATR), 200 days (index filter). lag_days is
    1: the ranking, filters and index gate use data up to the Tuesday close and trades
    fill at the Wednesday close. Long-only; runs through universal_backtester, never
    through ros/engine.
  params:
    regression_days: 90
    annualise_power: 250
    stock_trend_days: 100
    gap_limit: 0.15
    gap_days: 90
    atr_days: 20
    risk_factor: 0.001
    hold_band_quantile: 0.20
    index_filter_days: 200
    index_filter_series: "NIFTY 500"
    resize_every_n_signals: 2
    resize_tolerance: 0.05
    min_history_days: 100
    whole_shares: true
    start_capital_inr: 100000000
    signal_weekday: "Tuesday"
    fill_weekday: "Wednesday"

portfolio:
  rebalance: weekly
  long_only: true
  max_gross: 1.0
  allow_cash: true
  mandate_allow_cash: true   # operator's ruling 2026-10-30: the mandate allows cash for this test
  start: "2014-01-01"
  end: "2026-09-18"

costs:
  # ZERO at the operator's instruction (Gate A note, 2026-10-30: "we do not assume any BPS
  # cost, keep it as 0"). The book states no costs either. The house floor for an Indian
  # round trip is 30bp; the appendix cost sweep (0 to 100bp) shows what that floor would
  # take from the result, so both readings are on the page.
  spread_bps: 0.0
  cost_model: half_spread

data_requirements:
  - {name: nifty_500_constituent_prices, kind: price, frequency: daily, start: "2013-07-01", mandatory: true, evidence_page: 98, purpose: "adjusted daily close of every NIFTY 500 member, delisted names included, keyed by ISIN; the mid-2013 start supplies the 100-day warm-up before the first signal on 2014-01-07"}
  - {name: ACE_EQUITY_STOCK_PRICES, kind: price, frequency: daily, start: "2013-07-01", mandatory: true, evidence_page: 88, purpose: "adjusted daily high and low per stock for the 20-day average true range that sizes every position"}
  - {name: nifty_500_membership_history, kind: membership, frequency: quarterly, start: "2013-12-31", mandatory: true, evidence_page: 107, purpose: "which names may be bought on each signal date and which holdings must be sold because they left the index; the 2013-12-31 snapshot (466 priced of 500) is the first one used"}
  - {name: "NIFTY 500", kind: price, frequency: daily, start: "2013-03-01", mandatory: true, evidence_page: 99, purpose: "the 200-day moving-average gate on new buys (200 closes before 2014-01-07 are held from 2013-03-12) and the headline benchmark, as a PRICE index: the NIFTY 500 TRI the operator asked for is not in the three files; the workbook's last NIFTY 500 close, 2026-09-18, sets the end of the run"}
  - {name: CASH_PROXY_CONSTANT_6PCT, kind: risk_free_rate, frequency: daily, mandatory: true, evidence_page: 96, purpose: "the book holds cash by design (unspent sizing and the whole book under a bear filter); cash earns the declared constant, swept 4 to 8%"}

ambiguities:
  - field: strategy.signal_definition
    headline: "How a 15% 'gap' is measured is not stated; close-to-close on adjusted prices is used"
    issue: "The book says 'any move larger than 15% in the past 90 days' and 'gap' interchangeably (pages 82, 104) without saying close to close, open against prior close, or intraday."
    resolution: "Close-to-close, up or down, on Ace's adjusted closes, over the same 90 trading days as the regression. A real demerger that Ace leaves unadjusted will read as a gap and disqualify the name; a 20% limit is the one sensitivity on this rule."
    confidence: low
    material: true
    evidence_page: 82
  - field: strategy.formation_rule
    headline: "Execution price not stated; signals at Tuesday close, fills at Wednesday close"
    issue: "The book calculates all analytics 'at the end of the day and then we take action based on it' (page 245) and trades on Wednesdays (page 98). Whether the trade is at that close or the next is not said."
    resolution: "Signals use data to the Tuesday close; every trade fills at the Wednesday close. This keeps the book's 'trade on Wednesday' and the repo's one-day lag. The same rule is also run with the signal on Thursday close and fill on Friday close as a timing-luck check."
    confidence: medium
    material: true
    evidence_page: 245
  - field: costs.spread_bps
    headline: "The book states no costs; none charged at the operator's instruction (30bp floor in appendix)"
    issue: "No commission, spread or slippage treatment is given for the main strategy. The earlier chapter 4 models exclude commissions (pages 43, 48) and the resize frequency is justified by costs (page 93), so the headline is best read as gross. The repo's own floor for an Indian round trip is 30 basis points."
    resolution: "Zero basis points, per the operator's Gate A note of 2026-10-30 ('we do not assume any BPS cost, keep it as 0'). The headline is therefore gross, and gross equals net. The appendix sweeps the round-trip cost from 0 to 100 basis points and reports the cost at which the edge over NIFTY 500 reaches zero, so the 30bp house floor is visible on the same page as the headline."
    confidence: high
    material: true
    evidence_page: 43
  - field: universe.description
    headline: "Operator asked for NIFTY 500 TRI as benchmark; it is not held, so both sides are price return"
    issue: "The simulation includes cash dividends and the benchmark is the S&P 500 Total Return index (pages 40, 115). The operator's note names the NIFTY 500 Total Return index as the benchmark. The NSE index workbook holds the NIFTY 500 price index only (checked 2026-10-30, no sheet carries a TRI column) and the Ace file carries no dividends."
    resolution: "Benchmark is the NIFTY 500 price index. The strategy is price return as well, so the comparison is on one basis; a TRI benchmark against a price-return strategy would understate the strategy by its dividend yield. Each side is understated by roughly its own dividend yield; a high-momentum book tends to hold lower-yield names, so the understatement is probably smaller for the strategy than for the index. The TRI is a high-priority data request; if it is supplied under data/raw/MANIFEST.yaml it becomes the benchmark and a dividend series for the stocks is needed to keep the two sides on one basis."
    confidence: high
    material: true
    evidence_page: 115
  - field: universe_translation.target_universe
    headline: "Membership is quarterly, not daily: joiners enter late, leavers are sold up to a quarter late"
    issue: "The book checks membership every day and sells a leaver immediately (pages 99, 107). The holdings workbook gives quarter-end snapshots."
    resolution: "A name is eligible from the first snapshot that lists it; a holding is sold at the first snapshot that omits it, at that day's close. A name that stops trading before the snapshot is sold at its last available close. The run reports how many sells were forced by membership."
    confidence: medium
    material: true
    evidence_page: 107
  - field: strategy.formation_rule
    headline: "'Top 20%' and 'top 100' are the same cut for 500 names; top 20% of scored members is used"
    issue: "The exit rule is stated as the top 20% of the index (pages 95, 99) and as rank 100 or better (pages 110, 246). NIFTY 500 has 466 to 504 priced members in the snapshots this run uses."
    resolution: "Top 20% of the members scored on that signal date, rounded down, so the cut scales with the number of priced names."
    confidence: high
    material: false
    evidence_page: 110
  - field: strategy.weighting_rule
    headline: "ATR formula and 5% resize tolerance read from prose; standard true range and 5% band used"
    issue: "The book describes the true range in words as 'the maximum of the day's high to low or move from previous day' with a 20-day average (page 88) and suggests, without requiring, a 5% difference filter on resizes (page 246)."
    resolution: "True range = max(high - low, |high - previous close|, |previous close - low|) on adjusted prices, simple 20-day mean. A resize trades only if the share difference exceeds 5%. Neither choice moves the ranking; both move turnover and therefore the net result slightly."
    confidence: medium
    material: false
    evidence_page: 88
  - field: strategy.weighting_rule
    headline: "10bp risk factor kept although Indian volatility is higher; name count and cash share are reported"
    issue: "The author chose 10 basis points to land at 20 to 30 names in US large caps (page 230) and shows 5bp and 50bp variants (Table 14-48). Indian NIFTY 500 names have a higher ATR as a share of price, so the same factor gives more, smaller positions."
    resolution: "Kept at 0.001 as the book's construction. The run reports the weekly name count, the average and maximum cash share, and the weight range; no risk-factor variant is run in the quick test."
    confidence: high
    material: false
    evidence_page: 230
  - field: strategy.signal_definition
    headline: "Minimum history for a new listing is not stated; 100 trading days of own history is required"
    issue: "The book does not say what happens to a stock with fewer than 90 days of prices (a recent listing that joins the index)."
    resolution: "A name needs 100 trading days of its own adjusted closes to be scored, which also covers the 100-day average; until then it is neither bought nor counted in the top-20% denominator."
    confidence: medium
    material: false
    evidence_page: 73
  - field: portfolio.allow_cash
    headline: "Cash kept as a drift only, and the mandate allows cash for this test (operator rulings, 2026-10-30)"
    issue: "Cash is the book's main defence (pages 96, 111, 219 to 221), and sizing leftovers also sit in cash. The fund's standing mandate is fully invested, so this run holds cash the fund could not under it. The operator's Gate A note rules: 'keep the cash as a drift only'; a second ruling the same day says that note meant the mandate allows cash for this test."
    resolution: "Cash arises only as a drift, from unspent sizing and from the index filter holding buys back; there is no cash target and no separate cash sleeve, and the headline keeps the book's drift exactly as the book runs it. portfolio.mandate_allow_cash is true, so Gate B's 'implementable within mandate' is judged with cash allowed. Cash earns the declared 6%, swept 0, 4, 6 and 8% (0% bounds how much of the result is the rate rather than the stocks; the book never says what its cash earned). The average and maximum cash share, and the share of total return earned by cash, are reported so the PM can see how much of any result is the filter rather than the stocks. The no-filter variant (the book's own Table 14-44) stays a sensitivity in the appendix."
    confidence: high
    material: true
    evidence_page: 96

replication_targets: []

benchmark_templates:
  - {name: "Equal-weight, all current NIFTY 500 members, monthly (appendix)", template: equal_weight, params: {}, rebalance: monthly}
  - {name: "Inverse-volatility weight, all current NIFTY 500 members, monthly (appendix; the book's Table 14-45)", template: inverse_vol, params: {lookback_days: 20}, rebalance: monthly}

selection:
  rule: >
    Universe = NIFTY 500 members at the latest quarterly snapshot on or before the
    signal date, keyed by ISIN, with 100 trading days of adjusted-close history. On each
    Tuesday close score every such name by the annualised 90-day log-price regression
    slope (exp(slope)^250 - 1) times the R-squared of the same fit. Disqualify names
    below their 100-day simple average or with a one-day move above 15% in the last 90
    trading days. Hold names while they stay in the top 20% of scored members and pass
    both filters; buy from the top of the list, while the NIFTY 500 index is above its
    200-day average, until the cash is spent. No explicit securities are named; the rule
    is re-derived from the three data files every week.
  explicit_securities: []
  verified_against: ""
  as_of: ""
  why_these: >
    The rule is the whole decision; naming stocks would be naming a snapshot of a list
    that changes every week.

backtest_plan:
  sample_start: "2014-01-01"
  sample_end: "2026-09-18"
  why_this_window: >
    The operator set the window at Gate A (2026-10-30): 1 January 2014 to 30 September
    2026. The start is honoured exactly: 2014-01-01 was an NSE trading day, the first
    Tuesday signal is 2014-01-07 and the first fills are on Wednesday 2014-01-08, using
    the 2013-12-31 membership snapshot (466 of 500 names priced, every one of them with
    at least 100 closes before the first signal). Stock-level warm-up (100 trading days)
    and the index 200-day average are read from Ace and workbook history before
    2014-01-01, which both files have (200 NIFTY 500 closes back to 2013-03-12). The end
    cannot be 2026-09-30: the house limit for any backtest is 2026-09-29, the day before
    the NSE review effective 2026-09-30 that the holdings file has not seen, and the
    NIFTY 500 index series in the workbook ends 2026-09-18, which is the last day the
    200-day gate can be read and the last day strategy and benchmark can be compared.
    The run therefore ends 2026-09-18, eight trading days short of the operator's date;
    the last signal is Tuesday 2026-09-15. Between the two dates there are 629 Tuesday
    signals and 3,147 trading days. The window holds the 2015-16 (20.8%), 2018 (15.8%),
    2020 (38.3% to 2020-03-23), 2022 (18.5%) and 2024-25 (18.8%) index falls. It holds
    no multi-year bear market, which is where the book's filter earned most of its edge.
    Membership is held from 2012-03-31, so the 2012-2013 stretch is available if the
    operator wants it back; it was dropped at the operator's instruction, not for lack
    of data.
  warmup_days: 200
  why_warmup: >
    200 trading days of NIFTY 500 index closes for the index filter and 100 trading days
    of each stock's own closes for the regression, the 100-day average and the 90-day
    gap look-back (20 for ATR sits inside). All of it comes from history before
    2014-01-01, so the track record starts on the operator's start date.
  rebalance_rule: >
    Weekly. Signal at the Tuesday close (previous trading day if a holiday), fills at
    the next trading day's close. Sells first, then on every second signal date the
    resize to target with a 5% tolerance, then buys from the top of the ranking while the
    index is above its 200-day average until the cash is spent. No trades on other days.
  weights_rule: >
    Shares = NAV x 0.001 / ATR20 per position, whole shares, start Rs 10 crore; weights
    are not normalised, leftover cash is a drift that stays in cash at 6%. Gross never
    above 1.0.
  explicit_weights: {}
  benchmarks:
    - name: "NIFTY 500 (price index)"
      why_this: "The fund benchmark and the do-nothing option; price return, like the strategy. The only comparator in the headline charts. The operator asked for the NIFTY 500 TRI; it is not in the three data files, and a TRI against a price-return strategy would be a mismatched comparison, so the price index stands until a TRI and a dividend series are supplied together."
    - name: "NIFTY500 MOMENTUM 50 (price index, appendix, the one extra sleeve)"
      why_this: "The off-the-shelf product that would replace this strategy for zero research effort: NSE's own momentum index on the same universe. Its history is backfilled before launch (rules chosen with hindsight), so beating it is weak evidence and losing to it is strong; marked backfilled on every chart and table, price return, appendix only."
    - name: "Inverse-volatility weight, all current NIFTY 500 members, monthly (appendix)"
      why_this: "The book's own 'risk parity index' (Table 14-45, page 223): every member weighted by inverse volatility, no ranking, no filter. Shows how much of any result is the sizing rule alone."
    - name: "Equal-weight, all current NIFTY 500 members, monthly (appendix)"
      why_this: "Owning the whole universe at equal weight shows how much of any result is the small-cap tilt of equal weighting rather than the ranking and the filter."
    - name: "Same rules without the 200-day index filter (appendix)"
      why_this: "The book's own ablation (Table 14-44): separates what the stock ranking buys from what the cash drift buys. The operator ruled (2026-10-30) that the mandate allows the cash for this test; this variant still shows what a fully invested book would have done."
  must_beat:
    - "NIFTY 500 price index on annualised return, at zero trading cost (gross equals net), with a smaller maximum drawdown over 2014-01 to 2026-09"
    - "the monthly equal-weight basket of all current NIFTY 500 members, at the same zero cost, on annualised return (so the ranking adds something beyond owning the universe equal-weighted)"
    - "NIFTY500 MOMENTUM 50 price index (backfilled) on BOTH annualised return and maximum drawdown: return at least equal and drawdown no larger (the off-the-shelf alternative)"
  success_looks_like: >
    At zero trading cost, the strategy returns more than the NIFTY 500 price index over
    2014-01-01 to 2026-09-18 with a smaller maximum drawdown, and also beats the monthly
    equal-weight basket of all members. The 2020 drawdown is visibly shallower than the
    index's 38% because the filter took the book to cash. The result keeps its sign when
    the signal day is moved from Tuesday to Thursday, with a 20% gap limit instead of 15%
    (the rule itself stays at 15%), and with a 120-day regression window (the book's
    Table 14-46). In the appendix cost sweep the edge over NIFTY 500 survives at least
    the 30 basis point house floor and ideally 50. Gaps of a couple of percent a year are
    noise over 12.7 years with one crash.
  failure_looks_like: >
    Any of: no edge over the NIFTY 500 price index at zero cost; no edge over the
    equal-weight member basket (the ranking selects nothing beyond owning the universe);
    the index filter costs more in missed rallies than it saves in 2020 so the no-filter
    variant beats the filtered one on both return and drawdown; the result changes sign
    when the signal day moves or when the gap limit is 20%; the 15% rule leaves fewer
    than 20 eligible names in a large share of weeks; or the appendix cost sweep shows
    the edge over NIFTY 500 gone at or below the 30 basis point house floor, which would
    mean the zero-cost headline is an artefact of the cost assumption. A good result over
    2014 to 2026 with one crash says little about a 2000-2003-style bear market and
    nothing the fund's standing fully-invested mandate could hold while the book is in cash
    (the operator allowed that cash for this test on 2026-10-30).
  known_failure_modes:
    - "CASH IN THE BOOK: the filter puts the book partly or wholly in cash about a quarter of the time (24.6% of days in the window). Kept as a drift only at the operator's instruction, and the operator ruled (2026-10-30) that the mandate allows this cash for the test; under the fund's standing fully-invested mandate the no-filter variant is the holdable version."
    - "ZERO COST ON A WEEKLY STRATEGY: at the operator's instruction no cost is charged; weekly exits, bi-weekly resizes and buy-until-cash refills trade a large part of the book, so the headline overstates what the fund would keep; the appendix sweep (0 to 100bp, house floor 30bp) is the honest companion."
    - "THE 15% RULE IN A GAPPY MARKET: NSE mid and small caps move 15% often, so the rule may thin the eligible list sharply and tilt the book to large caps; a demerger Ace leaves unadjusted reads as a gap. Kept as it is at the operator's instruction."
    - "PRICE BANDS: names at the top of a momentum list are often at an upper circuit where a buy may not fill at the close; fills are assumed at the close."
    - "QUARTERLY MEMBERSHIP: a leaver is sold up to a quarter late and a joiner enters late; the early universe is missing 34 unmapped (mostly later-delisted) names in the 2013-12-31 snapshot."
    - "BENCHMARK BASIS: the operator asked for NIFTY 500 TRI; it is not held, so the price index is used, and the run ends 2026-09-18 where that series ends rather than on the operator's 2026-09-30."
    - "ONE CRASH IN THE WINDOW: 2020 was a three-week fall and a fast recovery; a 200-day filter is designed for slow bear markets and can lose on both legs of a V."
    - "PRICE RETURN ONLY on both sides; the book's figures include dividends."
    - "CASH RATE IS A CONSTANT: 6% swept 4 to 8%; every cash-heavy stretch is rate-dependent."

data_requests:
  - item: "NIFTY 500 membership changes with their effective dates between the quarterly snapshots (the NSE semi-annual review lists plus ad-hoc replacements), 2012 to date"
    why: "The book sells a leaver the day it leaves and only buys current members (pages 99, 107); quarterly snapshots sell leavers up to a quarter late and admit joiners late."
    unlocks: "The index-member constraint applied as the book applies it, and a clean count of membership-forced sells."
    without_it: "Quarterly snapshots stand in: a holding is sold at the first snapshot that omits it, which lets a demoted name be held for up to three months after the index dropped it. The direction of the bias is unknown (demoted names are usually weak, but a momentum book rarely holds them), so the run reports the number and return of those late sells."
    priority: high
    satisfies: ["point-in-time NIFTY 500 membership on each signal date (holdings workbook, quarterly snapshots)"]
    headline: "Membership between quarterly snapshots: leavers sold up to a quarter late"
    format_hint: "effective_date, isin, action (add/remove), source review"
  - item: "ISIN mapping for the 34 names in the 2013-12-31 snapshot (21 by end-2014, 9 by end-2017, 2 by 2021) that the price file cannot bridge"
    why: "They are mostly companies that later delisted; without them the early universe is thinner on exactly the names a long-only momentum book can be caught holding into a collapse."
    unlocks: "A 2014 to 2017 universe that is the real index, not the index minus its failures."
    without_it: "The unmapped names are excluded from ranking and from the equal-weight basket for those snapshots. The bias flatters the strategy and the basket by an unknown amount; the run reports the unmapped count per snapshot alongside the results."
    priority: high
    satisfies: ["daily corporate-action-adjusted close per NIFTY 500 member, keyed by ISIN, delisted names included (Ace)"]
    headline: "34 of 500 names in the 2013-12-31 snapshot cannot be priced; mostly later delistings"
    format_hint: "symbol or company name as in the holdings workbook, isin, accord code if known"
  - item: "The NIFTY 500 Total Return index (daily close, 2013 to date) and dividend-adjusted (total return) stock prices or a per-stock dividend series"
    why: "The operator named the NIFTY 500 TRI as the benchmark (Gate A note, 2026-10-30) and the book's strategy and benchmark both include dividends (pages 40, 115); the three files held are price only, and no sheet of the NSE index workbook carries a TRI column."
    unlocks: "The benchmark the operator asked for, on the same basis as the book. The stock-level dividends are needed alongside it: a TRI benchmark against a price-return strategy would understate the strategy by its own dividend yield."
    without_it: "Both sides are price return, so the comparison stays fair; each side is understated by roughly its dividend yield and the gap between them is probably small, because momentum books hold lower-yield names. This changes what may be claimed and the benchmark label, not whether the mechanism shows up. Declared in data/raw/MANIFEST.yaml when supplied; the run does not fetch anything."
    priority: high
    satisfies: ["NIFTY 500 index daily close for the 200-day filter and as the benchmark (NSE index workbook)"]
    headline: "NIFTY 500 TRI (the operator's benchmark) is not held; price index used on both sides"
    format_hint: "date, NIFTY 500 TRI close; date, isin, dividend per share with ex-date (or dividend-adjusted close)"
  - item: "Daily NSE price-band (circuit limit) history per stock"
    why: "Momentum leaders sit at upper bands; a buy at the Wednesday close may not have filled, and a sell on a name at a lower band may not either."
    unlocks: "Fills modelled as not happening on band days, carried to the next trading day."
    without_it: "Fills are assumed at the close. The 15% gap rule already removes most names that just hit a 20% band, and the run reports how many buys were made on a day the stock closed up more than 9.5% (a proxy for a band day)."
    priority: nice_to_have
    satisfies: ["daily corporate-action-adjusted close per NIFTY 500 member, keyed by ISIN, delisted names included (Ace)"]
    headline: "No price-band history: fills assumed at the close on circuit days"
    format_hint: "date, isin, band percent, hit_upper, hit_lower"

open_questions:
  - question: "The 2026-10-16 run of this same book used the operator's simplified design (monthly, top 20 equal-weight at 5%, no index filter, no costs) on bhavcopy data. This card runs the book's own rules on the three current files. The operator's 2026-10-30 notes set the cash, cost, window, gap rule and benchmark for the book's rules without asking for the monthly design back; is that read right?"
    why_it_matters: "The two designs answer different questions: the book's rules test the mechanism as published (including the cash drift the fund cannot hold); the monthly top-20 tests a holdable simplification of the ranking alone."
    what_i_assumed: "The book's own construction, per CLAUDE.md's 'one card, the paper's own construction, translated to India', with the operator's five notes applied to it. The no-filter variant in the appendix is the nearest holdable version. The monthly top-20 equal-weight design can be added as a named sensitivity at Step 05 if the PM asks."
    headline: "Book's own rules with the operator's 2026-10-30 settings; the monthly top-20 design stays optional"
    ask_of: pm
    blocks_run: false
  - question: "The operator asked for the NIFTY 500 TRI as the benchmark. It is not in the three data files (the NSE index workbook holds the NIFTY 500 price index only). Is the price index on both sides acceptable until a TRI and a stock dividend series are supplied?"
    why_it_matters: "A benchmark the run cannot read is not a benchmark. The price index is the consistent choice for a price-return strategy; a TRI alone would hand the index roughly 1.2 to 1.5% a year of dividends the strategy is not credited with."
    what_i_assumed: "NIFTY 500 price index on both sides, labelled as such on every chart and table; the TRI is a high-priority data request. The run does not fetch anything. If the TRI is supplied without stock dividends, it is shown as a second line in the appendix with the basis mismatch stated, not as the headline."
    headline: "NIFTY 500 TRI benchmark asked for but not held; price index used, TRI requested"
    ask_of: pm
    blocks_run: false
  - question: "The operator's end date is 30 September 2026. The house limit is 2026-09-29 (NSE review effective 2026-09-30 not yet in the holdings file) and the NIFTY 500 index series ends 2026-09-18, so the run ends 2026-09-18. Is that acceptable, or should the index workbook be refreshed first?"
    why_it_matters: "Without the index close the 200-day gate cannot be read and the benchmark cannot be compared, so running past 2026-09-18 would mean inventing the gate. Eight trading days are lost; the last signal is 2026-09-15."
    what_i_assumed: "End 2026-09-18, stated on every output. A refreshed NSE index workbook through 2026-09-29 and a 2026-09-30 post-review constituent list under data/raw/nifty500_updates/ would let the run reach the house limit; the run never fetches either."
    headline: "Run ends 2026-09-18 (index series end), not the operator's 2026-09-30"
    ask_of: pm
    blocks_run: false
  - question: "Costs are zero at the operator's instruction. CLAUDE.md's floor for an Indian round trip is 30 basis points and this strategy trades weekly. Is the zero-cost headline, with the 30bp reading in the appendix sweep, the presentation wanted?"
    why_it_matters: "A weekly strategy at zero cost can show an edge that a 30bp round trip removes; the two readings can disagree in sign. Showing both keeps the headline honest about what it is."
    what_i_assumed: "Headline at zero cost (gross equals net), as instructed. The appendix sweeps 0, 10, 20, 30, 50, 75 and 100bp and reports the breakeven cost; failure_looks_like names the 30bp floor so the bar is set before the numbers."
    headline: "Zero cost at the operator's instruction; the 30bp house floor is shown in the appendix sweep"
    ask_of: pm
    blocks_run: false
  - question: "Is n_configs_tried = 9 honest for the deflated Sharpe?"
    why_it_matters: "The deflated Sharpe depends on it. The book reports the base rules plus eight variants on the same sample (Tables 14-44, 14-46, 14-47, 14-48). This run adds a Thursday signal day, a 20% gap limit, a 120-day window and the no-filter ablation."
    what_i_assumed: "9 for the paper's own trials. The run's four sensitivities are counted on top at Step 06 (13 in total) before any deflated Sharpe is reported."
    headline: "n_configs_tried = 9 from the book; this run's four variants are added at Step 06"
    ask_of: researcher
    blocks_run: false
  - question: "The convertibility chain is deferred (the data_plan is written, because Gate A's own check blocks without one): is a quick-test result the right trigger for writing the chain?"
    why_it_matters: "A thin chain written now would look checked and not be. Its weakest link is already visible: the cash the mechanism needs and the fund's standing mandate forbids (allowed for this test by the operator's ruling of 2026-10-30), followed by costs at weekly turnover."
    what_i_assumed: "Deferred until the quick test says the mechanism shows up net; if it does, the convertibility section is written before Gate B with the cash question as its weakest link."
    headline: "Convertibility deferred until the quick test says it is worth it; data_plan written"
    ask_of: researcher
    blocks_run: false
  - question: "Should the 20% top band be re-based on the number of priced members or fixed at 100 names?"
    why_it_matters: "With 466 priced names at the first signal the top 20% is 93, not 100; a fixed 100 is a slightly looser hold band early on."
    what_i_assumed: "Top 20% of scored members on the day, rounded down, as the book's primary statement (pages 95, 99); 'top 100' is its 500-name special case."
    headline: "Hold band is top 20% of priced members (93 to 100 names), not a fixed 100"
    ask_of: researcher
    blocks_run: false

