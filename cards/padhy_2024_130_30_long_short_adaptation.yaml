signal:
  name: padhy2024_momentum_proxy_longonly
  template: cross_sectional
  lookback_days: 126
  lag_days: 1
  description: >
    Cross-sectional top-40%-quantile long-only selection on a 126-trading-day (~6-month)
    trailing total-return momentum proxy, equal-weighted, across the paper's own 30 named
    Sensex constituents. Momentum is the closest primitive this fund's audited engine can
    compute (ros.engine.primitives.total_return_momentum) to the paper's own 4-metric
    risk-adjusted composite rank -- see strategy.signal_definition and ambiguities for what
    is NOT captured by this substitution.
  params:
    quantile: 0.4
    weighting: equal
    ascending: false
    min_names: 8
    alpha_source: momentum
    alpha_window: 126
    alpha_skip: 0

portfolio:
  rebalance: quarterly
  long_only: true
  max_gross: 1.0
  allow_cash: true
  mandate_allow_cash: false      # fund is long-only and fully invested
  target_vol: null               # cross_sectional does not vol-target; equal weighting only
  start: "2019-04-01"    # the paper's own sample start (p.212)
  end: "2024-09-30"      # the paper's own sample end (p.212)

costs:
  spread_bps: 30.0
  cost_model: half_spread

data_plan:
  ideal:
    - field: "Daily adjusted close, the paper's 30 named Sensex constituents (Appendix 1)"
      granularity: daily
      history_from: "2018-10-01"
      why: >
        Forms the trailing 126-day momentum proxy score for each stock every rebalance, and
        the raw return that both the long-only cohort and every benchmark are measured on.
      why_granularity: >
        Daily is necessary: the paper's own Tracking Error is explicitly a function of DAILY
        return dispersion (p.212), and this card's momentum proxy is likewise a compounded
        daily-return statistic. Anything coarser collapses exactly the dispersion term the
        paper's metrics exist to measure. Intraday is not needed -- both the paper's own
        construction and this card's signal operate on a ~6-month formation/hold cycle with no
        finer timing decision.
      why_history: >
        2018-10 gives a full 126-trading-day warmup before the sample's first tradable date
        (2019-04-01, matching the paper's own start, p.212), so the first live rebalance is not
        trading on a partially-formed signal.
      adjustments: >
        Split/bonus/dividend-adjusted close (total-return-equivalent), point-in-time -- NOT
        today's restated series, since a name's later corporate actions must not leak into a
        2019-era formation window.
      minimum_viable: true
    - field: "Benchmark daily close (NIFTY 50 and/or BSE SENSEX)"
      granularity: daily
      history_from: "2018-10-01"
      why: >
        The do-nothing benchmark this strategy must beat, and (if the literal 4-metric
        composite is ever built) the series every stock's Tracking Error, Information Ratio
        and beta are computed against.
      why_granularity: "Daily, matching the constituent series."
      why_history: "Same warmup logic as the constituent series."
      adjustments: >
        Price-return index level (the paper's own Tracking Error/IR use price returns, not
        total-return-index levels, p.212) -- flagged since an official TRI series would give a
        subtly different Tracking Error than the price index the paper actually used.
      minimum_viable: true
    - field: "Indian risk-free rate, 6-monthly basis"
      granularity: daily
      history_from: "2018-10-01"
      why: "Risk-free leg of the paper's own Sharpe and Treynor classification metrics (p.212); not consumed by this card's momentum-only signal."
      why_granularity: >
        Daily/continuous is preferred so this card can resample onto a different rebalance
        cadence (quarterly, see backtest_plan) than the paper's own strict 6-monthly cycle
        without losing resolution.
      why_history: "Same window as the constituent series."
      adjustments: >
        The paper collects a government BOND PRICE series and does not explain how it becomes
        a period return (Stage 01 extraction concern) -- a rate/yield series is requested
        directly rather than a price series needing an unstated conversion.
      minimum_viable: false
  rejected_alternatives:
    - option: "Substitute the fund's held NIFTY500 factor-sleeve indices for the 30 named stocks"
      why_not: >
        Collapses the cross-sectional stock-selection mechanism entirely into an index-timing
        bet between a handful of pre-built baskets -- a fundamentally different,
        much lower-resolution strategy that cannot express "pick better stocks than average
        within a mega-cap panel." An earlier draft of this card made exactly this substitution;
        it was a weaker test than necessary and is not repeated here.
    - option: "Weekly or monthly close instead of daily"
      why_not: >
        Tracking Error is defined by the paper as the standard deviation of DAILY return
        differences (p.212); weekly/monthly data cannot reconstruct it, only a coarser and
        non-comparable approximation.
    - option: "Widen immediately to the full ~50-name NIFTY 50 panel, named from the model's own recollection"
      why_not: >
        No verified, checkable source for a historical point-in-time NIFTY 50 membership list
        was available in this session; naming 50 tickers from memory is exactly the "plausible,
        unverifiable list" this fund's card discipline forbids. The paper's own page-cited
        30-name Appendix 1 list is used instead; widening is offered as a data_request.
    - option: "Intraday/tick data"
      why_not: >
        Every metric in the paper's mechanism (HPR, Tracking Error, IR, Sharpe, Treynor) is a
        daily-close, 6-month-window statistic; intraday data would price a decision -- entry/
        exit timing within a day -- that this strategy never makes.
  granularity_verdict: >
    Daily adjusted close is both necessary and sufficient: every one of the paper's four
    classification metrics is explicitly a function of DAILY return dispersion or compounding
    over a ~6-month window (p.212), so daily is the floor; nothing in the mechanism uses
    intraday information, so daily is also the ceiling worth paying for.
  optimality_argument: >
    This is the dataset the paper's OWN mechanism specifies, not a substitute chosen for
    convenience: 30 individually-named, page-cited (Appendix 1, p.216-217) mega-cap Indian
    equities, their benchmark, and a risk-free series, all at daily granularity, covering the
    paper's own 2019-04-01 to 2024-09-30 window plus a 6-month warmup. The only departure from
    a literal replication is trading NSE-listed prices for these same 30 companies rather than
    their BSE/Sensex listings (near-identical for dual-listed large caps, and consistent with
    this fund's NSE-sourced infrastructure and NIFTY 500 mandate benchmark) -- the mechanism,
    breadth and metrics are otherwise unchanged. A coarser-granularity or sleeve-index
    substitute would test a different, lower-resolution question; finer granularity would
    price a decision (intraday timing) the strategy does not make.
  what_would_change_the_answer: >
    The stock-level price data and benchmark series determine whether the classification and
    its return are correct at all -- without them there is no answer, only a proxy on unrelated
    sleeve indices. The risk-free series only sharpens which periods the paper's own
    Sharpe/Treynor legs would tilt toward long vs short (not consumed by this card's actual
    momentum signal); the fund's constant-proxy fallback (swept 4-8%) changes the claim's
    precision about rate-sensitivity but is very unlikely to flip a momentum-driven headline
    verdict.

