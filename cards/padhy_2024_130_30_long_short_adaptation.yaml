card_version: "1.0"

paper:
  id: padhy_2024_130_30_long_short_adaptation
  title: "Analyzing the 130/30 Long-Short Strategy in Indian Stocks: A Comparative Study Using Sensex 30 and Benchmark Returns"
  authors: [Amit Bathia, Charith Pechetti, Ananya Gupta, Nandip Vaidya, Jagabandhu Padhy]
  date: null   # masthead gives only "Vol 14, Issue 4 (2024)" -- no month/day is stated
  source_file: docs/papers/padhy_2024_130_30_long_short.pdf
  source_sha256: b218437b552240da94b038467a410075b39c97cce9bac15bbbf58a7fda7184a6
  url: null

intent:
  mode: adaptation
  parent_card: null
  rationale: >
    The paper classifies 30 individual Sensex stocks every 6 months on four metrics computed
    against the Sensex benchmark (Tracking Error, Information Ratio, Sharpe Ratio, Treynor
    Ratio -- p.212), goes 130% long the top-40%-by-metric cohort and 30% short the bottom
    cohort, holds for the subsequent 6 months, and compares to holding the Sensex. This card
    supersedes an earlier transcript-based draft of the same paper (no sha256 lineage, no
    universe_translation/strategy sections) now that the actual PDF is on disk. It states the
    best achievable long-only test of the idea using this fund's audited engine, run on the
    paper's own 30 named companies (Appendix 1, p.216-217) -- a documented, page-verifiable
    list -- rather than a sleeve-index substitute or a separately-recalled NIFTY 50 panel.
  transferred_mechanism: >
    Long-only cross-sectional selection (cross_sectional template): rank the universe every
    ~6 months on a trailing momentum proxy and hold only the top 40% cohort, equal-weighted.
    This reuses the paper's own ALLOCATION SHAPE (score, sort, hold the top quantile) but not
    its SCORE -- no primitive in this fund's engine computes the paper's own 4-metric
    risk-adjusted composite (Tracking Error / Information Ratio / Sharpe / Treynor vs Sensex),
    so total_return_momentum stands in for it. See ambiguities and notes for the new-primitive
    specification that would be needed to test the paper's actual scoring mechanism.
  broken_assumptions:
    - >
      SHORT LEG IS THE PAPER, NOT A DETAIL: the paper's title, null hypothesis, and every
      reported number describe the COMBINED 130% long / 30% short book; no long-only-only
      variant is reported anywhere to benchmark against. This fund's long-only mandate is a
      business/legal constraint, not a data or engine gap -- no data procurement fixes it.
      Dropping the short leg does not leave a smaller version of the same claim; it removes
      the paper's central mechanism. The paper's own worked tables show the short leg was
      profitable and additive in most windows where it existed (e.g. 2019-20 Oct-Mar: short
      leg's covered-short amount of Rs 19,900.8 against Rs 30,000 borrowed implies a ~Rs 10,099
      short-leg gain on top of the long leg's ~Rs 63,310 gain, Fig 3 p.213) -- dropping it is
      not a haircut. This card's result, whatever it is, is not evidence about whether the
      paper's own 130/30 strategy works.
    - >
      LEVERAGE: the paper's long leg is 130% gross, funded by the 30% short. This fund uses no
      leverage, so the long-only adaptation is scaled to 100% notional, not 130%. Both the short
      leg and the leverage it funded are dropped together.
    - >
      RANKING MECHANISM: the paper ranks stocks on four separate benchmark-relative metrics
      (Tracking Error, Information Ratio, Sharpe Ratio, Treynor Ratio vs. Sensex) with NO
      stated rule for combining them when a stock lands in different cohorts on different
      metrics (Stage 01 analysis, extraction_concerns -- the paper itself is under-specified
      here). None of this fund's registered primitives compute a multi-metric cross-sectional
      score; total_return_momentum is used instead inside the cross_sectional allocator -- a
      materially cruder idea ("has this stock gone up") than the paper's own ("has this stock
      beaten the benchmark on a risk-adjusted basis"). This card's result is not evidence about
      the paper's specific stock-picking claim.
    - >
      REBALANCE CADENCE: the paper's design is a strict 6-month formation-then-hold cycle
      (11 non-overlapping periods). This fund's schema (ros/cards/schema.py REBALANCE) has no
      semi-annual option; "quarterly" is used as the nearest supported cadence on the same
      126-trading-day trailing window, trading roughly twice as often as the paper's own design.
    - >
      COST TREATMENT: the paper charges a blended 110 bps (26 bps transaction + 84 bps
      short-selling cost, long+short book only; 26 bps alone on the Sensex leg). This fund's
      standing 30 bps round-trip policy is applied instead, per fund-wide practice -- not a
      deviation from the paper's number, since that number prices a short leg this card no
      longer has.
    - >
      STRATEGY IS OFTEN UN-IMPLEMENTABLE IN THE SOURCE: the paper's own criteria produced zero
      qualifying stocks in one leg for 4 of its 10 half-year windows (an author-acknowledged
      limitation, p.216). The cross_sectional template's response to a too-thin cross-section
      is to hold the PREVIOUS rebalance's weights (min_names skip), a different mechanism from
      the paper's own "skip the period entirely."
    - >
      UNIVERSE WIDTH: the paper sorts exactly 30 names into 40% cohorts (~12 each). Stage 01
      graded "NIFTY 50 constituents" (score 55.0) as the best-fitting catalogued universe class
      for this mechanism (mega-cap, cross-sectional, in-mandate) over NIFTY 100 (53.0, large is
      only adjacent to mega) -- but this card runs on the paper's OWN verified 30-name list
      rather than a separately-sourced 50-name NIFTY 50 panel, for reasons given in `selection`
      and `open_questions` below. Widening to the full NIFTY 50 panel is offered as a
      data_request, not silently substituted.
    - >
      POINT-IN-TIME / SURVIVORSHIP: the paper's own Appendix 1 list (p.216-217) is presumably
      its SAMPLE-START-DATE Sensex-30 membership; whatever data is supplied at Gate A must
      reflect the constituents named there, not today's Sensex-30 (some names have since been
      swapped). Whoever supplies the data should confirm this.

universe_translation:
  source_universe: "BSE SENSEX 30 constituents"
  source_breadth: 30
  source_selection_rule: >
    Fixed membership: the 30 companies constituting the BSE Sensex at time of study -- a
    free-float market-cap-weighted index of India's largest, most liquid listed companies
    across key sectors. No further selection rule is applied beyond "the 30 stocks of the
    Sensex" (p.210, p.212). Full list in Appendix 1, p.216-217.
  target_universe: "NIFTY 50 constituents"
  grade: close
  resolution: needs_data
  rationale: >
    ros.data.universes scores NIFTY 50 highest (55.0) against mechanism_needs(min_names=30,
    cap_segment='mega', needs_cross_section=True, must_be_in_mandate=True, min_history_years=5.5
    -- the paper's own sample length, p.212) -- ahead of NIFTY 100 (53.0, large is only
    adjacent to mega) and NIFTY Next 50 (43.0, large not mega). Verified the score is unchanged
    (55.0) whether min_history_years is passed as the paper's actual 5.5 years or the library's
    10.0-year default, since NIFTY 50/100/Next 50 all comfortably clear either threshold. Sensex
    30 is a mega-cap concentration, not merely "large"; NIFTY 50 is the catalogued universe
    matching that tier, sits inside the fund's own NIFTY-family holdings (NSE/NIFTY-sourced,
    not BSE), and is squarely in mandate. The vast majority of Sensex-30 constituents are
    themselves NIFTY-50 constituents, so this is closer to testing near-the-same companies than
    a cross-index translation. Alternative considered and rejected: replicate on the literal 30
    Sensex names via their NSE-listed prices (near-identical to BSE prices for dual-listed large
    caps) -- this is in fact what this card OPERATIONALLY does (see `selection`), since the
    paper's own 30-name list is verifiable (page-cited) while a separately-sourced full 50-name
    NIFTY 50 panel is not, absent a supplied membership file.
  transfer_risks:
    - >
      NIFTY 50 and BSE Sensex 30 are highly overlapping but not identical constituent sets
      (different index committees and review cadence) -- some names in the paper's actual
      30-stock sample may be absent from a NIFTY 50 panel, and vice versa. This card sidesteps
      that specific risk by running on the paper's own 30 names directly rather than a full
      NIFTY 50 panel, but the classification RESULT (which stocks are "long" vs "short") would
      differ from the paper's own tables regardless, per the ranking-mechanism substitution.
    - >
      The paper sorts only 30 names into 40% cohorts (~12 names each); a wider NIFTY 50 panel
      (~20-name cohorts) was considered and rejected as the primary universe specifically to
      avoid guessing membership -- see open_questions for the tradeoff this leaves on the table.
    - >
      Sensex is BSE-listed; this fund is NSE-sourced. The 30 named companies' NSE-listed prices
      are assumed near-identical to their BSE prices (true for all of them, being large,
      liquid, dual-listed names) but this has not been independently verified series-by-series.
  required_instruments:
    - "daily adjusted close, the paper's 30 named Sensex constituents (with membership history)"
    - "benchmark daily close (NIFTY 50 and/or BSE SENSEX)"
    - "Indian risk-free rate proxy, 6-monthly basis"
  evidence_page: 212
  mechanism_needs:
    needs_cross_section: true
    min_names: 30
    cap_segment: mega
    sector: null
    min_history_years: 5.5
    must_be_in_mandate: true
    notes: >
      Paper's own construction ranks exactly 30 names into 40% cohorts; NIFTY 50 (mega-cap,
      ~50 names, in mandate) is the best-fitting catalogued analogue class per
      ros.data.universes, even though this card operationalizes selection on the paper's own
      30-name list rather than the full 50-name panel (see selection.why_these).
  alternatives_considered:
    - "NIFTY 100 constituents (score 53.0) -- large is only adjacent to the paper's mega segment"
    - "NIFTY Next 50 constituents (score 43.0) -- large, not mega"
    - "Full NIFTY 50 panel with membership named from the model's own recollection -- rejected as an unverifiable guess (see selection)"
  why_not_alternatives: >
    NIFTY 100/Next 50 dilute the mega-cap concentration the paper specifically studies. A
    full, separately-sourced NIFTY 50 panel would be the more statistically powered choice,
    but naming ~50 tickers from memory is exactly the "plausible, unverifiable list" this
    fund's card discipline forbids -- so the paper's own page-cited 30-name list is used
    instead, and widening to a verified NIFTY 50 panel is offered as a data_request.

strategy:
  signal_name: "Cross-sectional momentum proxy for a 4-metric composite rank vs Sensex (long-only top-40% cohort)"
  signal_definition: >
    THE PAPER'S OWN MECHANISM: over each 6-month formation window, compute four
    backward-looking, benchmark-relative metrics per stock: (1) Tracking Error = stdev(daily
    stock return - daily benchmark return); (2) Information Ratio = Active Return / Tracking
    Error, Active Return = avg(daily stock return) - avg(daily benchmark return); (3) Sharpe
    Ratio (paper's own construction) = (6-month stock return - 6-month risk-free return) /
    stdev(daily stock returns over the window); (4) Treynor Ratio = (6-month stock return -
    6-month risk-free return) / beta, beta = cov(benchmark, stock) / var(benchmark). LONG
    candidates: bottom 40% by Tracking Error AND top 40% by each of the other three. SHORT
    candidates: the mirror image. THE PAPER STATES NO RULE for a stock landing "long" on some
    metrics and "short" on others (p.212-216) -- logged as an unresolved Ambiguity.
    THIS CARD'S ACTUAL SIGNAL (substitute, see ambiguities): 126-trading-day trailing
    total-return momentum per stock (ros.engine.primitives.total_return_momentum), ranked
    cross-sectionally, top 40% held long and equal-weighted. This captures the paper's
    ALLOCATION SHAPE (score, sort, hold the top quantile) but not its SCORE.
  inputs_required:
    - "daily adjusted close per stock"
    - "benchmark daily close (for Tracking Error / Information Ratio / beta, if the literal metrics are ever built)"
    - "6-monthly risk-free return (paper collects a government bond PRICE series; conversion to a period return is unstated, p.212)"
  cross_sectional: true
  formation_rule: >
    Paper: top-40%/bottom-40% cut on each of 4 metrics over the trailing 6-month formation
    window; a leg with zero qualifying names in a period is simply not traded (occurred in 4
    of the paper's 10 half-year windows, p.216). This card: top 40% quantile cut on trailing
    126-day momentum, cross_sectional template's min_names floor holds prior weights instead
    of skipping outright when the cross-section is too thin.
  weighting_rule: >
    Paper: equal-weighted within each cohort; long book Rs 130,000 notional (130%), short book
    Rs 30,000 notional (30%, negative sign, short-financed) -- worked tables (Fig 3, p.213)
    show Rs 130,000 is what is actually used despite the prose stating Rs 100,000. This card:
    equal-weighted within the held quantile, scaled to 100% notional, no leverage, no short.
  holding_period: "Paper: 6 months, non-overlapping. This card: ~1 quarter between rebalances, on a 126-day trailing window (see ambiguities -- no semi-annual rebalance option exists)."
  rebalance_frequency: quarterly
  is_long_short: true
  long_only_adaptation: >
    Drop the short (30%) leg and the 130% gross leverage entirely; hold only the long cohort,
    equal-weighted, scaled to 100% notional. This is a DIFFERENT strategy from the paper's
    130/30 book, not a haircut of it: the paper's own worked tables show the short leg was
    profitable and additive in most windows where it existed (e.g. 2019-20 Oct-Mar: ~Rs 10,099
    short-leg gain on top of the long leg's ~Rs 63,310 gain, Fig 3 p.213). A long-only version
    must be scored only against Sensex/NIFTY, never against the paper's own stated 130/30
    returns.
  constraints:
    - long_only
    - "no leverage -- the paper's 130% gross long is itself a form of leverage and is dropped alongside the short leg"
    - "lag_days >= 1 per the fund's NSE-close-publication rule"
    - "30bp round-trip India factor-sleeve cost floor applies; the paper's own blended 110bp figure is not carried over"
  engine_template: cross_sectional
  template_gap: >
    The ALLOCATOR shape (rank a cross-section, hold the top quantile, long-only) is covered by
    the registered `cross_sectional` template. What is NOT covered: no registered primitive
    computes the paper's own 4-metric risk-adjusted composite score (Tracking Error /
    Information Ratio / Sharpe / Treynor vs benchmark, combined by an unstated rule). A human
    would need to add a new alpha_source branch to ros/engine/prepare.py (or a new primitive in
    ros/engine/primitives.py) that computes this composite and resolves the four-metric
    combination rule the paper itself never states, before this card could test the paper's
    actual mechanism rather than a momentum proxy for it.
  confidence: medium
  evidence_pages: [210, 212, 213, 214, 215, 216]

