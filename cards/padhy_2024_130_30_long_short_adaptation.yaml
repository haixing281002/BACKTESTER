ambiguities:
  - field: backtest_plan.sample_end
    issue: >
      The paper contradicts itself on its own sample end: the abstract states data runs
      "from April 2019 to March 2024" (p.210), but the Methodology section states data was
      "collected from April 1, 2019, to September 30, 2024" (p.212), and Figure 7's own worked
      table has an evaluation period running into "2024-25 April-September" -- which requires
      price data through September 2024, matching the methodology and contradicting the
      abstract.
    resolution: >
      Use 2024-09-30. The methodology text and Figure 7's own worked table are direct,
      internally-consistent evidence of what was actually analysed; the abstract's "March 2024"
      is very likely a stale draft artifact that was not updated when the sample was extended.
    confidence: medium
    material: true
    evidence_page: 210

  - field: signal.template
    issue: >
      No registered primitive computes the paper's own multi-metric (Tracking Error /
      Information Ratio / Sharpe / Treynor) cross-sectional score, and the paper gives no rule
      for combining the four metrics when they disagree on a stock.
    resolution: >
      Use the cross_sectional allocator (correct SHAPE: rank, sort, hold top quantile,
      long-only) with total_return_momentum as the SCORE (best available primitive proxy).
      See strategy.template_gap for the new-primitive specification that would be needed to
      test the paper's actual scoring mechanism -- that is a human build decision, not
      something resolved here.
    confidence: high
    material: true
    evidence_page: 212

  - field: portfolio.rebalance
    issue: >
      The paper's design is a strict, non-overlapping 6-month formation/hold cycle. This
      fund's schema has no semi-annual rebalance option.
    resolution: >
      Use quarterly (the nearest supported cadence) on the same 126-day lookback. Report
      turnover explicitly since this trades roughly 2x as often as the paper's own cycle.
    confidence: medium
    material: true
    evidence_page: 212

  - field: portfolio.allow_cash
    issue: >
      The cross_sectional template holds the PREVIOUS rebalance's weights when fewer than
      min_names qualify, rather than moving to cash or skipping the period. The paper's own
      analogous case (zero qualifying stocks) is handled differently -- it simply skips the
      period and reports no result for that leg.
    resolution: >
      Report rebalances_skipped_thin_universe (the template's own diagnostic) alongside
      results so a human can see how often this differs from the paper's own "not
      implementable" periods. mandate_allow_cash: false is still honoured since holding prior
      weights is not the same as holding cash.
    confidence: high
    material: true
    evidence_page: 216

  - field: metrics.sharpe_convention
    issue: >
      ros/validation/metrics.py implements a geometric and a conventional Sharpe; this card
      states neither. The paper's OWN Sharpe/Treynor definitions (6-monthly return over
      Excel-computed stdev) are classification inputs, not comparable to either fund
      convention.
    resolution: >
      Report both sharpe_geometric and sharpe_conventional. Never compare either to the
      paper's own per-period Sharpe/Treynor numbers -- different metric, different basis.
    confidence: high
    material: true
    evidence_page: 212

  - field: n_configs_tried
    issue: >
      The paper gives a rationale for its 40/40 split but does not admit searching over
      alternatives, nor any other explicit hyperparameter sweep.
    resolution: >
      Carry n_configs_tried=1 as the literal count of what the paper admits, hedged as a
      floor rather than a ceiling.
    confidence: low
    material: false
    evidence_page: 212

