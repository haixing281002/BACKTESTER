open_questions:
  - question: >
      The paper's own abstract states its purpose is "to provide a comparative analysis of the
      130/30 strategy and pair trading strategy" (p.211) -- but no pair-trading methodology,
      table, or result appears anywhere in the paper's body (Methodology, Data Analysis,
      Conclusion or Appendix all cover only the 130/30 strategy). Was a pair-trading variant
      genuinely run by the authors (just not included in what was extracted here, or dropped
      before publication), and if so, should this fund's n_configs_tried treat it as a second
      configuration the authors tried on this same idea?
    why_it_matters: >
      If a pair-trading variant was in fact tried, the paper's true trial count for "a
      market-neutral-style strategy in Indian equities" could be 2, not 1 -- understating the
      trial budget for the deflated Sharpe is exactly the failure mode n_configs_tried exists
      to prevent, and this card cannot resolve it from the pages available.
    what_i_assumed: >
      Carried n_configs_tried=1, treating the abstract's pair-trading reference as either a
      strategy that was never actually run to completion or one that is out of scope for this
      card (a different mechanism, not a parameter sweep of the 130/30 idea). A human with
      access to a fuller version of the paper, or the authors' own working files, should
      confirm this before the deflated Sharpe is finalised at Stage 06.
    ask_of: researcher
    blocks_run: false
    evidence_page: 210

  - question: >
      Should this card run on the paper's own verified 30-name list (thinner cohorts, fully
      page-checkable) or widen immediately to the full ~50-name NIFTY 50 panel Stage 01 graded
      as the best-fitting universe class (broader cohorts, but requires either a supplied
      membership file or naming constituents from memory)?
    why_it_matters: >
      A 30-name universe produces ~12-name cohorts that can shrink to nothing during
      membership churn or data gaps (the paper's own construction hit this in 4 of 10 windows);
      a 50-name panel is more resilient but was not available as a verified list in this
      session.
    what_i_assumed: >
      Assumed the paper's own 30-name list for THIS run, since it is verifiable against the
      text (page 216-217) and avoids guessing NIFTY 50 membership from memory. Widening to the
      full panel is recorded above as a nice_to_have data_request, not silently substituted.
    ask_of: pm
    blocks_run: false
    evidence_page: 217

  - question: >
      Is a 30bp round-trip cost floor appropriate for a 30-name mega-cap panel, or should this
      card use a lower blue-chip-specific cost assumption given these are among the most liquid
      names on the exchange?
    why_it_matters: >
      The fund's standing 30bp policy is set for factor-sleeve-level trading; individual
      mega-cap names (Reliance, HDFC Bank, TCS, etc.) typically trade tighter than that in
      practice, so 30bp may be conservative rather than realistic for this specific universe.
    what_i_assumed: >
      Kept the fund-wide 30bp standard per CLAUDE.md's explicit instruction not to copy a
      paper's own cost assumption, and because deviating downward without a stated basis would
      flatter the result.
    ask_of: pm
    blocks_run: false
    evidence_page: null

n_configs_tried: 1

notes: >
  TEMPLATE CORRECTION FROM THE EARLIER DRAFT: the prior transcript-based version of this card
  used ts_momentum (a template built for holding ALL positive-momentum sleeves, sized
  inverse-vol, across a small set of pre-existing return streams -- see
  ros/engine/templates.py TimeSeriesMomentum). That is a poor structural fit for a "rank many
  names, hold the top 40% quantile" mechanism. cross_sectional (ros/engine/templates.py
  CrossSectional) is the template actually built for this shape: score every security, sort,
  hold the top slice, long-only. This card uses it instead. The unresolved gap either template
  choice still leaves is the SCORE, not the allocation shape: neither the old nor the new
  choice can compute the paper's own 4-metric composite, because no registered primitive in
  ros/engine/prepare.py does anything beyond ewma or trailing momentum. See
  strategy.template_gap for the specification a human would need to build.

  WHAT THIS CARD ACTUALLY ASKS FOR (Gate A): the 30 individual daily price series named in
  data_requirements above (NSE-listed, for the paper's own named companies), a NIFTY 50 index
  series, and -- optionally -- a real Indian risk-free yield series and an official NIFTY 50
  membership file. None of these are in this fund's current data registry and none are proxied
  here. If the blocking stock-level data cannot be sourced, that should be recorded as a Step
  03 FAIL_FAST finding -- a real, useful outcome -- rather than substituting sleeve indices
  again.

  Should never be scored against the paper's own reported per-period returns or its rejection
  of H0 -- even with the requested data, this remains a long-only, single-signal (momentum)
  proxy for a long-short, multi-metric mechanism.
