backtest_plan:
  sample_start: "2019-04-01"
  sample_end: "2024-09-30"
  why_this_window: >
    Matches the paper's own sample exactly (p.212), so any comparison to the paper's reported
    windows is apples-to-apples in TIME even though the mechanism differs (long-only vs
    130/30). Includes a full pre-COVID/COVID/post-COVID cycle and two of the paper's own
    "un-implementable" half-years, which is itself useful information about the mechanism's
    practical uptime.
  warmup_days: 126
  why_warmup: >
    The first classification needs a full trailing 126-trading-day (~6-month) window of daily
    returns to compute the momentum proxy (and, were it ever built, the paper's own Tracking
    Error/IR/Sharpe/Treynor) before the first holding period can begin; without this the first
    live period would trade on a partially-formed signal.
  rebalance_rule: >
    Quarterly, on the first trading day of the new period; signal recomputed on a trailing
    126-day window each time. The fund's REBALANCE vocabulary has no semi-annual option, so
    this trades roughly 2x as often as the paper's own non-overlapping 6-month cycle
    (correcting the earlier transcript-based card, which used the same quarterly compromise
    but under the ts_momentum template).
  weights_rule: >
    Equal-weighted within the held quantile (top 40%), matching the paper's own equal-
    weighting within each cohort (p.212-213); long-only, no leverage, scaled to 100% gross (not
    the paper's 130%) -- see strategy.long_only_adaptation.
  benchmarks:
    - name: "NIFTY 50"
      why_this: >
        The fund's chosen catalogued analogue for this universe (Stage 01 universe_translation)
        and the do-nothing option: simply hold the index instead of running the strategy.
    - name: "BSE SENSEX"
      why_this: >
        The paper's own literal benchmark (p.212) -- included so this run's cohort-selection
        edge can still be read against the paper's own stated comparator.
    - name: "Equal-weight, the paper's 30 named stocks"
      why_this: >
        Isolates what the ranking machinery buys over simply holding the same 30-name universe
        equally weighted with no selection at all -- the standard test for whether a
        cross-sectional score adds anything beyond passive breadth.
    - name: "NIFTY 500"
      why_this: >
        The fund's own mandate benchmark; every strategy is ultimately judged against it
        regardless of the universe it trades within.
  must_beat:
    - "NIFTY 50"
    - "NIFTY 500"
    - "Equal-weight, the paper's 30 named stocks"
  success_looks_like: >
    The long-only cohort's risk-adjusted return (Sharpe) beats NIFTY 50, NIFTY 500 and the
    equal-weight-of-universe benchmark net of the fund's 30bp cost floor, across the
    deflated-Sharpe and walk-forward robustness checks -- using a momentum proxy that is a
    materially CRUDER stand-in for the paper's own 4-metric risk-adjusted score, so a pass here
    is evidence the general "reward relative outperformers" shape survives in long-only Indian
    mega-caps, not evidence for the paper's specific 4-metric mechanism.
  failure_looks_like: >
    The cohort fails to beat one or more of the named benchmarks, OR clears the
    India-validated rung but fails the selection-bias-deflated Sharpe (this fund's own prior
    runs on structurally similar momentum-shaped adaptations -- tripathi_2009_momentum_effect
    and moskowitz_2012_tsmom_india -- have both landed here: P(skill) 0.5% and REJECTED
    respectively, per the strategy library's factor-fingerprint match), OR the strategy proves
    untradeable as often as the paper's own construction was (author-acknowledged 4 of 10
    windows, p.216).
  known_failure_modes:
    - >
      Thin cross-section: even at 30 names, a 40% quantile cohort is ~12 names -- membership
      churn, delistings or data gaps could shrink this further mid-sample, triggering the
      template's min_names skip-and-hold-previous-weights behaviour, which is NOT the paper's
      own "skip the period" behaviour.
    - >
      Momentum-as-proxy risk: the engine can only score names on trailing momentum or EWMA,
      not the paper's own risk-adjusted 4-metric composite -- a pass or fail here is evidence
      about a momentum tilt in Indian mega-caps, not about the paper's specific claim.
    - >
      Cost mismatch: this fund's 30bp round-trip is meaningfully lower than the paper's own
      blended ~110bp (which priced a short leg this card does not run), but also excludes
      market impact for the less liquid tail of the panel across 5.5 years.
    - >
      COVID-period distortion: a large share of the sample window sits in or immediately after
      the 2020 crash and the 2021 second wave, both flagged by the paper's own authors as
      anomalous (p.217).

